<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#F4F5F7; --panel:#FFFFFF; --panel-2:#F9FAFB; --ink:#0E1116; --mute:#596172; --faint:#8A92A3; --line:#E0E3E9;

}
:root[data-theme="dark"]{
  --bg:#0A0B0F; --panel:#12141A; --panel-2:#0F1116; --ink:#EBEEF4; --mute:#9BA3B3; --faint:#6B7384; --line:#232733;
  --ok:#4ADE9B; --ok-bg:#0F2A1F; --bad:#FF8A80; --bad-bg:#2D1514;
  --accent:#2DD4BF; --on-accent:#04201B;

}
:root[data-subject="Maths"]{ --accent:#4338CA; --on-accent:#FFFFFF; }
:root[data-theme="dark"][data-subject="Maths"]{ --accent:#9AA2FF; --on-accent:#10123A; }
.accent-soft{ background:color-mix(in srgb,var(--accent) 11%,transparent); }

/* ---------- Base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- Header ---------- */
.top{background:var(--bg);border-bottom:1px solid var(--line)}
@media (min-width:960px){.top{position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.4) blur(10px);background:color-mix(in srgb,var(--bg) 88%,transparent)}}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em;text-decoration:none}
.mark{width:22px;height:22px;position:relative}
.mark i{position:absolute;background:var(--ink);border-radius:2px}
.mark i:nth-child(1){left:0;top:4px;width:12px;height:12px}
.mark i:nth-child(2){right:0;top:0;width:8px;height:8px;background:var(--accent)}
.mark i:nth-child(3){right:2px;bottom:0;width:6px;height:6px;opacity:.55}
.iconbtn{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mute);background:var(--panel)}

.ctx{display:flex;flex-wrap:wrap;gap:12px 32px;padding:0 0 14px}

.btn:hover{border-color:var(--faint)}

.opt:not([disabled]):hover{border-color:var(--accent)}

.opt.ok{border-color:var(--ok);background:var(--ok-bg)}

.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.ok .ic{color:var(--ok)}.opt.bad .ic{color:var(--bad)}
.why{margin-top:12px;font-size:14px;color:var(--mute);padding-left:2px}
.why b{color:var(--ink)}

.result .pct{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.result p{color:var(--mute);margin:8px auto 18px;max-width:46ch}

/* ---------- Model papers ---------- */

.pq{padding:18px 22px;border-bottom:1px solid var(--line)}
.pq:last-child{border-bottom:0}
.pq .row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline}
.pq .no{font-weight:800;color:var(--accent)}

.pq .m{font-size:12px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.pq .tg{margin:10px 0 0 42px}
.pq .tg button{font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:6px;padding:2px 0}
.ans{display:none;margin:8px 0 0 42px;padding:12px 14px;border-radius:10px;background:var(--ok-bg);font-size:14.5px;line-height:1.6}

/* ---------- Footer ---------- */
.foot{border-top:1px solid var(--line);background:var(--panel-2)}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between;align-items:center;padding-top:20px;padding-bottom:20px;font-size:13px;color:var(--mute)}

<script>
/*
 * ============================================================================
 *  CHAOS LEARNING — Sovereign Open Framework Platform © 2026
 *  Platform Architect: V B Roohith Saravanan  |  roohithsara19@gmail.com
 *  Module: Curriculum dataset + UI engine

/* ---------- Helpers (dense data constructors) ---------- */
const META = {
  platform: "Chaos Learning",
  framework: "Chaos Learning (Sovereign Open Framework Platform © 2026)",
  architect: "V B Roohith Saravanan",
  contact: "roohithsara19@gmail.com",
  ecosystem: "chaos-learning-repository",
  schemaVersion: "1.0.0",
  copyright: "© 2026 Chaos Learning"
};
const S  = (t, x, e) => ({ t, x, e });                 // section: title, body html, solved example
const Qz = (q, c, a, e) => ({ q, c, a, e });           // quiz item: question, choices, correct index, explanation
const SCH = {
  2: "2 marks each: 1 mark for the correct answer/idea, 1 mark for correct term, unit or brief justification.",
  4: "4 marks each: 1 for method/concept, 2 for correct working (1 per step), 1 for final answer with units. Follow-through marks allowed.",
  6: "6 marks each: 2 for setup/concept, 3 for reasoning and working, 1 for conclusion. Partial credit for any valid method."
};
const mk = (n, lvl, time, m, arr) => ({ n, lvl, time, m, total: m * 5, scheme: SCH[m], qs: arr.map(([q, a]) => ({ q, a, m })) });
const PP = (e, m, h) => [mk("Paper 1", "Easy", "20 min", 2, e), mk("Paper 2", "Medium", "40 min", 4, m), mk("Paper 3", "Hard", "60 min", 6, h)];
const C = (t, secs, bites, quiz, papers) => ({ t, secs, bites, quiz, papers,
  meta: { ecosystem: META.ecosystem, architect: META.architect, framework: META.framework, contact: META.contact } });

const CL_PARTS = {}; // chapters 2-8 of every subject, one block per grade|subject

// Chaos Learning - Sovereign Open Framework Platform (c) 2026 | Platform Architect: V B Roohith Saravanan | roohithsara19@gmail.com | Part: Class 6 Science ch2-8
CL_PARTS["6|Science"] = [
C({ CBSE: "Sorting Materials into Groups", ICSE: "Classification and Properties of Materials", IB: "How and Why Do We Group Materials?" },
[ S("1. Objects and the Materials They Are Made Of",
 "Objects are made of one or more <b>materials</b> such as wood, glass, metal, plastic, cotton, paper and leather. The same material can make many objects, and one object (like a pen) can use several materials. Materials are chosen for their <b>properties</b>: a cooking pan is metal because it conducts heat, while its handle is plastic or wood because these are poor conductors. Grouping materials by shared properties is called <b>classification</b>, and it makes selection and study easier.",
 "<b>Solved example:</b> Why is a window made of glass and not wood? Glass is <b>transparent</b>, so light and the outside view pass through; wood is opaque."),
 S("2. Properties Used for Grouping",
 "<b>Appearance:</b> metals have <b>lustre</b> (shine) while wood and cloth are dull. <b>Hardness:</b> iron and diamond are hard; cotton and sponge are soft. <b>Solubility:</b> sugar and salt <b>dissolve</b> (soluble) in water but sand and chalk do not (insoluble). <b>Float or sink:</b> materials less dense than water float, denser ones sink. <b>Transparency:</b> <b>transparent</b> (clear glass) lets light pass and objects are seen clearly, <b>translucent</b> (butter paper) lets light pass partly, <b>opaque</b> (wood, metal) lets none pass.",
 "<b>Solved example:</b> Sort sugar, sand, oil, vinegar by water behaviour. Sugar dissolves; sand does not; oil does not mix (floats); vinegar mixes completely, so it is <b>miscible</b>."),
 S("3. Soluble, Miscible and Conducting Materials",
 "Liquids that mix completely (water and vinegar, water and alcohol) are <b>miscible</b>; liquids that form separate layers (oil and water) are <b>immiscible</b>. A <b>conductor</b> allows heat or electricity to pass easily (metals, graphite); an <b>insulator</b> does not (plastic, rubber, wood). Materials can be grouped by several properties at once, and no single property gives the only correct grouping. Water is a good solvent, but a given amount can dissolve only a limited amount of a solid.",
 "<b>Solved example:</b> Why do electricians use rubber gloves? Rubber is an <b>insulator</b>, so current cannot pass through it to the body.") ],
[ ["Liquid elements", "Only two elements are liquid at ordinary room temperature and pressure: mercury (a metal) and bromine (a non-metal). Gallium, a metal, melts at about 29.8 C, so it melts in your hand."],
  ["Ice floats", "Ice has a density of about 0.92 g/cm^3, lower than liquid water, because hydrogen bonding forces an open hexagonal lattice. Water is densest near 4 C."],
  ["Same carbon, different hardness", "Diamond and graphite are both pure carbon. Diamond is the hardest natural substance and an electrical insulator, while soft graphite conducts electricity."],
  ["Densest element", "Osmium (about 22.6 g/cm^3) is the densest naturally occurring element, followed closely by iridium."],
  ["Best conductors", "Silver is the best electrical conductor of all metals, then copper and gold. Metals conduct well because of free electrons; most non-metals have none, but graphite is an exception."] ],
[ Qz("Which of these materials is translucent?", ["Clear glass", "Butter paper", "Wood", "Iron sheet"], 1, "Butter paper lets some light through but objects behind look blurred."),
  Qz("Two liquids that mix completely in all proportions are called:", ["Immiscible", "Insoluble", "Miscible", "Opaque"], 2, "Miscible liquids such as water and vinegar form a single layer."),
  Qz("Why is the handle of a pressure cooker made of plastic?", ["Plastic is shiny", "Plastic is dense", "Plastic dissolves in water", "Plastic is a poor conductor of heat"], 3, "A poor conductor keeps the handle from getting hot."),
  Qz("Which of the following is the only metal that is liquid at room temperature?", ["Mercury", "Sodium", "Gallium", "Lead"], 0, "Mercury is liquid at room temperature; gallium melts only at about 30 C."),
  Qz("Which sinks in water?", ["Cork", "Dry wood", "Iron nail", "Plastic bottle cap"], 2, "Iron is much denser than water so the nail sinks.") ],
PP([ ["Define the term property of a material and give two examples.", "A property is a characteristic by which a material can be identified or used. Examples: hardness and solubility (also lustre, transparency)."],
     ["Name one transparent, one translucent and one opaque material.", "Transparent: clear glass. Translucent: butter paper (or frosted glass). Opaque: wood or metal."],
     ["What is meant by lustre? Which group of materials usually shows it?", "Lustre is the shine of a material surface. Metals usually show lustre."],
     ["Why are cooking utensils usually made of metals?", "Metals are good conductors of heat, so heat passes quickly to the food. They are also hard and durable."],
     ["Give one example each of a soluble and an insoluble substance in water.", "Soluble: sugar (or salt). Insoluble: sand (or chalk)."] ],
  [ ["Differentiate between miscible and immiscible liquids with one example each.", "Miscible liquids mix completely to form one uniform layer, e.g. water and vinegar. Immiscible liquids do not mix and form separate layers, e.g. oil and water. Oil floats because it is less dense than water. Miscibility is a property of the liquids concerned."],
    ["Explain why a stone sinks but a piece of cork floats in water.", "A material sinks if its density is greater than that of water and floats if its density is less. Stone is denser than water so it sinks. Cork contains trapped air and is less dense than water, so it floats. Float or sink depends on density, not on size or weight alone."],
    ["Classify the following into conductors and insulators of electricity: copper wire, rubber, iron nail, plastic scale, graphite.", "Conductors: copper wire, iron nail, graphite. Insulators: rubber, plastic scale. Metals and graphite have free charge carriers, while rubber and plastic do not."],
    ["A student tests chalk powder, salt, sugar and sand in water. Predict and justify the results.", "Salt and sugar dissolve, giving clear solutions, because they are soluble in water. Chalk powder and sand do not dissolve; they stay as suspended particles or settle at the bottom. Chalk powder may make the water cloudy for a while before settling."],
    ["Why are the windows of a bathroom often made of frosted glass?", "Frosted glass is translucent: it allows light to enter but scatters it so objects cannot be seen clearly. This gives light and privacy together. Clear glass would give no privacy and wood would give no light."] ],
  [ ["A solid block has mass 120 g and volume 100 cm^3. Find its density and say whether it floats in water (1 g/cm^3) and in mercury (13.6 g/cm^3). Give reasons.", "Density = mass / volume = 120 / 100 = 1.2 g/cm^3. Since 1.2 is greater than 1, it sinks in water. Since 1.2 is much less than 13.6, it floats in mercury. A body floats in a liquid whenever its density is less than that of the liquid, so the same block can sink in one liquid and float in another."],
    ["You are given a mixture of iron filings, sand, salt and sawdust. Design a classification-based plan to separate all four, based on their properties.", "Use a magnet to remove iron filings (magnetic). Add water: sawdust floats and is skimmed or scooped off; salt dissolves while sand sinks. Filter to separate the sand. Evaporate the filtrate to get salt. Each step uses a different property: magnetism, density and solubility."],
    ["An egg sinks in plain water but floats when a lot of salt is dissolved. Explain, and say what would happen if fresh water is then added slowly.", "Egg density is about 1.03 g/cm^3, a little above plain water, so it sinks. Dissolving salt raises the density of the solution above that of the egg, so the egg floats. Adding fresh water slowly lowers the density of the solution; at a certain point it falls below that of the egg and the egg sinks again."],
    ["Explain why one object, a torch, is made of several materials. Name three parts, their materials and the property that justifies each.", "Body: plastic, an insulator that is light and does not conduct current to the hand. Contacts or spring: metal, a conductor that completes the circuit. Front cover: transparent glass or plastic that lets light out. The materials are chosen part by part, according to the property needed in that part."],
    ["Two clear colourless liquids A and B are given. A mixes with water, B forms a separate layer on top. Name two possible tests and conclusions, and state what you can infer about the relative densities of B and water.", "Test 1: add equal water to each; A gives one layer (miscible), B gives two layers (immiscible). Test 2: shake and let stand; B separates again. B forms the top layer, so B is less dense than water, e.g. oil. A could be vinegar or alcohol. The result shows miscibility and density are separate properties."] ])
),

C({ CBSE: "Separation of Substances", ICSE: "Methods of Separating Mixtures", IB: "How Can We Pull a Mixture Apart?" },
[ S("1. Why and How We Separate",
 "We separate substances to remove <b>unwanted</b> or harmful parts (stones from rice) or to get <b>useful</b> parts (cream from milk). Common methods are <b>handpicking</b> for large pieces, <b>threshing</b> (separating grain from stalks), <b>winnowing</b> (wind blows lighter husk away while heavier grain falls down), and <b>sieving</b> (fine particles pass through holes while larger ones stay). A mixture of iron and sulphur can be separated using a <b>magnet</b>, since only iron is attracted.",
 "<b>Solved example:</b> Which method separates wheat flour from small stones? <b>Sieving</b>: flour passes through the holes of the sieve and stones remain."),
 S("2. Sedimentation, Decantation and Filtration",
 "In <b>sedimentation</b> heavier insoluble particles settle at the bottom of water. Pouring off the clear liquid without disturbing the sediment is <b>decantation</b>. In <b>filtration</b> a mixture is passed through filter paper: the clear <b>filtrate</b> passes through and the insoluble <b>residue</b> stays on the paper. <b>Loading</b> (adding alum) makes tiny suspended particles clump and settle faster. <b>Churning</b> or centrifugation separates cream from milk because the lighter cream collects.",
 "<b>Solved example:</b> Muddy water is left overnight, poured off, and then passed through a cloth. The first step is <b>sedimentation</b>, then <b>decantation</b>, then <b>filtration</b>."),
 S("3. Evaporation, Condensation and Saturated Solutions",
 "<b>Evaporation</b> turns a liquid into vapour below its boiling point, so a dissolved solid such as salt is left behind when salt solution is heated. <b>Condensation</b> is the cooling of vapour into liquid, used to collect pure water in <b>distillation</b>. A solution in which no more solute can dissolve at that temperature is <b>saturated</b>. Heating usually allows more solid to dissolve, and a solid can also be separated by cooling or evaporating a saturated solution to form crystals.",
 "<b>Solved example:</b> About 36 g of salt dissolves in 100 g of water at room temperature (20 C). If 50 g of salt is added to 100 g water, <b>14 g stays undissolved</b>.") ],
[ ["Fractional distillation", "Miscible liquids with different boiling points, such as ethanol (78.4 C) and water (100 C), are separated by fractional distillation using a column that repeatedly condenses and re-evaporates the vapour."],
  ["Sublimation", "Ammonium chloride, camphor, naphthalene and iodine sublime, passing straight from solid to vapour. This lets them be separated from non-subliming solids like salt or sand."],
  ["Chromatography Rf", "In paper chromatography the Rf value is the distance moved by the solute divided by the distance moved by the solvent. It is always less than 1 and characteristic for a substance in a given solvent."],
  ["Immiscible liquids", "Immiscible liquids like oil and water are separated with a separating funnel, which uses the density difference to drain the lower layer."],
  ["Solubility and temperature", "For most solids solubility rises with temperature, but for a few, such as calcium hydroxide, it falls. Common salt shows only a tiny rise with temperature, so its crystals are obtained mainly by evaporation."] ],
[ Qz("Which method is used to separate husk from grains using wind?", ["Sieving", "Threshing", "Handpicking", "Winnowing"], 3, "Winnowing uses wind: lighter husk is blown away while heavier grain falls."),
  Qz("Separating cream from milk uses:", ["Filtration", "Centrifugation or churning", "Evaporation", "Magnetic separation"], 1, "Spinning or churning collects the lighter cream away from the denser skimmed milk."),
  Qz("Salt is recovered from sea water mainly by:", ["Decantation", "Winnowing", "Evaporation", "Sieving"], 2, "Solar heat evaporates the water and salt crystals remain."),
  Qz("Which of these mixtures is separated by sublimation?", ["Sand and water", "Ammonium chloride and salt", "Sugar and water", "Iron and sand"], 1, "Ammonium chloride sublimes; salt does not."),
  Qz("In filtration, the solid left on the filter paper is called:", ["Residue", "Filtrate", "Distillate", "Solute"], 0, "The residue remains on the paper while the filtrate passes through.") ],
PP([ ["Define winnowing.", "Winnowing is the separation of lighter husk from heavier grain by the wind or by a blower, as husk is blown away while grain falls down."],
     ["Name the method used to separate tea leaves from tea.", "Filtration (using a strainer or sieve), which holds back leaves and lets tea through."],
     ["What is decantation?", "Decantation is gently pouring off the upper clear liquid after the solid has settled, without disturbing the sediment."],
     ["What is a saturated solution?", "A solution that cannot dissolve any more solute at that temperature."],
     ["Which property of iron lets it be separated from sulphur?", "Iron is attracted by a magnet while sulphur is not, so a magnet separates them."] ],
  [ ["Describe how you would obtain clear drinking water from muddy pond water in the steps of sedimentation, decantation and filtration, and say why alum is used.", "Leave the muddy water so the heavy particles settle (sedimentation). Pour off the upper water (decantation). Pass it through filter paper or cloth to remove fine particles (filtration). Alum is used for loading: it makes tiny suspended particles stick together and settle faster."],
    ["How is common salt obtained from sea water, and why is it still impure?", "Sea water is run into shallow pans and the sun evaporates the water, leaving salt crystals. The salt is impure because other dissolved substances (magnesium and calcium salts) and some mud crystallise with it. It is purified by dissolving, filtering and recrystallising."],
    ["Explain how you would separate a mixture of sand, salt and iron filings.", "Pass a magnet over the mixture to remove iron filings. Add water to dissolve the salt and filter to collect the sand as residue. Evaporate the filtrate to get salt."],
    ["Why does evaporation not work for separating alcohol from water, but distillation does?", "Both liquids evaporate, so neither is left behind. In distillation the mixture is heated and alcohol, which has the lower boiling point (78 C), vaporises first. The vapour is condensed separately and collected as the distillate."],
    ["Why is it said that a sieve works only when particles differ in size?", "A sieve has holes of a fixed size, so particles smaller than the holes pass through while larger ones stay. If both components are smaller or larger than the holes, they will not separate."] ],
  [ ["At 20 C, 36 g salt saturates 100 g water. (a) How much salt is in 272 g of the saturated solution? (b) How much solid would you get by evaporating all the water?", "(a) 100 g water holds 36 g salt, so the solution weighs 136 g. 272 g is two times that, so 72 g salt and 200 g water. (b) Evaporating all water leaves 72 g of salt. Check: 72 + 200 = 272 g."],
    ["A mixture contains sand, iron filings, oil and water. Plan the steps in a proper order and name the property used in each.", "Step 1: remove iron by a magnet (magnetism). Step 2: filter to remove the sand (particle size or insolubility). Step 3: put the filtrate in a separating funnel and drain the lower water, leaving the upper oil (density difference and immiscibility). Magnet first is best as the iron would otherwise clog or mix with the sand."],
    ["Why does a saturated solution of salt, when cooled slowly, give bigger crystals than when cooled rapidly?", "Slow cooling gives particles time to arrange in an orderly way on a few seed crystals which keep growing. Fast cooling forms many nuclei at once, so many small crystals appear. Hence slow cooling is used for large, pure crystals."],
    ["In paper chromatography a black ink spot separates into three bands. The solvent front travels 8 cm; the bands travel 2 cm, 4 cm and 6 cm. Find Rf values and say which dye is most soluble in the solvent.", "Rf = distance moved by the dye / distance moved by the solvent. Rf values are 2/8 = 0.25, 4/8 = 0.50 and 6/8 = 0.75. The dye with Rf 0.75 moved furthest, so it is most soluble in the solvent or least strongly held by the paper. Black ink is therefore a mixture of three dyes."],
    ["A farmer has wheat mixed with husk, small stones and iron nails. Suggest a sequence of separation and justify each choice, and explain why the sequence matters.", "First winnow to blow away the light husk. Then use a magnet to remove the iron nails. Handpick or sieve to remove the stones: a sieve with holes that pass wheat but not stones, or handpicking. The order matters because the husk is cheapest to remove by wind first, and it reduces the bulk for the other steps."] ])
),

C({ CBSE: "Getting to Know Plants", ICSE: "Plants: Structure and Parts", IB: "How Do the Parts of a Plant Work Together?" },
[ S("1. Herbs, Shrubs and Trees",
 "Plants are grouped by size and stem. <b>Herbs</b> are small with soft green stems (tomato, mint, wheat). <b>Shrubs</b> are medium sized with many woody branches near the base (rose, hibiscus). <b>Trees</b> are tall with a hard thick brown <b>trunk</b> and branches higher up (mango, neem). <b>Creepers</b> spread on the ground and <b>climbers</b> need support, such as pumpkin and grapevine, because their stems are weak.",
 "<b>Solved example:</b> A plant 30 cm tall with a green, soft stem is a <b>herb</b>. A rose bush with woody branches from the base is a <b>shrub</b>."),
 S("2. Stem, Root and Leaf",
 "The <b>stem</b> holds the plant up, carries water and minerals through <b>xylem</b> and food through <b>phloem</b>. <b>Roots</b> anchor the plant and absorb water and minerals. A <b>taproot</b> (mustard, carrot) has one main root and goes with leaves that have <b>reticulate</b> (net) venation; <b>fibrous roots</b> (wheat, grass) have many equal roots and go with <b>parallel</b> venation. A leaf has a <b>lamina</b>, <b>petiole</b> and veins; food is made by <b>photosynthesis</b> in the leaves, and water leaves as vapour by <b>transpiration</b>.",
 "<b>Solved example:</b> A leaf shows parallel veins. Its roots are most likely <b>fibrous</b> (monocot, like grass or maize)."),
 S("3. The Flower",
 "A flower is the reproductive part. Its parts are <b>sepals</b> (green, protect the bud), <b>petals</b> (colourful, attract insects), <b>stamens</b> (male: anther and filament, anther makes pollen) and the <b>pistil</b> (female: stigma, style and ovary containing ovules). After fertilisation the ovary becomes the <b>fruit</b> and the ovules become <b>seeds</b>. A flower with both stamens and pistil is <b>bisexual</b>; with only one it is <b>unisexual</b>.",
 "<b>Solved example:</b> A cucumber plant has male and female flowers on it. Which part will become the fruit? The <b>ovary</b> of the female flower.") ],
[ ["Stomata", "Most leaves have more stomata on the lower surface, reducing water loss in sunlight. Each pore is controlled by two guard cells, which swell with water to open it."],
  ["Transpiration pull", "Water rises in tall trees mostly by transpiration pull: evaporation from leaves sucks a continuous water column up the xylem because water molecules cohere. Roots alone cannot push it so high."],
  ["Giant flower", "Rafflesia arnoldii has one of the largest single flowers, about 1 m across, and smells like rotting meat to attract flies. It has no leaves, stem or true roots of its own."],
  ["Mangrove roots", "Mangroves such as Avicennia have upward-growing breathing roots called pneumatophores, which take in air in waterlogged salty mud."],
  ["Xylem and phloem", "Xylem carries water and minerals upward and is made of dead cells in mature wood. Phloem carries sugars in both directions and has living sieve tubes."] ],
[ Qz("Which part of a flower makes pollen?", ["Stigma", "Ovary", "Sepal", "Anther"], 3, "Anther is the pollen-producing part of the stamen."),
  Qz("A plant with a weak stem that needs support is a:", ["Shrub", "Tree", "Climber", "Herb with woody stem"], 2, "Climbers like grapevine twine round or hold on to a support."),
  Qz("Reticulate venation is usually found with:", ["Taproot", "Fibrous roots", "Aerial roots", "No roots"], 0, "Dicots usually have net veins and taproots."),
  Qz("Water is lost from leaves as vapour through tiny pores called:", ["Lenticels", "Stomata", "Xylem", "Veins"], 1, "The process is transpiration, mainly through stomata."),
  Qz("After fertilisation the ovules develop into:", ["Fruits", "Petals", "Seeds", "Pollen"], 2, "The ovary becomes the fruit and the ovules become seeds.") ],
PP([ ["Name the three types of plants classified by stem and size.", "Herbs, shrubs and trees."],
     ["What is the function of the root?", "It anchors the plant in the soil and absorbs water and minerals."],
     ["Name the two types of venation in leaves.", "Reticulate (net) venation and parallel venation."],
     ["Which part of a flower is the female reproductive part?", "The pistil (stigma, style and ovary)."],
     ["What is photosynthesis?", "The process in which green leaves make food from carbon dioxide and water using sunlight and chlorophyll."] ],
  [ ["Differentiate between a taproot and fibrous roots with an example of each.", "A taproot has one thick main root with thin lateral roots; example: carrot or mustard. Fibrous roots are many thin roots of similar size arising from the base of the stem; example: wheat or grass. Taproots go with reticulate venation and fibrous roots with parallel venation."],
    ["Describe the functions of the sepals, petals, stamens and pistil.", "Sepals protect the flower in bud. Petals are bright and attract insects for pollination. Stamens (anther and filament) produce pollen grains, which carry the male gametes. The pistil receives pollen on the stigma and its ovary holds ovules, which become seeds."],
    ["Explain the term transpiration and give two of its benefits.", "Transpiration is loss of water vapour from the leaves through stomata. It cools the plant and creates suction that pulls water and minerals up from the roots. It also keeps up the flow of minerals to leaves."],
    ["Why is the stem called the transport channel of the plant?", "The stem holds branches and leaves up and has xylem, which carries water and minerals from roots to the leaves, and phloem, which carries the food made in leaves to all parts."],
    ["Why are bright petals and nectar useful to the plant and not just ornamental?", "Colour and scent attract insects like bees to the flower. While they collect nectar, pollen sticks to them and is carried to another flower. This pollination leads to fertilisation and formation of fruits and seeds."] ],
  [ ["A leaf is placed in sunlight and its lower surface is coated with Vaseline, and another leaf has the upper surface coated. Which will lose less water? Explain and say what the experiment shows.", "The leaf with the lower surface coated loses much less water, because most stomata are on the lower surface and Vaseline blocks them. The leaf with only the upper surface coated still loses water through the open lower stomata. This shows transpiration occurs mainly through stomata."],
    ["A white flower stalk is placed in coloured water and the colour appears in the petals the next day. What does this show, and why does it work faster in a warm, dry, windy room?", "It shows that water is carried through the stem by xylem to the petals. In warm, dry, windy conditions transpiration is faster, so the pull on the water column is stronger and the dye rises sooner."],
    ["A plant has leaves with parallel veins, fibrous roots and small green flowers in a spike. Name its likely class of plant and give a reason, then say what type of plant has net veins and a taproot.", "It is a monocot (like wheat or maize), because parallel venation and fibrous roots occur together. A plant with net venation and a taproot is a dicot (like mustard, gram or mango)."],
    ["Explain, with a flow of events, how a flower becomes a fruit.", "Pollen from the anther lands on the stigma (pollination). A pollen tube grows down the style to the ovule in the ovary and fertilises it. The ovule becomes a seed and the ovary wall grows into the fruit. Petals and stamens usually wither."],
    ["Explain why the death of a tree after a ring of bark is removed all round happens in a few weeks to months, even though the wood inside is untouched.", "Bark includes phloem, which carries food from leaves to roots. A complete ring removed cuts phloem, so the roots are starved while the xylem continues to carry water for some time. The roots eventually die and can no longer supply water and minerals, so the whole tree dies."] ])
),

C({ CBSE: "Body Movements", ICSE: "Movement in Animals and Humans", IB: "How Do Bodies Move and Why?" },
[ S("1. Joints and Types of Movement",
 "A <b>joint</b> is a place where two or more bones meet, letting parts of the body move. <b>Ball and socket</b> joints (shoulder, hip) allow movement in all directions. <b>Pivot</b> joints (neck: atlas on axis) allow rotation, as when you shake your head to say no. <b>Hinge</b> joints (elbow, knee, fingers) move in one direction like a door. <b>Fixed</b> joints (skull bones) do not move at all, and <b>gliding</b> joints (wrist and ankle) let bones slide over each other.",
 "<b>Solved example:</b> Which joint helps you bend your knee but not rotate it? A <b>hinge joint</b>, which permits movement in one plane only."),
 S("2. Skeleton and Muscles",
 "The human <b>skeleton</b> has about <b>206 bones</b> in an adult. The <b>skull</b> protects the brain, the <b>ribcage</b> (12 pairs of ribs) protects the heart and lungs, and the <b>backbone</b> (vertebral column) protects the spinal cord. Some parts, like the ear flap and tip of the nose, are made of soft bendable <b>cartilage</b>. <b>Muscles</b> move bones by contracting and pulling; they work in <b>pairs</b>, such as the <b>biceps</b> and <b>triceps</b>, as a muscle can only pull and not push.",
 "<b>Solved example:</b> While lifting your forearm, biceps <b>contracts</b> and triceps <b>relaxes</b>. While lowering it, the triceps contracts and biceps relaxes."),
 S("3. Movement in Animals",
 "<b>Earthworm:</b> moves by alternate contraction and relaxation of muscles, with tiny bristles (setae) gripping the soil and slime easing the movement. <b>Snail:</b> a muscular foot with slime produces a gliding movement. <b>Cockroach:</b> three pairs of legs and two pairs of wings for walking and flying. <b>Birds:</b> light hollow bones, strong chest muscles for flying. <b>Fish:</b> streamlined body, with muscles on both sides of the body producing S-shaped curves and fins steering. <b>Snakes:</b> move by body muscles along a long backbone with many ribs, in loops and curves.",
 "<b>Solved example:</b> Why is a fish streamlined? A pointed, smooth shape cuts through the water with <b>less resistance</b>, so it swims faster using less energy.") ],
[ ["Counting bones", "A newborn has about 270 to 300 bones, which fuse into 206 in an adult. The bones of the skull, the sacrum and the coccyx fuse during growth."],
  ["Smallest and longest", "The stapes in the middle ear is the smallest bone, about 3 mm long. The femur (thigh bone) is the longest and strongest bone."],
  ["Tendons and ligaments", "A tendon joins muscle to bone and a ligament joins bone to bone. Ligaments are slightly stretchy to stabilise the joint, but tendons are inelastic and transmit force."],
  ["Hands and feet", "Each hand has 27 bones and each foot has 26, so the hands and feet together hold more than half of the 206 bones (106)."],
  ["Synovial fluid", "Freely movable joints are enclosed in a capsule filled with synovial fluid, which lubricates the cartilage-covered bone ends and reduces friction."] ],
[ Qz("Which joint allows you to move your arm in all directions?", ["Hinge joint", "Ball and socket joint", "Fixed joint", "Pivot joint"], 1, "The shoulder is a ball and socket joint."),
  Qz("The bones of the skull are connected by:", ["Hinge joints", "Ball joints", "Gliding joints", "Fixed joints"], 3, "Skull bones (except the lower jaw) form fixed joints."),
  Qz("When the biceps contracts, the triceps:", ["Contracts too", "Becomes bone", "Relaxes", "Becomes cartilage"], 2, "Muscles work in pairs: one contracts while the other relaxes."),
  Qz("The number of bones in an adult human skeleton is about:", ["206", "300", "106", "450"], 0, "Adults have 206 bones."),
  Qz("The structure that joins a muscle to a bone is a:", ["Ligament", "Tendon", "Cartilage", "Vertebra"], 1, "Tendons connect muscles to bones; ligaments connect bone to bone.") ],
PP([ ["What is a joint?", "A joint is a place where two or more bones meet, allowing movement."],
     ["Name the bones that protect the brain and the heart.", "The skull protects the brain and the ribcage protects the heart."],
     ["Give one example each of a hinge joint and a ball and socket joint.", "Hinge: elbow or knee. Ball and socket: shoulder or hip."],
     ["Why do birds have hollow bones?", "Hollow bones make birds light, which helps them to fly."],
     ["What is cartilage? Give an example.", "Cartilage is a soft, bendable tissue. Example: ear flap or tip of the nose."] ],
  [ ["Explain how the biceps and triceps move the forearm.", "Muscles can only pull. To raise the forearm the biceps contracts and the triceps relaxes. To lower it the triceps contracts and the biceps relaxes. The two work as an antagonistic pair, with the elbow as a hinge joint."],
    ["Describe the movement of an earthworm.", "The earthworm has no bones. Its muscles contract and relax in turn along the body, which makes the body extend and then shorten. Tiny bristles hold the soil and slime from the skin lets it slide easily. The coordinated wave moves it forward."],
    ["Why is the neck joint called a pivot joint and what movements does it allow?", "At the neck, the atlas bone rotates on a peg of the axis bone, like a pivot. It lets the head turn from side to side, as in saying no, and also nod up and down at the joint above."],
    ["How do fish move through water? Mention two body features that help.", "The muscles on the two sides of the body contract alternately, forming S-shaped curves that push the water back. The tail fin pushes and other fins steer. The streamlined body reduces drag, and the swim bladder helps control floating."],
    ["Differentiate between ligament and tendon.", "A ligament joins one bone to another and holds the joint in position, being slightly elastic. A tendon joins muscle to bone and carries the pulling force of the muscle, being strong and inelastic."] ],
  [ ["A person's elbow is fixed straight in a cast for weeks. Explain why the muscles of the arm get weaker and why the joint becomes stiff.", "Muscles that are not used shrink and weaken, as work builds muscle. The joint is not moved, so synovial fluid circulation and flexibility reduce and ligaments and tendons tighten. Physiotherapy restores both."],
    ["Explain, with reasons, how a snake without limbs moves on land, and why it cannot move well on a perfectly smooth glass surface.", "A snake uses its long backbone and many ribs with muscles to throw the body into curves, pushing against the ground or rough points. Scales anchor it. On a perfectly smooth glass surface there are no points or friction to push against, so the sideways push does not give forward motion."],
    ["Design a simple model of a bone, joint and muscle using cardboard, balloons and strings. Say what each part represents and what you will observe.", "Two cardboard strips joined by a pin represent bones and a hinge joint. A string tied between them at the strips represents a tendon, and a balloon placed between them represents the muscle. Inflating (contracting) the balloon pulls the strips so the arm bends. Letting the air out relaxes it. The model shows that a muscle shortens when it contracts and bends the joint."],
    ["Why must a single muscle work only in one direction and what two-muscle arrangement does the body use to allow the bone to go both ways?", "A muscle produces force only when it contracts (shortens). When relaxed it cannot push the bone back. So the body uses antagonistic pairs: one muscle bends the joint and the other straightens it. Biceps and triceps in the arm, and hamstrings and quadriceps in the leg, are such pairs."],
    ["A baby has about 300 bones but an adult has 206. Explain this and say how it benefits the baby.", "Many bones of a baby are partly cartilage and separate, and fuse as the child grows, such as skull plates, sacrum and coccyx. Flexible skull bones and gaps help the head to pass through the birth canal and allow the brain to grow. The cartilage turns into bone gradually."] ])
),

C({ CBSE: "Light, Shadows and Reflections", ICSE: "Light: Shadows and Reflection", IB: "How Does Light Travel and Why Do Shadows Form?" },
[ S("1. Sources of Light and Types of Objects",
 "Objects that give out light of their own are <b>luminous</b> (the Sun, stars, a candle, a bulb); others, like the Moon, are <b>non-luminous</b> and are seen only because they <b>reflect</b> light. <b>Transparent</b> objects allow light to pass fully, <b>translucent</b> objects allow partial passage, and <b>opaque</b> objects do not allow any. Light travels in <b>straight lines</b>, which is why we cannot see around a corner. In a vacuum, light travels at about 3 x 10^8 m/s.",
 "<b>Solved example:</b> Is the Moon luminous? No. It is <b>non-luminous</b> and shines by reflecting sunlight."),
 S("2. Shadows and the Pinhole Camera",
 "A <b>shadow</b> forms when an <b>opaque</b> object blocks light, because light travels in a straight line. Three things are needed: a <b>source</b>, an <b>opaque object</b> and a <b>screen</b>. The shadow becomes bigger when the object is closer to the source. A <b>pinhole camera</b> forms a real, <b>inverted</b> image on a screen as light rays from each point on the object pass through a tiny hole in straight lines. Eclipses are large-scale shadows: in a <b>solar eclipse</b> the Moon is between the Sun and Earth, and in a <b>lunar eclipse</b> Earth is between the Sun and the Moon.",
 "<b>Solved example:</b> The shadow of a ball becomes larger when the ball is moved <b>towards the torch</b>, as it blocks a wider cone of light."),
 S("3. Reflection and Plane Mirrors",
 "Light bouncing back from a surface is <b>reflection</b>. In a <b>plane mirror</b> the image is <b>virtual</b> (cannot be on a screen), <b>erect</b>, the same size as the object and as far behind the mirror as the object is in front. The image is also <b>laterally inverted</b>: left appears right. The angle of incidence equals the angle of reflection. Smooth surfaces give regular reflection; rough surfaces scatter light, which is called diffuse reflection.",
 "<b>Solved example:</b> You stand 2 m from a plane mirror. The image is 2 m behind it, so the <b>distance between you and your image is 4 m</b>.") ],
[ ["Speed of light", "Light takes about 499 seconds (8 min 20 s) to travel from the Sun to Earth, and about 1.28 s from the Moon. The speed of light in vacuum is exactly 299,792,458 m/s."],
  ["Mirror rotation", "If a plane mirror is rotated by an angle theta, with the incident ray fixed, the reflected ray turns through 2 x theta."],
  ["Two mirrors", "Two plane mirrors at an angle theta form (360/theta) - 1 images when 360/theta is an integer. At 90 degrees there are 3 images and at 60 degrees there are 5 images."],
  ["Full-length mirror", "A mirror only half your height is enough to see your full image, as long as its upper edge is half-way between eye and head and the lower edge half-way between eye and feet. The result does not depend on your distance from the mirror."],
  ["Umbra and penumbra", "A large source gives a shadow with a dark umbra, where all light is blocked, and a lighter penumbra where only part is blocked. Total solar eclipse is seen from inside the umbra, partial from the penumbra."] ],
[ Qz("Which of these is a luminous object?", ["Moon", "Mirror", "Planet Venus", "Candle flame"], 3, "A candle emits its own light; the Moon and Venus only reflect."),
  Qz("The image formed by a plane mirror is:", ["Real and inverted", "Virtual and erect", "Real and erect", "Virtual and inverted"], 1, "A plane mirror image is virtual, erect, laterally inverted and the same size."),
  Qz("A pinhole camera forms an image that is:", ["Erect and virtual", "Erect and real", "Inverted and real", "Magnified and virtual"], 2, "Rays cross at the pinhole, so the image on the screen is real and inverted."),
  Qz("Which of these is translucent?", ["Frosted glass", "Wood", "Brick", "Aluminium foil"], 0, "Frosted glass lets some light through, but scattered."),
  Qz("A solar eclipse occurs when:", ["Earth is between Sun and Moon", "The Moon is between Sun and Earth", "Sun is between Earth and Moon", "Mars is between Sun and Moon"], 1, "The Moon blocks the Sun's light and its shadow falls on Earth.") ],
PP([ ["Differentiate between luminous and non-luminous objects with one example each.", "Luminous objects give out their own light, e.g. the Sun. Non-luminous objects do not, e.g. the Moon."],
     ["Name three things needed to form a shadow.", "A source of light, an opaque object and a screen."],
     ["What is meant by reflection of light?", "Bouncing back of light when it falls on a surface."],
     ["State the type of image in a pinhole camera.", "It is real and inverted."],
     ["What is lateral inversion?", "The left side of an object appears as the right side in the mirror image, and vice versa."] ],
  [ ["List the characteristics of an image formed by a plane mirror.", "The image is virtual, erect and the same size as the object. It is as far behind the mirror as the object is in front, and it is laterally inverted."],
    ["Why does the word AMBULANCE appear reversed on the front of the vehicle?", "It is written laterally inverted, so that a driver ahead who sees it in the rear-view mirror reads it correctly. This helps the driver to give way quickly."],
    ["Explain how a shadow is formed and why its size changes with the position of the object.", "Light travels in straight lines, so an opaque object stops the rays and the screen has a dark region behind it. When the object is nearer the source it intercepts a wider cone of rays, so the shadow is larger. When it moves towards the screen the shadow becomes smaller."],
    ["Explain what happens in a lunar eclipse and why it can be seen from the whole night side of Earth.", "Earth comes between the Sun and Moon, and Earth's shadow falls on the Moon. The Moon itself is in the shadow, so anyone on the night side of Earth that can see the Moon sees the eclipse."],
    ["An object is 1.5 m in front of a plane mirror. Find (a) the image distance and (b) the distance from the image if the object moves 0.5 m closer.", "(a) Image distance equals object distance, so 1.5 m behind the mirror. (b) After moving 0.5 m closer the object is 1.0 m away, so the image is 1.0 m behind the mirror and the distance between them is 2.0 m."] ],
  [ ["A pinhole camera has a screen 15 cm behind the hole. A tree 6 m tall is 30 m from the hole. Find the image height and describe it. What happens if the screen is moved to 30 cm?", "Image height / object height = image distance / object distance. h = 6 m x 15 cm / 30 m = 6 x 0.15 / 30 = 0.03 m = 3 cm. The image is real, inverted and smaller. At 30 cm the image becomes 6 cm, twice as large but dimmer."],
    ["A girl walks towards a plane mirror at 1 m/s. At what speed does she approach her image? If she starts 3 m from the mirror, what will be the distance between her and the image after 2 s?", "The image moves towards the mirror at the same speed, so the relative speed is 1 + 1 = 2 m/s. After 2 s she has moved 2 m, so she is 1 m from the mirror and her image is 1 m behind it. The distance between them is 2 m."],
    ["Light from the Sun takes 500 s to reach Earth. Using 3 x 10^8 m/s, estimate the Earth-Sun distance, and say how long a signal would take to cross Earth-Moon distance of 3.84 x 10^8 m.", "Distance = speed x time = 3 x 10^8 x 500 = 1.5 x 10^11 m. Time for the Moon = 3.84 x 10^8 / 3 x 10^8 = 1.28 s. So we see the Moon as it was 1.28 s ago and the Sun as it was about 8 minutes ago."],
    ["A person 1.6 m tall wants a plane mirror to see the whole body. State the minimum length of the mirror, its placement, and why distance does not matter.", "Minimum length is half the height, 0.8 m. The lower edge must be half way between the feet and the eye level (about 0.75 m above the ground if the eyes are at about 1.5 m), and the top edge half way between eye and head. Triangles formed by similar rays show that the required length is always half the height, independent of distance, because image distance grows with object distance."],
    ["Two plane mirrors are placed at 60 degrees to each other with an object between them. How many images are formed? What if the mirrors are kept parallel? Explain.", "Number of images = 360 / 60 - 1 = 5. For parallel mirrors the angle is 0, so reflections continue back and forth and, in principle, an infinite number of images form. In practice they get fainter and fade out as light is lost at each reflection."] ])
),

C({ CBSE: "Electricity and Circuits", ICSE: "Electric Current and Circuits", IB: "What Makes a Bulb Light Up?" },
[ S("1. Cell, Bulb and Simple Circuit",
 "An electric <b>cell</b> is a source of electrical energy from chemical reactions, with a <b>positive</b> terminal (metal cap) and <b>negative</b> terminal (flat metal disc). A bulb contains a thin <b>filament</b>, usually of tungsten, which glows when current passes through it, connected to two terminals. A <b>circuit</b> is a closed path along which current flows from the cell and back to it. A <b>switch</b> opens or closes the circuit. A bulb glows only when the circuit is <b>closed</b>.",
 "<b>Solved example:</b> A bulb is connected with a cell and wires but does not glow. One possible reason: the circuit is <b>open</b> because of a loose connection or a fused filament."),
 S("2. Conductors and Insulators",
 "<b>Conductors</b> allow electric current to pass through them easily: copper, aluminium, iron, silver, graphite, and salt water. <b>Insulators</b> do not allow it: plastic, rubber, glass, wood, dry paper. The test is simple: place the material in the gap of a circuit and see if the bulb glows. Wires are made of copper or aluminium and covered with plastic; the plastic stops shocks and short-circuits. The human body is a conductor, so electricity is dangerous.",
 "<b>Solved example:</b> A pencil lead is joined in a circuit and the bulb glows, but with a wooden pencil it does not. <b>Graphite is a conductor</b>; wood is an insulator."),
 S("3. Circuit Symbols, Cells and Safety",
 "Circuits are drawn with symbols for cell, battery, bulb, switch (open and closed) and wire. A <b>battery</b> is two or more cells connected in series, with the positive terminal of one joined to the negative of the next, so their voltages add. By convention current flows from the <b>positive terminal</b> through the circuit to the <b>negative</b>. Never touch bare wires, never use mains sockets for experiments, and use only cells in class experiments. Do not handle electrical devices with wet hands.",
 "<b>Solved example:</b> Three 1.5 V cells are joined in series. The battery gives <b>1.5 x 3 = 4.5 V</b>.") ],
[ ["Conventional current", "Conventional current is taken to flow from positive to negative, but in metals the real charge carriers are electrons, which drift from negative to positive. The convention dates from before the electron was discovered."],
  ["Tungsten filament", "Tungsten has the highest melting point of all metals, 3422 C, so bulb filaments glow white-hot at around 2500 C or more. The bulb is filled with an inert gas such as argon, as oxygen would burn the filament."],
  ["LED polarity", "An LED conducts in one direction only and lights only when its longer leg (anode) is connected to the positive side. It also needs a resistor in series to limit current."],
  ["Cells in series", "Cells in series add voltage, so 4 cells of 1.5 V give 6 V. If one is reversed it cancels another, so three cells with one reversed give only 1.5 V."],
  ["Water as a conductor", "Pure distilled water is a very poor conductor, but tap water and sea water conduct as they contain dissolved ions. This is why wet hands increase shock risk."] ],
[ Qz("Which of these is an electrical insulator?", ["Copper", "Graphite", "Iron", "Rubber"], 3, "Rubber does not let current pass; the rest are conductors."),
  Qz("A bulb glows when the switch is:", ["Open", "Closed", "Removed", "Broken"], 1, "Closed switch completes the circuit."),
  Qz("The filament of an electric bulb is made of:", ["Copper", "Aluminium", "Tungsten", "Iron"], 2, "Tungsten has a very high melting point."),
  Qz("Two cells of 1.5 V are connected in series with correct polarity. The total voltage is:", ["3 V", "1.5 V", "0 V", "4 V"], 0, "Voltages add in series: 1.5 + 1.5 = 3 V."),
  Qz("A bulb has a fused filament. Its circuit is:", ["Closed and working", "Short circuited", "Open", "Magnetic"], 2, "A broken filament leaves a gap, so the circuit is open.") ],
PP([ ["What is an electric circuit?", "A closed path along which electric current flows."],
     ["Name the positive and negative terminals of a cell.", "The metal cap is the positive terminal and the flat metal disc is the negative terminal."],
     ["Give two examples each of a conductor and an insulator.", "Conductors: copper and iron. Insulators: rubber and plastic."],
     ["What is the function of a switch?", "It opens or closes the circuit to stop or allow the flow of current."],
     ["Why are electrical wires covered with plastic?", "Plastic is an insulator, so it prevents shocks and short circuits."] ],
  [ ["Draw in words the circuit for a bulb, a cell and a switch and explain how the bulb glows.", "The positive terminal of the cell is joined by a wire to one terminal of the bulb, the other bulb terminal is joined to one end of the switch, and the other end of the switch to the negative terminal of the cell. When the switch is closed the circuit is complete, current flows through the filament and heats it so it glows."],
    ["A student tests a key, a pencil lead, a rubber eraser and a coin. Classify them and explain how the test works.", "Key and coin are metals so they are conductors; pencil lead (graphite) is a conductor; rubber is an insulator. When a conductor completes the gap in the circuit the bulb glows. With an insulator the circuit stays open so the bulb does not glow."],
    ["List four reasons why a bulb may fail to glow although it is connected to a cell.", "The filament is fused. The cell is used up. The connections are loose or wires are not touching the terminals. The switch is open or an insulator is in the circuit. The cell may also be wrongly connected in a battery."],
    ["Why is it dangerous to use electrical appliances with wet hands?", "Water with dissolved salts is a conductor, and wet skin has much less resistance, so more current flows through the body from a fault. This can cause a serious shock."],
    ["What is a battery? How is it different from a cell?", "A battery is a combination of two or more cells connected together, so it gives a higher voltage than one cell. A single cell is a single unit of this source."] ],
  [ ["Four cells of 1.5 V each are joined in series with correct polarity. Find the voltage. If one cell is reversed what is the voltage? If this battery is connected across a 12 ohm bulb, find the current in each case using I = V/R.", "Correct: 4 x 1.5 = 6 V, so I = 6/12 = 0.5 A. One reversed: 3 cells add 4.5 V and the reversed one subtracts 1.5 V, so net is 3 V; I = 3/12 = 0.25 A. Reversing one cell halves the voltage and thus the current."],
    ["Why does the bulb in a circuit glow almost instantly when the switch is closed, although electrons move through a wire at a snail pace?", "Free electrons are present all along the wire and the circuit. When the switch closes an electric field is set up almost at once in the whole wire, and all electrons start drifting together. So the energy is delivered right away, even though each electron moves slowly."],
    ["A tester has a bulb, a cell and two free wire ends. Describe how you would find out whether a sample of lemon juice, distilled water and salt water conduct, and what the results would be.", "Dip the two wire ends into each liquid without letting them touch. Lemon juice contains acid ions, so it conducts and the bulb glows. Salt water conducts well as it has many ions. Distilled water has very few ions so the bulb stays off, or glows very faintly."],
    ["A bulb is connected to a cell through a switch, but a student has put the cell backwards. Will the filament glow? Will an LED connected the same way glow? Explain.", "A filament bulb will glow, because current heats the filament in either direction. An LED will not glow because it allows current in one direction only, so reversing the cell blocks it. This is why LED polarity must be noted."],
    ["The filament of a bulb is thin and coiled and is placed in an inert gas. Explain these features and say what happens when the filament fuses.", "A thin, long coiled filament has high resistance and gets very hot when current flows, so it glows. Coiling fits a long wire into a small space. The inert gas does not react with the filament, so it does not burn. When the filament breaks there is a gap, the circuit is open, current stops and the bulb goes out."] ])
),

C({ CBSE: "Fun with Magnets", ICSE: "Magnets and Magnetism", IB: "What Makes Magnets Attract and Repel?" },
[ S("1. Magnetic and Non-magnetic Materials",
 "A <b>magnet</b> attracts materials such as iron, nickel and cobalt (and steel, which is mainly iron). These are <b>magnetic materials</b>; paper, plastic, wood, glass, copper, aluminium and rubber are <b>non-magnetic</b>. The natural magnet is <b>lodestone</b> (magnetite, Fe3O4). Magnets come as bar, horseshoe, cylindrical and disc shapes. The force of a magnet acts through paper, cloth and water, and is strongest at its <b>poles</b>.",
 "<b>Solved example:</b> A steel pin and a brass key are brought near a magnet. The pin is attracted and the brass key is not. Steel is magnetic and brass (copper-zinc) is <b>non-magnetic</b>."),
 S("2. Poles, Attraction and Repulsion",
 "Every magnet has two poles: <b>North</b> and <b>South</b>. A freely suspended bar magnet always comes to rest in the <b>north-south direction</b>, which is how a compass works. <b>Unlike poles attract</b>; <b>like poles repel</b>. Repulsion is the sure test of a magnet, since attraction also happens between a magnet and an unmagnetised piece of iron. If a magnet is cut into pieces, each piece is a magnet with both poles; poles cannot be separated.",
 "<b>Solved example:</b> The north pole of a magnet is brought near end A of a bar and it is repelled. End A is a <b>north pole</b> as like poles repel."),
 S("3. Making, Using and Caring for Magnets",
 "Iron or steel can be magnetised by stroking with a magnet in one direction (<b>single touch</b>), or <b>double touch</b>, or by passing current through a coil (an <b>electromagnet</b>). Magnets lose their strength when <b>heated, hammered, dropped</b> or kept near other magnets in the wrong way. They are stored in pairs with unlike poles together and <b>soft iron keepers</b> across the ends. Earth behaves like a giant bar magnet, with its magnetic south pole near geographic north, so the north pole of a compass needle points north.",
 "<b>Solved example:</b> Why are bar magnets stored in pairs with keepers? The keepers and opposite poles <b>form a closed loop</b> that prevents the magnets from losing their magnetism.") ],
[ ["Curie temperature", "A ferromagnet loses its permanent magnetism above the Curie temperature: about 770 C for iron, 358 C for nickel and 1115 C for cobalt."],
  ["Earth as a magnet", "Earth's magnetic field at the surface is only about 25 to 65 microtesla. The magnetic pole near the geographic north is physically a south pole, which is why a compass N points there."],
  ["Test for a magnet", "Given two identical iron bars, one of them a magnet, touch the end of one to the middle of the other. If they attract at the middle, the first is the magnet. A magnet has almost no pull at its middle."],
  ["Induced magnetism", "A soft iron nail near the north pole of a magnet gets an induced south pole at the near end, which is why it is attracted. It loses most of its magnetism when removed."],
  ["Maglev trains", "Maglev trains float on magnetic repulsion or attraction using electromagnets, so there is no wheel friction. Some have reached more than 600 km/h."] ],
[ Qz("Which of these is attracted by a magnet?", ["Copper coin", "Iron nail", "Aluminium foil", "Plastic ruler"], 1, "Iron is a magnetic material."),
  Qz("Like poles of two magnets:", ["Attract", "Do not interact", "Neutralise", "Repel"], 3, "Like poles repel; unlike attract."),
  Qz("A freely suspended bar magnet comes to rest pointing:", ["East-west", "Up-down", "North-south", "Randomly"], 2, "It aligns with the Earth's magnetic field, north-south."),
  Qz("The sure test for a magnet is:", ["Repulsion", "Attraction", "Weight", "Colour"], 0, "Attraction can also be with plain iron, but only a magnet repels another magnet."),
  Qz("Which can reduce the strength of a magnet?", ["Keeping in a wooden box", "Placing it with keepers", "Hammering or heating it", "Using a compass near it"], 2, "Hammering or heating disturbs the alignment of domains.") ],
PP([ ["Name three magnetic materials.", "Iron, nickel and cobalt."],
     ["What is a lodestone?", "A natural magnet (magnetite, an iron ore)."],
     ["State the law of magnetic poles.", "Like poles repel and unlike poles attract."],
     ["Name the instrument used to find directions.", "The magnetic compass."],
     ["Give two ways of demagnetising a magnet.", "Heating it strongly and hammering it (or dropping it)."] ],
  [ ["Explain why a magnet cut into two pieces does not give separate north and south poles.", "Each piece of the magnet becomes a complete magnet with its own north and south pole. A magnet is made of many tiny magnets all aligned the same way, so cutting only creates new poles at the cut ends. A single pole alone cannot exist."],
    ["How can you make a magnet from an iron nail using a bar magnet? Mention one precaution.", "Place the nail on a table and stroke it from one end to the other with one pole of the bar magnet, always in the same direction. Lift the magnet well away at the end of each stroke and repeat 30 to 40 times. Do not stroke back and forth, as that undoes the alignment."],
    ["Describe how a magnetic compass works.", "A compass has a light magnetised needle on a pivot, which can turn freely. Because Earth acts like a bar magnet, the needle lines up north-south, with one end (marked N) pointing to the north. Then other directions are worked out."],
    ["Why should magnets be kept away from televisions, mobile phones, credit cards and computers disks?", "Strong magnets can disturb the stored magnetic data on cards and disks, and affect the working of some electronic devices and screens. Hence they should be kept away."],
    ["How would you sort a mixture of iron filings, sawdust and sand, and what property is used?", "Move a magnet through the mixture; the iron filings stick to it. The sawdust can be floated off in water and sand remains. The property used is that iron is magnetic."] ],
  [ ["Two identical-looking iron bars A and B are given; only one is a magnet. Explain the test to identify it, and why the test works with no other equipment.", "Touch one end of A to the middle of B. If they attract, A is the magnet. If there is no attraction, then B is the magnet. The reason is that the pole of a magnet attracts iron anywhere, but the middle of a magnet is nearly neutral, so B's middle would not attract an iron bar A. Then reverse the roles to confirm."],
    ["A compass needle near a wire placed north-south deflects when a current passes through. What does this show, and what would happen to the deflection if the current were reversed?", "It shows that an electric current produces a magnetic field around the wire (Oersted's discovery). The needle lines up with the combined field. Reversing the current reverses the field direction so the needle deflects in the opposite direction."],
    ["A bar magnet is heated red hot and cooled slowly on a table. It no longer attracts iron filings. Explain, and say whether it is still possible to magnetise it again.", "Heating destroys the alignment of the tiny magnetic domains, as above the Curie point they move randomly, so the magnetism is lost. It can be magnetised again by stroking with another magnet or in a coil carrying current, since iron is still a magnetic material."],
    ["Explain why a nail hanging from a magnet can hold another nail, and what happens when the magnet is pulled away.", "The first nail gets induced magnetism, with the end nearest the magnet's pole becoming the opposite pole. Its other end is the same pole as that of the magnet and so attracts the second nail in the same way. When the magnet is removed the nails lose most of their magnetism, as soft iron cannot retain it, so they fall."],
    ["Two ring magnets on a pencil float with one above the other. Explain why they float, what happens if one is turned over, and how the weight of the upper magnet is balanced.", "The like poles face each other, so they repel. The force of repulsion balances the weight of the upper magnet, so it floats. If one is turned over, unlike poles face each other and the magnets attract and stick together. At the floating height the repulsion equals the weight (mg) of the upper magnet."] ])
)
];
