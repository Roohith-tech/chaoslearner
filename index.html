CL_PARTS["6|Maths"] = [
C({ CBSE: "Fractions", ICSE: "Fractions: Types and Operations", IB: "Parts of a Whole: Fractions" },
  [ S("1. Types of Fractions",
      "A <b>fraction</b> a/b names a part of a whole: b equal parts, a of them taken. A <b>proper fraction</b> has numerator less than denominator (3/5); an <b>improper fraction</b> has numerator at least the denominator (9/4); a <b>mixed number</b> is a whole number plus a proper fraction (2 1/4). <b>Equivalent fractions</b> are got by multiplying or dividing numerator and denominator by the same non-zero number.",
      "<b>Solved example:</b> Convert 17/5 to a mixed number: 17 = 3 x 5 + 2, so 17/5 = <b>3 2/5</b>. Convert back: 3 2/5 = (3 x 5 + 2)/5 = 17/5. Also 2/3 = 8/12 because 2 x 4 = 8 and 3 x 4 = 12."),
    S("2. Comparing and Ordering Fractions",
      "Fractions with the same denominator are compared by numerators. For unlike denominators, convert to <b>like fractions</b> using the LCM of the denominators. Quick test: a/b < c/d exactly when a x d < b x c (all positive). Among fractions with equal numerators, the one with the larger denominator is smaller.",
      "<b>Solved example:</b> Arrange 3/4, 5/6, 2/3 in ascending order. LCM of 4, 6, 3 = 12. 3/4 = 9/12, 5/6 = 10/12, 2/3 = 8/12. So 8/12 < 9/12 < 10/12, i.e. <b>2/3 < 3/4 < 5/6</b>."),
    S("3. Adding and Subtracting Fractions",
      "To add or subtract, first make denominators equal (use the LCM), then add or subtract the numerators and keep the denominator. Convert mixed numbers to improper fractions before working. Always reduce the answer to lowest terms by dividing by the HCF of numerator and denominator.",
      "<b>Solved example:</b> 2/3 + 3/4 = 8/12 + 9/12 = 17/12 = <b>1 5/12</b>. Next, 3 1/2 - 1 3/4 = 7/2 - 7/4 = 14/4 - 7/4 = 7/4 = <b>1 3/4</b>.") ],
  [ ["Egyptian fractions", "Every proper fraction can be written as a sum of different unit fractions; for example 3/4 = 1/2 + 1/4 and 2/3 = 1/2 + 1/6."],
    ["Mediant trick", "For positive fractions a/b < c/d, the fraction (a+c)/(b+d) lies strictly between them; for 1/3 and 1/2 it gives 2/5, and 0.333 < 0.4 < 0.5."],
    ["Telescoping sum", "Since 1/(n(n+1)) = 1/n - 1/(n+1), the sum 1/(1x2) + 1/(2x3) + ... + 1/(9x10) = 1 - 1/10 = 9/10."],
    ["Cross-multiplication", "To compare 7/12 and 5/9 compute 7 x 9 = 63 and 5 x 12 = 60; since 63 > 60, 7/12 is larger, with no LCM needed."],
    ["Perfect split", "1/2 + 1/3 + 1/6 = 1 exactly: 3/6 + 2/6 + 1/6 = 6/6."] ],
  [ Qz("Which of these is a proper fraction?", ["4/9", "9/4", "7/7", "11/5"], 0, "Only 4/9 has numerator smaller than denominator."),
    Qz("Which fraction is equivalent to 2/3?", ["3/4", "8/12", "6/8", "4/5"], 1, "8/12 divided by 4 gives 2/3."),
    Qz("17/5 as a mixed number is:", ["2 3/5", "3 1/5", "3 2/5", "3 3/5"], 2, "17 = 3 x 5 + 2, so 3 and 2/5."),
    Qz("1/2 + 1/3 =", ["2/5", "1/6", "2/6", "5/6"], 3, "3/6 + 2/6 = 5/6."),
    Qz("The largest of 2/3, 3/5, 3/4, 5/8 is:", ["3/4", "2/3", "3/5", "5/8"], 0, "As decimals: 0.667, 0.6, 0.75, 0.625.") ],
  PP([ ["Write 11/4 as a mixed number.", "11 = 2 x 4 + 3, so 11/4 = 2 3/4."],
       ["Reduce 18/24 to lowest terms.", "HCF(18,24) = 6; 18/6 = 3 and 24/6 = 4. Answer 3/4."],
       ["Add 3/7 + 2/7.", "Same denominator: (3+2)/7 = 5/7."],
       ["Which is greater, 4/5 or 3/4?", "4/5 = 16/20 and 3/4 = 15/20, so 4/5 is greater."],
       ["Convert 3 1/3 to an improper fraction.", "(3 x 3 + 1)/3 = 10/3."] ],
     [ ["Arrange 3/4, 5/6, 2/3 in ascending order.", "LCM = 12: 9/12, 10/12, 8/12. Order: 2/3 < 3/4 < 5/6."],
       ["Subtract 5/6 - 1/4.", "LCM 12: 10/12 - 3/12 = 7/12."],
       ["Find 2 1/2 + 1 2/3.", "5/2 + 5/3 = 15/6 + 10/6 = 25/6 = 4 1/6."],
       ["Find 2/3 of 36.", "36 / 3 = 12; 12 x 2 = 24."],
       ["Ravi eats 1/4 of a pizza and Sita eats 1/3. What fraction is eaten and what is left?", "Eaten = 1/4 + 1/3 = 3/12 + 4/12 = 7/12. Left = 1 - 7/12 = 5/12."] ],
     [ ["A tank is 3/5 full. One-third of the water in it is used. What fraction of the tank is now full? If the capacity is 60 L, how many litres remain?", "Used = 1/3 of 3/5 = 1/5 of tank. Left = 3/5 - 1/5 = 2/5 (also 3/5 x 2/3 = 2/5). Litres = 2/5 x 60 = 24 L."],
       ["Evaluate 1/(1x2) + 1/(2x3) + 1/(3x4) + 1/(4x5) + 1/(5x6).", "Each term 1/(n(n+1)) = 1/n - 1/(n+1). Sum = (1 - 1/2) + (1/2 - 1/3) + ... + (1/5 - 1/6) = 1 - 1/6 = 5/6."],
       ["Find three fractions between 1/4 and 1/2.", "Write with denominator 16: 1/4 = 4/16 and 1/2 = 8/16. Three fractions between: 5/16, 6/16 (= 3/8), 7/16."],
       ["A rope is 5 1/2 m long. Pieces of 3/4 m are cut from it. How many full pieces are obtained and how much rope is left?", "11/2 / (3/4) = 11/2 x 4/3 = 22/3 = 7 1/3, so 7 full pieces. Used = 7 x 3/4 = 21/4 = 5 1/4 m. Left = 5 1/2 - 5 1/4 = 1/4 m."],
       ["Meena spends 1/3 of her money on books and 1/4 on food. She has Rs 150 left. How much did she have at first?", "Spent = 1/3 + 1/4 = 7/12, left = 5/12. 5/12 of total = 150, so total = 150 x 12/5 = Rs 360. Check: books 120, food 90, 360 - 210 = 150."] ])),

C({ CBSE: "Decimals", ICSE: "Decimals: Place Value and Operations", IB: "Decimal Numbers and Fractions" },
  [ S("1. Decimal Place Value",
      "A <b>decimal</b> extends place value to the right of the decimal point: tenths (1/10), hundredths (1/100), thousandths (1/1000). Each place is one-tenth of the place on its left. A decimal with n digits after the point equals a fraction with denominator 10^n. Annexing zeros at the end of the decimal part does not change its value.",
      "<b>Solved example:</b> 3.625 = 3 + 6/10 + 2/100 + 5/1000. As a fraction: 3625/1000. Divide by 125: 29/8. Check: 29 / 8 = <b>3.625</b>."),
    S("2. Comparing and Converting",
      "To compare decimals, compare whole parts first, then tenths, hundredths and so on (equalise the number of decimal places by adding zeros). To convert a fraction to a decimal, divide numerator by denominator, or scale the denominator to 10, 100 or 1000. To convert a decimal to a fraction, write over a power of 10 and reduce.",
      "<b>Solved example:</b> Compare 0.7, 0.07, 0.707. Write as 0.700, 0.070, 0.707. So <b>0.707 > 0.7 > 0.07</b>. Convert 3/8: 3/8 = 375/1000 = <b>0.375</b>; and 7/20 = 35/100 = 0.35."),
    S("3. Operations on Decimals",
      "For addition and subtraction, line up the decimal points. For multiplication, multiply as whole numbers, then place the point so that the answer has as many decimal places as the two factors together. For division, multiply both numbers by the same power of 10 to make the divisor a whole number.",
      "<b>Solved example:</b> 12.5 + 3.75 + 0.125 = 16.25 + 0.125 = <b>16.375</b>. Multiply 4.2 x 0.3: 42 x 3 = 126, with 1 + 1 = 2 decimal places gives <b>1.26</b>. Divide 7.5 / 0.5 = 75 / 5 = <b>15</b>.") ],
  [ ["0.999... = 1", "Let x = 0.999...; then 10x = 9.999..., so 9x = 9 and x = 1. The two names describe the same number."],
    ["Cyclic 1/7", "1/7 = 0.142857 142857... repeating, and 142857 x 2 = 285714, a rotation of the same six digits."],
    ["Terminating test", "A fraction in lowest terms terminates as a decimal only if its denominator has no prime factors other than 2 and 5; 3/40 terminates (0.075) but 1/6 does not."],
    ["Eighths to remember", "1/8 = 0.125, 3/8 = 0.375, 5/8 = 0.625, 7/8 = 0.875; each is a multiple of 0.125."],
    ["Dividing by 0.25", "Dividing by 0.25 is multiplying by 4: 7 / 0.25 = 28. Dividing by 0.5 is doubling."] ],
  [ Qz("0.07 as a fraction is:", ["7/10", "7/100", "7/1000", "70/10"], 1, "Two decimal places means hundredths."),
    Qz("The largest of 0.5, 0.45, 0.505, 0.055 is:", ["0.5", "0.45", "0.505", "0.055"], 2, "0.505 > 0.500 > 0.450 > 0.055."),
    Qz("3/4 as a decimal is:", ["0.34", "0.43", "0.7", "0.75"], 3, "3/4 = 75/100."),
    Qz("0.6 x 0.3 =", ["0.18", "1.8", "0.018", "0.9"], 0, "6 x 3 = 18 with two decimal places gives 0.18."),
    Qz("4.5 / 0.09 =", ["5", "50", "500", "0.5"], 1, "450 / 9 = 50.") ],
  PP([ ["Write 7/10 as a decimal.", "0.7."],
       ["Add 2.5 + 3.75.", "6.25."],
       ["Subtract 5.2 - 2.75.", "5.20 - 2.75 = 2.45."],
       ["Which is greater, 0.8 or 0.08?", "0.8 (8 tenths) is greater than 0.08 (8 hundredths)."],
       ["Convert 0.25 to a fraction in lowest terms.", "25/100 = 1/4."] ],
     [ ["Convert 1/8 to a decimal.", "1/8 = 125/1000 = 0.125."],
       ["Multiply 3.2 x 0.15.", "32 x 15 = 480; 1 + 2 = 3 decimal places gives 0.480 = 0.48."],
       ["Divide 6.3 by 0.7.", "63 / 7 = 9."],
       ["Round 4.768 to the nearest tenth and to the nearest hundredth.", "Tenth: hundredths digit 6 rounds up, so 4.8. Hundredth: thousandths digit 8 rounds up, so 4.77."],
       ["A pencil costs Rs 3.50. Find the cost of 12 pencils and the change from Rs 50.", "12 x 3.50 = Rs 42.00. Change = 50 - 42 = Rs 8."] ],
     [ ["A ribbon 12.5 m long has 3 pieces of 2.75 m cut from it. The rest is cut into 4 equal pieces. Find the length of each.", "3 x 2.75 = 8.25 m. Rest = 12.5 - 8.25 = 4.25 m. Each = 4.25 / 4 = 1.0625 m."],
       ["Convert 0.1875 to a fraction in lowest terms.", "0.1875 = 1875/10000. Divide by 625: 3/16. Check 3 / 16 = 0.1875."],
       ["A car runs 15.6 km per litre and petrol costs Rs 102.50 per litre. Find the fuel cost for 234 km.", "Litres = 234 / 15.6 = 15. Cost = 15 x 102.50 = 1500 + 37.50 = Rs 1537.50."],
       ["Evaluate 0.75 x 4 + 1.5 / 0.3 - 0.2 x 0.2.", "0.75 x 4 = 3. 1.5 / 0.3 = 15/3 = 5. 0.2 x 0.2 = 0.04. Total = 3 + 5 - 0.04 = 7.96."],
       ["Arrange 1.09, 1.9, 1.099, 1.009 in ascending order and add the smallest and the largest.", "As 1.090, 1.900, 1.099, 1.009: ascending 1.009 < 1.09 < 1.099 < 1.9. Sum = 1.009 + 1.9 = 2.909."] ])),

C({ CBSE: "Basic Geometrical Ideas", ICSE: "Basic Geometrical Concepts", IB: "Points, Lines and Shapes" },
  [ S("1. Point, Line Segment, Line and Ray",
      "A <b>point</b> marks an exact position and has no size. A <b>line segment</b> AB is the shortest path between A and B and has two endpoints. A <b>ray</b> has one endpoint and extends endlessly in one direction. A <b>line</b> extends endlessly both ways. Exactly one line passes through two given points; points on the same line are <b>collinear</b>.",
      "<b>Solved example:</b> Four collinear points A, B, C, D give segments AB, AC, AD, BC, BD, CD, that is 4 x 3 / 2 = <b>6</b> segments. In general n collinear points give n(n-1)/2 segments."),
    S("2. Curves and Polygons",
      "A <b>closed curve</b> starts and ends at the same point; a <b>simple</b> curve does not cross itself. A <b>polygon</b> is a simple closed figure made of line segments (its sides) meeting at vertices. Triangle 3 sides, quadrilateral 4, pentagon 5, hexagon 6, heptagon 7, octagon 8. A <b>diagonal</b> joins two non-adjacent vertices; an n-sided polygon has n(n-3)/2 diagonals.",
      "<b>Solved example:</b> Diagonals of a hexagon: n = 6, so 6 x (6-3) / 2 = 6 x 3 / 2 = <b>9</b>. Check by counting: each vertex has 3 diagonals, 6 x 3 = 18, and each is counted twice, so 9."),
    S("3. The Circle",
      "A <b>circle</b> is the set of all points in a plane at a fixed distance (the <b>radius</b>) from a fixed point (the <b>centre</b>). A <b>chord</b> joins two points of the circle; the <b>diameter</b> is a chord through the centre and equals twice the radius. An <b>arc</b> is a part of the circle; a <b>sector</b> is the region between two radii and an arc; a <b>segment</b> is the region between a chord and an arc.",
      "<b>Solved example:</b> A circle has diameter 18.6 cm. Radius = 18.6 / 2 = <b>9.3 cm</b>. The longest chord is the diameter, 18.6 cm, so no chord of this circle can be 20 cm long.") ],
  [ ["Handshake lines", "n points with no three collinear determine n(n-1)/2 lines; 6 points give 6 x 5 / 2 = 15 lines."],
    ["Diagonal count", "A decagon (10 sides) has 10 x 7 / 2 = 35 diagonals, while a triangle has 0."],
    ["Point and lines", "Infinitely many lines pass through one point, but exactly one passes through two distinct points."],
    ["Crossing lines", "n lines in a plane, no two parallel and no three through one point, meet in n(n-1)/2 points; 5 lines give 10 points."],
    ["Longest chord", "The diameter is the longest chord of a circle, and a circle has infinitely many diameters, all of equal length 2r."] ],
  [ Qz("A line segment has:", ["no endpoints", "one endpoint", "two endpoints", "infinitely many endpoints"], 2, "A segment is bounded at both ends."),
    Qz("The number of diagonals of a pentagon is:", ["2", "3", "4", "5"], 3, "5 x 2 / 2 = 5."),
    Qz("The diameter of a circle of radius 6.5 cm is:", ["13 cm", "6.5 cm", "3.25 cm", "26 cm"], 0, "Diameter = 2 x radius."),
    Qz("How many lines pass through two given points?", ["0", "1", "2", "infinitely many"], 1, "Two points fix exactly one line."),
    Qz("Number of segments formed by 5 collinear points:", ["5", "8", "10", "20"], 2, "5 x 4 / 2 = 10.") ],
  PP([ ["Define a ray.", "A ray is a part of a line with one endpoint that extends endlessly in one direction."],
       ["How many endpoints does a line segment have?", "Two."],
       ["Name the polygon with 4 sides and the one with 6 sides.", "Quadrilateral and hexagon."],
       ["Find the diameter of a circle of radius 9 cm.", "2 x 9 = 18 cm."],
       ["How many diagonals does a triangle have?", "3 x 0 / 2 = 0; every pair of vertices is already joined by a side."] ],
     [ ["Find the number of diagonals of an octagon.", "n = 8: 8 x 5 / 2 = 20."],
       ["Six collinear points are marked. How many line segments are formed?", "6 x 5 / 2 = 15."],
       ["Distinguish a line, a ray and a line segment.", "A line has no endpoints and goes on both ways; a ray has one endpoint and goes on one way; a segment has two endpoints and fixed length."],
       ["Can a circle of radius 6 cm have a chord of length 14 cm? Explain.", "No. The longest chord is the diameter = 12 cm, and 14 > 12."],
       ["Name the polygon with 9 sides and find its diagonals.", "Nonagon. 9 x (9-3) / 2 = 9 x 6 / 2 = 27."] ],
     [ ["A polygon has 35 diagonals. How many sides does it have?", "n(n-3)/2 = 35, so n(n-3) = 70. Try n = 10: 10 x 7 = 70. So 10 sides (a decagon)."],
       ["Six points are marked, no three collinear. How many lines can be drawn? If four of them are collinear, how many lines now?", "No three collinear: 6 x 5 / 2 = 15. With four collinear, those 4 points had given 6 pairs but now give 1 line, so 15 - 6 + 1 = 10 lines."],
       ["Five lines are drawn in a plane with no three through one point. Find the maximum number of intersection points. If two of the lines are parallel, how many?", "Maximum = 5 x 4 / 2 = 10. Two parallel lines never meet, losing 1 point: 10 - 1 = 9."],
       ["Two concentric circles have radii 5 cm and 8 cm. Find both diameters and the width of the ring between them.", "Diameters = 10 cm and 16 cm. Ring width = 8 - 5 = 3 cm (difference of diameters 6 cm is twice this)."],
       ["For which polygon is the number of diagonals equal to the number of sides?", "n(n-3)/2 = n, so n - 3 = 2 (as n is not 0) and n = 5. The pentagon has 5 sides and 5 diagonals."] ])),

C({ CBSE: "Understanding Elementary Shapes", ICSE: "Elementary Shapes: Angles, Triangles and Quadrilaterals", IB: "Angles and Properties of Plane Shapes" },
  [ S("1. Measuring and Classifying Angles",
      "An <b>angle</b> is formed by two rays with a common endpoint (vertex) and is measured in degrees. <b>Acute</b>: less than 90 deg; <b>right</b>: 90 deg; <b>obtuse</b>: between 90 and 180 deg; <b>straight</b>: 180 deg; <b>reflex</b>: between 180 and 360 deg; <b>complete</b>: 360 deg. Two angles are <b>complementary</b> if they add to 90 deg and <b>supplementary</b> if they add to 180 deg.",
      "<b>Solved example:</b> Complement of 35 deg = 90 - 35 = 55 deg; supplement = 180 - 35 = 145 deg. An angle equal to twice its complement: x = 2(90 - x), so 3x = 180 and x = <b>60 deg</b>."),
    S("2. Classifying Triangles",
      "By sides: <b>equilateral</b> (3 equal sides), <b>isosceles</b> (2 equal sides, with equal angles opposite them), <b>scalene</b> (no equal sides). By angles: <b>acute</b> (all angles acute), <b>right</b> (one 90 deg angle), <b>obtuse</b> (one obtuse angle). The three angles of any triangle add up to 180 deg, and the sum of any two sides exceeds the third.",
      "<b>Solved example:</b> Angles of a triangle are in the ratio 2 : 3 : 4. Total parts = 9, one part = 180 / 9 = 20 deg. Angles: <b>40 deg, 60 deg, 80 deg</b>. All are acute and the sides are all different, so it is an acute scalene triangle."),
    S("3. Classifying Quadrilaterals",
      "The four angles of a quadrilateral add up to 360 deg. A <b>parallelogram</b> has both pairs of opposite sides parallel (opposite sides and angles equal). A <b>rectangle</b> is a parallelogram with four right angles; a <b>rhombus</b> has four equal sides; a <b>square</b> is both. A <b>trapezium</b> has one pair of parallel sides; a <b>kite</b> has two pairs of equal adjacent sides.",
      "<b>Solved example:</b> Angles of a quadrilateral are x, 2x, 3x, 4x. Then 10x = 360, so x = 36. The angles are <b>36 deg, 72 deg, 108 deg, 144 deg</b>. Check: 36 + 72 + 108 + 144 = 360.") ],
  [ ["Clock angle formula", "At H hours M minutes the angle between the hands is |30H - 5.5M| deg (take 360 minus it if it exceeds 180); at 2:30 it is |60 - 165| = 105 deg."],
    ["Polygon angle sum", "The interior angles of an n-gon add up to (n-2) x 180 deg; a hexagon gives 4 x 180 = 720 deg."],
    ["Triangle inequality", "Sides 3, 4, 8 cannot form a triangle since 3 + 4 = 7 < 8; sides 3, 4, 5 can."],
    ["At most one", "A triangle can have at most one right or obtuse angle, because two of them would already add to 180 deg or more."],
    ["Overlapping hands", "In 12 hours the minute and hour hands of a clock overlap exactly 11 times, not 12."] ],
  [ Qz("An angle of 150 deg is:", ["acute", "right", "reflex", "obtuse"], 3, "It lies between 90 and 180 deg."),
    Qz("Two angles of a triangle are 50 deg and 60 deg. The third is:", ["70 deg", "80 deg", "60 deg", "110 deg"], 0, "180 - 110 = 70."),
    Qz("The supplement of 65 deg is:", ["25 deg", "115 deg", "125 deg", "295 deg"], 1, "180 - 65 = 115."),
    Qz("The angle sum of a quadrilateral is:", ["180 deg", "270 deg", "360 deg", "540 deg"], 2, "It splits into two triangles."),
    Qz("Which lengths cannot form a triangle?", ["3, 4, 5", "5, 5, 5", "2, 3, 4", "1, 2, 3"], 3, "1 + 2 = 3, not greater than 3.") ],
  PP([ ["Classify an angle of 120 deg.", "It is between 90 and 180 deg, so obtuse."],
       ["Find the complement of 72 deg.", "90 - 72 = 18 deg."],
       ["A triangle has two angles of 45 deg each. Find the third and name the triangle.", "180 - 90 = 90 deg. It is a right isosceles triangle."],
       ["What is the sum of the angles of a quadrilateral?", "360 deg."],
       ["Find each angle of an equilateral triangle.", "180 / 3 = 60 deg."] ],
     [ ["The angles of a triangle are x, x+10 and x+20 deg. Find them.", "3x + 30 = 180, so x = 50. Angles: 50, 60, 70 deg."],
       ["One angle of a parallelogram is 70 deg. Find the other three.", "Opposite angle = 70 deg; adjacent angles are supplementary = 180 - 70 = 110 deg each. Angles: 70, 110, 70, 110 deg."],
       ["An angle is 20 deg more than its complement. Find it.", "x = (90 - x) + 20, so 2x = 110 and x = 55 deg. Check: complement 35, and 55 - 35 = 20."],
       ["Find the angle between the clock hands at 4:00.", "|30 x 4 - 0| = 120 deg."],
       ["Can a triangle have sides 7 cm, 10 cm and 19 cm?", "7 + 10 = 17, which is less than 19. No."] ],
     [ ["The angles of a quadrilateral are in the ratio 1 : 2 : 4 : 5. Find them.", "Parts = 12; one part = 360 / 12 = 30. Angles: 30, 60, 120, 150 deg."],
       ["An isosceles triangle has one angle of 100 deg. Find the other two.", "Two obtuse angles are impossible, so 100 deg is the apex. Base angles = (180 - 100) / 2 = 40 deg each."],
       ["Find the angle between the hands of a clock at 7:20.", "|30 x 7 - 5.5 x 20| = |210 - 110| = 100 deg."],
       ["An angle is three times its supplement. Find the angle.", "x = 3(180 - x), so 4x = 540 and x = 135 deg. Supplement 45; 3 x 45 = 135."],
       ["Five angles of a hexagon are 120, 130, 110, 125 and 135 deg. Find the sixth.", "Hexagon sum = 4 x 180 = 720. Five angles sum = 620. Sixth = 720 - 620 = 100 deg."] ])),

C({ CBSE: "Data Handling", ICSE: "Data Handling: Graphs and Averages", IB: "Statistics: Collecting and Representing Data" },
  [ S("1. Collecting Data: Tally Marks and Frequency Tables",
      "<b>Data</b> is a collection of facts or numbers. <b>Raw data</b> is unorganised. <b>Tally marks</b> record each observation with a stroke, the fifth stroke crossing the four before it to make a bundle of five. The <b>frequency</b> of an observation is the number of times it occurs, and a frequency table lists observations with their frequencies.",
      "<b>Solved example:</b> Data: 2, 3, 2, 4, 3, 2, 5, 3, 2, 4. Frequencies: 2 occurs <b>4</b> times, 3 occurs <b>3</b> times, 4 occurs <b>2</b> times, 5 occurs <b>1</b> time. Total = 4 + 3 + 2 + 1 = 10, which matches the number of observations."),
    S("2. Pictographs and Bar Graphs",
      "A <b>pictograph</b> uses a symbol to stand for a fixed number of items (the scale); half a symbol stands for half that number. A <b>bar graph</b> uses bars of equal width whose lengths are proportional to the values; the scale must be uniform along the axis. Always read the scale before reading any value.",
      "<b>Solved example:</b> In a pictograph 1 book symbol = 10 books. Shop A shows 3 and a half symbols, so it has 3.5 x 10 = <b>35 books</b>. In a bar graph with 1 cm = 20 units, a bar 4.5 cm high shows 4.5 x 20 = <b>90 units</b>."),
    S("3. Mean, Median, Mode and Range",
      "<b>Mean</b> (arithmetic average) = sum of observations / number of observations. <b>Median</b> is the middle value after arranging in order (for an even count, the average of the two middle values). <b>Mode</b> is the most frequent value. <b>Range</b> = highest - lowest. The mean always lies between the smallest and largest observations.",
      "<b>Solved example:</b> Data 12, 15, 18, 15, 20. Sum = 80, mean = 80 / 5 = <b>16</b>. Ordered: 12, 15, 15, 18, 20, so median = <b>15</b>, mode = <b>15</b>, range = 20 - 12 = <b>8</b>.") ],
  [ ["Mean of 1 to n", "The mean of the first n natural numbers is (n+1)/2; for 1 to 10 it is 5.5."],
    ["Shift rule", "Adding the same number k to every observation raises the mean by exactly k; multiplying every observation by k multiplies the mean by k."],
    ["Zero deviations", "The deviations from the mean always sum to zero: for 2, 4, 9 the mean is 5 and (-3) + (-1) + 4 = 0."],
    ["Average speed trap", "Going at 30 km/h and returning at 60 km/h gives average speed 40 km/h, not 45, because 2d / (d/30 + d/60) = 40."],
    ["Sum from the mean", "If the mean of 5 numbers is 12 their sum is 60; raising one number by 10 raises the mean by 2."] ],
  [ Qz("In tally marks, the fifth stroke is drawn:", ["across the first four", "as a fifth vertical line", "as a circle", "as a dot"], 0, "It forms a bundle of five."),
    Qz("Mean of 4, 6, 8, 10, 12 is:", ["6", "8", "10", "7"], 1, "Sum 40 divided by 5 is 8."),
    Qz("Mode of 3, 5, 3, 7, 5, 3 is:", ["5", "7", "3", "6"], 2, "3 appears three times, the most."),
    Qz("Range of 8, 2, 15, 9 is:", ["15", "2", "17", "13"], 3, "15 - 2 = 13."),
    Qz("If 1 symbol = 20 items, 3.5 symbols show:", ["70", "60", "35", "80"], 0, "3.5 x 20 = 70.") ],
  PP([ ["Find the mean of 2, 4, 6.", "(2 + 4 + 6) / 3 = 12 / 3 = 4."],
       ["Find the mode of 1, 2, 2, 3, 3, 3, 4.", "3 occurs most often (three times)."],
       ["Find the range of 5, 9, 2, 12.", "12 - 2 = 10."],
       ["Show 7 using tally marks.", "One bundle of five (four strokes crossed by a fifth) plus two more strokes."],
       ["In a pictograph 1 symbol = 5 apples. Six symbols show how many apples?", "6 x 5 = 30 apples."] ],
     [ ["Find the median of 7, 3, 9, 5, 11, 1.", "Ordered: 1, 3, 5, 7, 9, 11. Middle two are 5 and 7, so median = 6."],
       ["The mean of five numbers is 18. Four of them are 14, 20, 16, 22. Find the fifth.", "Total = 5 x 18 = 90. Four sum to 72. Fifth = 90 - 72 = 18."],
       ["Make a frequency table for 1, 2, 2, 3, 1, 2, 3, 3, 3, 4.", "1: 2 times; 2: 3 times; 3: 4 times; 4: 1 time. Total 2 + 3 + 4 + 1 = 10."],
       ["In a bar graph 1 cm = 25 students. A bar is 3.2 cm high. How many students?", "3.2 x 25 = 80 students."],
       ["Marks 40, 55, 65, 70 and x have mean 58. Find x.", "Total = 5 x 58 = 290. Known sum = 230. x = 60."] ],
     [ ["The mean marks of 30 students is 62 and of 20 other students is 72. Find the mean of all 50.", "Total = 30 x 62 + 20 x 72 = 1860 + 1440 = 3300. Mean = 3300 / 50 = 66."],
       ["The mean of six numbers is 15. When one number, 24, is removed, find the mean of the remaining five.", "Total = 6 x 15 = 90. Remaining sum = 90 - 24 = 66. Mean = 66 / 5 = 13.2."],
       ["Find the mean, median, mode and range of 12, 7, 9, 15, 7, 10, 13, 7.", "Sum = 80, mean = 80 / 8 = 10. Ordered: 7, 7, 7, 9, 10, 12, 13, 15; median = (9 + 10) / 2 = 9.5. Mode = 7. Range = 15 - 7 = 8."],
       ["A cyclist goes to a place at 12 km/h and returns at 24 km/h. Find the average speed for the round trip.", "Let distance one way be d. Time = d/12 + d/24 = 3d/24 = d/8. Average speed = 2d / (d/8) = 16 km/h (not 18)."],
       ["The average age of 4 friends is 14 years. A fifth friend joins and the average becomes 15. Find the fifth friend's age.", "Old total = 4 x 14 = 56. New total = 5 x 15 = 75. Age = 75 - 56 = 19 years."] ])),

C({ CBSE: "Mensuration", ICSE: "Mensuration: Perimeter and Area", IB: "Measurement: Perimeter and Area" },
  [ S("1. Perimeter",
      "<b>Perimeter</b> is the total length of the boundary of a closed figure, measured in units of length (cm, m). Rectangle: P = 2(l + b). Square: P = 4a. Triangle: sum of its three sides. For a regular polygon, P = number of sides x side length.",
      "<b>Solved example:</b> Rectangle 12 cm by 8 cm: P = 2(12 + 8) = <b>40 cm</b>. A square has perimeter 36 m, so its side = 36 / 4 = <b>9 m</b>."),
    S("2. Area of Rectangle and Square",

      "<b>Solved example:</b> Rectangle 15 m by 9 m: A = 15 x 9 = <b>135 m^2</b>. Square of side 12 cm: A = 12 x 12 = <b>144 cm^2</b>. A rectangle of area 72 cm^2 and length 12 cm has breadth 72 / 12 = 6 cm."),
    S("3. Units and Combined Problems",

      "<b>Solved example:</b> A garden is 20 m by 14 m with a path 2 m wide inside along the border. The inner plot is (20 - 4) by (14 - 4) = 16 by 10 = 160 m^2. Garden = 20 x 14 = 280 m^2. Path area = 280 - 160 = <b>120 m^2</b>.") ],
  [ ["Square wins", "Among all rectangles with perimeter 20, the square has the greatest area: 5 x 5 = 25 beats 6 x 4 = 24 and 7 x 3 = 21."],

    ["Difference of squares", "(n+1)^2 - n^2 = 2n + 1, so 26^2 - 25^2 = 51 with no big multiplication."],
    ["Area units", "1 m^2 = 10000 cm^2 and 1 hectare = 10000 m^2, so 1 hectare is a 100 m by 100 m square."],
    ["Same area, different perimeter", "A rectangle of area 36 with whole-number sides has perimeter 24 as 6 x 6, but 26 as 4 x 9, and 74 as 1 x 36."] ],
  [ Qz("Perimeter of a rectangle 9 cm by 5 cm is:", ["45 cm", "28 cm", "14 cm", "40 cm"], 1, "2(9 + 5) = 28."),

       ["A square has area 100 cm^2. Find its side.", "10 x 10 = 100, so side = 10 cm."],

     [ ["A rectangle has perimeter 40 cm and length 12 cm. Find its breadth and area.", "l + b = 20, so b = 8 cm. Area = 12 x 8 = 96 cm^2."],
       ["A floor 8 m by 5 m is tiled with square tiles of side 50 cm. How many tiles are needed?", "Floor = 40 m^2. Tile = 0.5 x 0.5 = 0.25 m^2. Tiles = 40 / 0.25 = 160."],
       ["Which has greater area: a square of side 9 cm or a rectangle 12 cm by 7 cm? By how much?", "Square = 81 cm^2; rectangle = 84 cm^2. Rectangle is larger by 3 cm^2."],
       ["A field 30 m by 20 m is fenced at Rs 15 per metre. Find the cost.", "Perimeter = 2(30 + 20) = 100 m. Cost = 100 x 15 = Rs 1500."],
       ["A square plot has area 169 m^2. Find its perimeter.", "Side = 13 m (13 x 13 = 169). Perimeter = 4 x 13 = 52 m."] ],
     [ ["A rectangular park is 25 m by 18 m. A path 2 m wide runs inside along all four edges. Find the area of the path.", "Inner = (25 - 4) by (18 - 4) = 21 by 14 = 294 m^2. Park = 25 x 18 = 450 m^2. Path = 450 - 294 = 156 m^2."],
       ["From a sheet 24 cm by 18 cm, squares of side 5 cm are cut as many as possible. Find the number of squares and the wasted area.", "Along 24: 4 squares (20 used); along 18: 3 squares (15 used). Squares = 12, area used = 12 x 25 = 300. Sheet = 432. Waste = 432 - 300 = 132 cm^2."],

C({ CBSE: "Introduction to Algebra", ICSE: "Algebra: Variables, Expressions and Equations", IB: "Patterns and Algebraic Thinking" },
  [ S("1. Variables, Constants and Expressions",
      "A <b>variable</b> is a letter that stands for a number that can change or is unknown; a <b>constant</b> has a fixed value. An <b>expression</b> combines numbers and variables with operations, e.g. 3n + 5. Its parts separated by + or - are <b>terms</b>, and the number multiplying a variable is its <b>coefficient</b>. Substituting a value for the variable gives the value of the expression.",
      "<b>Solved example:</b> Write 5 more than thrice a number n: <b>3n + 5</b>. For n = 7: 3 x 7 + 5 = <b>26</b>. In 7x + 3, the coefficient of x is 7 and the constant term is 3. Perimeter of a square of side a is 4a; for a = 6 it is 24."),
    S("2. Simplifying Expressions",
      "<b>Like terms</b> have the same variable part (3a and 5a) and can be added or subtracted by combining coefficients; unlike terms (3a and 4b) cannot be combined. Use the distributive property: a(b + c) = ab + ac. A number written next to a bracket means multiplication.",
      "<b>Solved example:</b> Simplify 5a + 3b - 2a + 4b + 7. Group like terms: (5a - 2a) + (3b + 4b) + 7 = <b>3a + 7b + 7</b>. Also 2(x + 4) + 3x = 2x + 8 + 3x = <b>5x + 8</b>."),
    S("3. Simple Equations",
      "An <b>equation</b> states that two expressions are equal and is true only for certain values of the variable, called its <b>solution</b>. Solve by <b>balancing</b>: do the same operation on both sides (add, subtract, multiply or divide by the same non-zero number) until the variable stands alone. Always verify by substituting the answer.",
      "<b>Solved example:</b> Solve 3x + 5 = 20. Subtract 5: 3x = 15. Divide by 3: x = <b>5</b>. Check: 3 x 5 + 5 = 20. Next, 2(x - 3) = 10 gives x - 3 = 5, so x = <b>8</b>; check 2 x 5 = 10.") ],
  [ ["Consecutive numbers", "The sum of three consecutive numbers n-1, n, n+1 is always 3n, three times the middle one; 28 + 29 + 30 = 87 = 3 x 29."],
    ["Digit reversal", "A two-digit number with digits a, b is 10a + b, so (10a + b) + (10b + a) = 11(a + b); 37 + 73 = 110 = 11 x 10."],
    ["Think of a number", "Think n, add 5, double, subtract 10, halve: (2n + 10 - 10)/2 = n, so you always get back your number."],
    ["Odd plus odd", "Odd numbers are 2m+1, so (2m+1) + (2n+1) = 2(m+n+1) is always even."],
    ["Handshakes", "n people shaking hands once each make n(n-1)/2 handshakes; 8 people give 8 x 7 / 2 = 28."] ],
  [ Qz("The coefficient of x in 7x + 3 is:", ["3", "x", "7", "10"], 2, "It is the number multiplying x."),
    Qz("The value of 2x + 3 when x = 5 is:", ["10", "11", "12", "13"], 3, "2 x 5 + 3 = 13."),
    Qz("The solution of x + 7 = 15 is:", ["8", "22", "7", "9"], 0, "Subtract 7 from both sides."),
    Qz("Four less than thrice y is written:", ["3y + 4", "3y - 4", "4 - 3y", "3(y - 4)"], 1, "Thrice y is 3y; four less is 3y - 4."),
    Qz("The solution of 2x - 3 = 9 is:", ["3", "5", "6", "12"], 2, "2x = 12, so x = 6.") ],
  PP([ ["Write the sum of x and 9 as an expression.", "x + 9."],
       ["Find the value of 3a - 2 when a = 4.", "3 x 4 - 2 = 10."],
       ["Solve x - 6 = 11.", "Add 6: x = 17."],
       ["Solve 4y = 36.", "Divide by 4: y = 9."],
       ["Write the perimeter of a square of side s.", "4s."] ],
     [ ["Simplify 6x + 4y - 2x + 3y.", "(6x - 2x) + (4y + 3y) = 4x + 7y."],
       ["Solve 3x + 7 = 25.", "3x = 18, so x = 6. Check 18 + 7 = 25."],
       ["Solve 5(x - 2) = 35.", "x - 2 = 7, so x = 9. Check 5 x 7 = 35."],
       ["8 more than twice a number is 30. Find the number.", "2n + 8 = 30, so 2n = 22 and n = 11."],
       ["Find the value of 2p^2 - p when p = 3.", "2 x 9 - 3 = 18 - 3 = 15."] ],
     [ ["The sum of three consecutive numbers is 87. Find them.", "Let them be n-1, n, n+1. Sum = 3n = 87, so n = 29. Numbers: 28, 29, 30."],
       ["A father is 4 times as old as his son and the sum of their ages is 45. Find their ages and their ages after 6 years.", "Son = x, father = 4x; 5x = 45, so x = 9 and father = 36. After 6 years: 15 and 42 (sum 57 = 45 + 12)."],
       ["The length of a rectangle is 5 m more than its breadth and the perimeter is 50 m. Find its area.", "2(b + b + 5) = 50, so 2b + 5 = 25 and b = 10, l = 15. Area = 15 x 10 = 150 m^2."],
       ["Solve 7x - 4 = 3x + 12 and check.", "Subtract 3x: 4x - 4 = 12. Add 4: 4x = 16. x = 4. Check: 7 x 4 - 4 = 24 and 3 x 4 + 12 = 24."],
       ["I think of a number, triple it and add 8. The result is 4 less than 5 times the number. Find the number.", "3n + 8 = 5n - 4. So 12 = 2n and n = 6. Check: 3 x 6 + 8 = 26 and 5 x 6 - 4 = 26."] ]))
];

C({ CBSE: "Nutrition in Animals", ICSE: "Digestion and Nutrition in Animals", IB: "How Do Animals Turn Food into Usable Energy?" },
  [ S("1. Steps of Nutrition and the Human Digestive System",
      "Animals are <b>heterotrophs</b>: they depend on ready-made food. Nutrition has five steps: <b>ingestion</b> (taking food in), <b>digestion</b> (breaking large insoluble molecules into small soluble ones), <b>absorption</b> (passage into blood), <b>assimilation</b> (use of nutrients by cells) and <b>egestion</b> (removal of undigested waste). The human alimentary canal runs from mouth, oesophagus, stomach, small intestine and large intestine to anus, with the salivary glands, liver and pancreas as associated glands.",
      "<b>Solved example:</b> Which step is missing in: ingestion, digestion, absorption, egestion? <b>Assimilation</b>, the use of absorbed nutrients to build tissue and release energy."),
    S("2. Digestion in the Mouth, Stomach and Small Intestine",
      "In the mouth, teeth chew food and <b>salivary amylase</b> starts converting starch into sugar (maltose). In the stomach, <b>hydrochloric acid</b> kills germs and gives an acidic medium, <b>pepsin</b> begins protein digestion and mucus protects the stomach wall. In the small intestine, <b>bile</b> from the liver (stored in the gall bladder) emulsifies fats, and <b>pancreatic juice</b> plus intestinal juice complete the digestion of carbohydrates, proteins and fats into glucose, amino acids, and fatty acids with glycerol.",
      "<b>Solved example:</b> Why does a piece of bread taste sweet if chewed for a long time? Salivary amylase turns <b>starch into sugar</b> (maltose)."),
    S("3. Absorption, Egestion and Feeding in Other Animals",
      "The inner wall of the small intestine has finger-like <b>villi</b> that greatly increase surface area and have a rich blood supply for absorption. Undigested food enters the large intestine, where water is absorbed, and the rest leaves as faeces by egestion. <b>Ruminants</b> (cow, buffalo) swallow grass quickly, store it in the rumen, later chew it again as <b>cud</b> (rumination), and digest cellulose with the help of bacteria in the rumen and caecum. <b>Amoeba</b> engulfs food with pseudopodia into a food vacuole in which digestion occurs.",
      "<b>Solved example:</b> Humans cannot digest cellulose but cows can because cows' <b>caecum has bacteria</b> that break cellulose down.") ],
  [ ["Gastric acid strength", "Stomach acid has a pH of about 1.5 to 3.5, and pepsin is secreted as inactive pepsinogen so that it does not digest the cells that make it."],
    ["Activation of trypsin", "Pancreatic trypsinogen is activated to trypsin by the intestinal enzyme enteropeptidase, which then activates other pancreatic enzymes."],
    ["Bile is not an enzyme", "Bile contains salts and pigments but no enzymes; it emulsifies fat into droplets, increasing the surface area for lipase."],
    ["Glucose absorption", "Glucose enters intestinal cells by sodium-coupled active transport, so it can be absorbed even when its concentration in the gut is lower than in blood."],
    ["Lactose intolerance", "Adults lacking the enzyme lactase cannot digest milk sugar (lactose); bacteria in the colon ferment it, causing gas and diarrhoea."] ],
  [ Qz("The enzyme present in saliva is:", ["Amylase", "Pepsin", "Lipase", "Trypsin"], 0, "Salivary amylase acts on starch."),
    Qz("Most nutrient absorption takes place in the:", ["Stomach", "Small intestine", "Large intestine", "Oesophagus"], 1, "Villi of the small intestine absorb digested food."),
    Qz("Bile is stored in the:", ["Stomach", "Pancreas", "Gall bladder", "Appendix"], 2, "It is made in the liver and stored in the gall bladder."),
    Qz("Amoeba captures food using:", ["Cilia", "Tentacles", "Flagellum", "Pseudopodia"], 3, "Pseudopodia engulf the food particle."),
    Qz("Number of teeth in a normal adult:", ["32", "28", "20", "36"], 0, "8 incisors, 4 canines, 8 premolars and 12 molars.") ],
  PP([ ["Name the five steps of nutrition in animals.", "Ingestion, digestion, absorption, assimilation, egestion."],
       ["Which acid is secreted in the stomach?", "Hydrochloric acid."],
       ["What is the function of villi?", "They increase the surface area of the small intestine for absorption of digested food."],
       ["Name the largest gland in the human body.", "The liver."],
       ["What is cud?", "Partly digested food that a ruminant brings back from the rumen to the mouth for chewing again."] ],
     [ ["State the roles of bile and pancreatic juice.", "Bile (from liver) emulsifies fats and makes the medium alkaline. Pancreatic juice has enzymes that digest carbohydrates, proteins and fats."],
       ["Why is mucus important in the stomach?", "It forms a protective layer so the hydrochloric acid and pepsin do not damage the stomach wall."],
       ["Differentiate between ingestion and egestion.", "Ingestion is taking food into the body through the mouth; egestion is the removal of undigested waste through the anus."],
       ["Explain how Amoeba digests food.", "It extends pseudopodia to surround the food, forming a food vacuole. Enzymes digest the food in the vacuole, nutrients diffuse into the cytoplasm and undigested matter is expelled through the cell surface."],
       ["Why do ruminants chew cud?", "Grass is swallowed quickly and stored in the rumen. Chewing it again breaks tough cellulose into smaller pieces so that bacteria can digest it more effectively."] ],
     [ ["A child has 20 milk teeth (8 incisors, 4 canines, 8 molars). Find the number of teeth in an adult and how many new teeth appear after milk teeth are lost.", "Adult teeth = 8 incisors + 4 canines + 8 premolars + 12 molars = 32. Milk teeth = 20. New teeth beyond the original set = 32 - 20 = 12 (the 12 permanent molars; the 8 milk molars are replaced by 8 premolars, and incisors and canines are replaced one for one)."],
       ["Trace a piece of bread (starch) and an egg white (protein) through the digestive system, naming the enzymes at each stage.", "Starch: mouth (salivary amylase -> maltose), small intestine (pancreatic amylase and intestinal enzymes -> glucose), absorbed by villi. Protein: stomach (HCl + pepsin -> smaller peptides), small intestine (trypsin and intestinal enzymes -> amino acids), absorbed by villi."],
       ["The small intestine is about 7 m and the large intestine about 1.5 m long. Find the total length of the intestines and the percentage that the small intestine forms. Why is the small intestine so long?", "Total = 7 + 1.5 = 8.5 m. Percentage = 7/8.5 x 100 = 82.4 percent. It is long and has villi so that there is a large surface area and enough time for complete digestion and absorption."],
       ["A person who has had the gall bladder removed is advised to eat a low-fat diet. Explain.", "Bile emulsifies fats to give a large surface for lipase. Without the gall bladder, bile is released less in a controlled way, fat digestion is less efficient, so undigested fat can cause discomfort. Eating less fat reduces this problem."],
       ["Design a short experiment to show that saliva digests starch, and state the expected result.", "Take two test tubes with starch solution. Add saliva to one and water to the other; keep both at about 37 C for 15-20 minutes. Add iodine to both. The tube with water turns blue-black (starch present); the tube with saliva stays brown/yellow (starch digested by amylase)."] ])
),
C({ CBSE: "Heat", ICSE: "Heat and its Transfer", IB: "How Does Thermal Energy Move and How Do We Measure It?" },
  [ S("1. Temperature and its Measurement",
      "<b>Temperature</b> tells how hot or cold a body is, while <b>heat</b> is the energy that flows from a hotter body to a colder one. A <b>clinical thermometer</b> reads 35 C to 42 C and has a kink to hold the mercury level; a <b>laboratory thermometer</b> reads -10 C to 110 C. Conversions: <b>F = (9/5) x C + 32</b> and <b>K = C + 273</b>. Normal human body temperature is 37 C or 98.6 F.",
      "<b>Solved example:</b> Convert 50 C to F: F = (9/5) x 50 + 32 = 90 + 32 = <b>122 F</b>. In kelvin: 50 + 273 = <b>323 K</b>."),
    S("2. Conduction, Convection and Radiation",
      "<b>Conduction</b> is the transfer of heat through a solid from particle to particle without the particles moving from place; metals are good conductors (conductors) and wood, plastic and air are poor conductors (insulators). <b>Convection</b> is the transfer of heat in liquids and gases by the actual movement of the heated fluid, which rises because it becomes less dense. <b>Radiation</b> is the transfer of heat as waves that need no medium; this is how the Sun's heat reaches us.",
      "<b>Solved example:</b> Which method heats water in a kettle? Water near the bottom heats, rises and cooler water sinks, so it is <b>convection</b>."),
    S("3. Everyday Applications of Heat Transfer",
      "Dark surfaces absorb more radiation, so light-coloured (white) clothes are preferred in summer and dark clothes in winter. Woollen clothes trap air, a poor conductor, between fibres and keep the body warm. During the day, land heats faster than the sea, so warm air rises over land and cool air flows in from the sea, giving a <b>sea breeze</b>; at night the direction reverses to a <b>land breeze</b>. Cooking vessels have metal bodies for conduction and plastic or wooden handles as insulators.",
      "<b>Solved example:</b> Why is a heater placed near the floor and an air conditioner near the ceiling? Hot air rises and cold air sinks, so <b>convection currents</b> circulate the whole room.") ],
  [ ["Kelvin scale", "The kelvin scale starts at absolute zero (0 K = -273.15 C), where particles have minimum thermal motion; a change of 1 K equals a change of 1 C."],
    ["Anomalous water", "Water has maximum density at 4 C, so lakes freeze from the top and aquatic life survives under the ice."],
    ["Equal scales", "Celsius and Fahrenheit readings are equal only at -40 degrees."],
    ["Thermos flask", "A vacuum flask reduces conduction and convection by a vacuum between double walls and reduces radiation by silvered surfaces."],
    ["Why metal feels cold", "At the same temperature, metal feels colder than wood because it conducts heat away from your hand faster, not because it is colder."] ],
  [ Qz("The range of a clinical thermometer is:", ["30 C to 100 C", "35 C to 42 C", "0 C to 100 C", "-10 C to 110 C"], 1, "It is designed for body temperature."),
    Qz("Heat transfer in fluids by actual movement of particles is:", ["Conduction", "Radiation", "Convection", "Evaporation"], 2, "Convection involves bulk movement of the fluid."),
    Qz("50 C in the Fahrenheit scale is:", ["82 F", "90 F", "112 F", "122 F"], 3, "F = 9/5 x 50 + 32 = 122."),
    Qz("Which mode of heat transfer needs no medium?", ["Radiation", "Conduction", "Convection", "All need a medium"], 0, "Radiation can travel through vacuum."),
    Qz("Which is the best conductor of heat?", ["Wood", "Copper", "Plastic", "Air"], 1, "Metals such as copper conduct heat well.") ],
  PP([ ["What is the normal human body temperature in C?", "37 C (98.6 F)."],
       ["Name the three modes of heat transfer.", "Conduction, convection and radiation."],
       ["Why is there a kink in a clinical thermometer?", "It prevents the mercury from flowing back so the reading can be noted."],
       ["Name one good and one poor conductor of heat.", "Good: copper (any metal). Poor: wood (or plastic)."],
       ["Convert 0 C into kelvin.", "0 + 273 = 273 K."] ],
     [ ["Convert 98.6 F into C.", "C = (F - 32) x 5/9 = (98.6 - 32) x 5/9 = 66.6 x 5/9 = 37 C."],
       ["Why are white clothes preferred in summer?", "White surfaces reflect most of the radiation and absorb less heat, keeping the wearer cooler."],
       ["Explain land breeze.", "At night land cools faster than the sea, so air above the sea is warmer and rises; cooler air from land moves towards the sea, forming a land breeze."],
       ["Why do cooking pots have plastic handles?", "Plastic is a poor conductor (insulator), so the handle stays cool and safe to hold."],
       ["Why do we feel warmer in woollen clothes?", "Wool traps air between its fibres. Air is a poor conductor, so it reduces heat loss from the body."] ],
     [ ["A patient has a temperature of 39.5 C. Express it in F, and say whether it can be read on a clinical thermometer.", "F = (9/5) x 39.5 + 32 = 71.1 + 32 = 103.1 F. Yes, 39.5 C lies within 35 C to 42 C (95 F to 107.6 F), so a clinical thermometer can read it."],
       ["A thermometer reads 104 F. Find the temperature in C and K.", "C = (104 - 32) x 5/9 = 72 x 5/9 = 40 C. K = 40 + 273 = 313 K."],
       ["Water is heated from 25 C to 65 C. Find the rise in temperature in C, K and F.", "Rise = 65 - 25 = 40 C = 40 K (same size of degree). In F: 40 x 9/5 = 72 F."],
       ["Show that -40 on the Celsius scale equals -40 on the Fahrenheit scale.", "F = (9/5) x (-40) + 32 = -72 + 32 = -40 F. So the two scales read the same at -40."],
       ["Explain, using conduction, convection and radiation, how heat from a fire reaches you sitting near it and heats a pot of water on it.", "Radiation from the fire warms you directly through air without a medium. The pot's base is heated by conduction through the metal. Water at the bottom becomes hot, expands, rises and cooler water sinks (convection), heating all the water."] ])
),
C({ CBSE: "Acids, Bases and Salts", ICSE: "Acids, Bases, Salts and Indicators", IB: "What Do Indicators Reveal About the Chemistry Around Us?" },
  [ S("1. Acids, Bases and Indicators",
      "<b>Acids</b> taste sour and turn blue litmus red; examples are hydrochloric (HCl), sulphuric (H2SO4), nitric (HNO3) and natural acids such as citric (lemon), acetic (vinegar), tartaric (tamarind), lactic (curd) and formic (ant sting). <b>Bases</b> taste bitter, feel soapy and turn red litmus blue; examples are NaOH, KOH, Ca(OH)2 and Mg(OH)2. Bases soluble in water are called <b>alkalis</b>. An <b>indicator</b> shows by colour change whether a substance is acidic or basic: litmus, turmeric (red in base), China rose (magenta in acid, green in base) and phenolphthalein (colourless in acid, pink in base).",
      "<b>Solved example:</b> A solution turns turmeric paper red. It is a <b>base</b>, since turmeric turns red only with bases."),
    S("2. Neutralisation and Salts",
      "<b>Neutralisation</b> is the reaction of an acid with a base to form a <b>salt</b> and water, releasing heat. <b>HCl + NaOH -> NaCl + H2O</b>. A salt is a compound made of the positive part of a base and the negative part of an acid; common salt (NaCl), washing soda and baking soda are salts. Some salts are neutral, while others can be slightly acidic or basic in water. The pH scale from 0 to 14 expresses acidity: below 7 acidic, 7 neutral (at 25 C), above 7 basic.",
      "<b>Solved example:</b> Write the products when H2SO4 reacts with NaOH: <b>Na2SO4 + 2H2O</b> (H2SO4 + 2NaOH -> Na2SO4 + 2H2O)."),
    S("3. Neutralisation in Everyday Life",
      "Indigestion is due to excess stomach acid and is treated with antacids such as milk of magnesia, Mg(OH)2. An ant sting contains formic acid, so rubbing moist baking soda or calamine solution (a mild base) gives relief. Farmers add lime (calcium hydroxide or quicklime) to acidic soil and organic manure to basic soil. Factories treat acidic waste with bases before discharging it, to protect aquatic life. Tooth decay is slowed by basic toothpaste that neutralises mouth acids.",
      "<b>Solved example:</b> Why should acid rain-affected soil be treated with lime? Lime is a <b>base</b> and neutralises the soil acidity.") ],
  [ ["Logarithmic pH", "pH is logarithmic: a solution of pH 3 has 100 times more hydrogen ions than a solution of pH 5."],
    ["Natural rain", "Unpolluted rain is slightly acidic (pH about 5.6) because of dissolved CO2; acid rain is rain with pH below 5.6."],
    ["Phenolphthalein range", "Phenolphthalein changes colour in the pH range of about 8.2 to 10, which makes it suitable for strong acid and strong base titrations."],
    ["Red cabbage indicator", "Red cabbage juice contains anthocyanin pigments that appear red in strong acid, purple in neutral and green to yellow in strong base."],
    ["Strong versus weak", "Strength depends on how completely a substance ionises, not on concentration: acetic acid is a weak acid even when concentrated."] ],
  [ Qz("Turmeric paper turns red in:", ["Acid", "Salt solution", "Base", "Water"], 2, "Turmeric turns red with bases such as soap solution."),
    Qz("The acid present in an ant sting is:", ["Citric", "Acetic", "Tartaric", "Formic"], 3, "Formic acid causes the burning sensation."),
    Qz("Acid + base gives:", ["Salt and water", "Salt and hydrogen", "Acid and water", "Base and oxygen"], 0, "This is neutralisation."),
    Qz("The pH of pure water at 25 C is:", ["0", "7", "10", "14"], 1, "Pure water is neutral."),
    Qz("Milk of magnesia is used as:", ["An acid", "A salt", "An antacid (base)", "An indicator"], 2, "Mg(OH)2 is a mild base that neutralises stomach acid.") ],
  PP([ ["Name two natural indicators.", "Litmus and turmeric (also China rose, red cabbage)."],
       ["What is the taste of acids and bases?", "Acids are sour; bases are bitter."],
       ["Name the acid found in lemon and in vinegar.", "Citric acid in lemon; acetic acid in vinegar."],
       ["What is neutralisation?", "Reaction of an acid with a base to give salt and water."],
       ["What colour does phenolphthalein show in a base?", "Pink."] ],
     [ ["Write the equation for the neutralisation of HCl by NaOH and name the salt.", "HCl + NaOH -> NaCl + H2O. The salt is sodium chloride (common salt)."],
       ["Why is baking soda applied on an ant sting?", "The sting has formic acid. Baking soda is basic, so it neutralises the acid and relieves pain."],
       ["How do farmers treat acidic soil and why?", "They add lime (a base) which neutralises the acid so that crops can grow well."],
       ["Differentiate a base and an alkali.", "A base is any substance that neutralises an acid. An alkali is a base that dissolves in water, such as NaOH; Mg(OH)2 is a base but poorly soluble."],
       ["A solution turns China rose indicator green. State its nature and give an example.", "China rose turns green in bases, so the solution is basic, for example soap or sodium hydroxide solution."] ],
     [ ["4 g of NaOH (molar mass 40 g/mol) is neutralised by HCl (36.5 g/mol). Find the mass of HCl needed and the salt formed.", "Moles NaOH = 4/40 = 0.1 mol. HCl + NaOH -> NaCl + H2O is 1:1, so HCl = 0.1 mol = 0.1 x 36.5 = 3.65 g. NaCl formed = 0.1 mol x 58.5 = 5.85 g."],
       ["Solution A has pH 3 and solution B has pH 5. Which is more acidic and by what factor is its hydrogen ion concentration greater?", "A is more acidic. Each pH unit is a factor of 10, so the difference of 2 units gives 10^2 = 100 times more hydrogen ions."],
       ["9.8 g of H2SO4 (98 g/mol) is neutralised by NaOH (40 g/mol). Find the mass of NaOH required and the mass of Na2SO4 (142 g/mol) formed.", "H2SO4 + 2NaOH -> Na2SO4 + 2H2O. Moles H2SO4 = 9.8/98 = 0.1 mol. NaOH = 2 x 0.1 = 0.2 mol = 0.2 x 40 = 8 g. Na2SO4 = 0.1 mol x 142 = 14.2 g."],
       ["You are given three unlabelled colourless solutions: acid, base and salt (neutral). Using only red and blue litmus, how will you identify each?", "Test each with both papers. The one that turns blue litmus red is the acid. The one that turns red litmus blue is the base. The one that changes neither is the neutral salt solution."],
       ["A farmer finds that the soil is acidic and the crop is poor. Explain the problem, treatment and what could go wrong if too much treatment is given.", "Acidic soil limits nutrient availability and harms roots. Adding lime (a base) neutralises the acid. Excess lime makes the soil basic, which again reduces nutrient availability, so the amount must be controlled by testing soil pH."] ])
),
C({ CBSE: "Physical and Chemical Changes", ICSE: "Physical and Chemical Changes", IB: "When Does Matter Change Its Identity?" },
  [ S("1. Physical Changes",
      "A <b>physical change</b> alters properties such as shape, size, state or colour but <b>no new substance</b> is formed, and the change is usually reversible. Examples are melting of ice, boiling of water, dissolving sugar in water, cutting paper and stretching a rubber band. The chemical composition stays the same, so water, ice and steam are all H2O. Sublimation of camphor or dry ice is also physical.",
      "<b>Solved example:</b> Is dissolving salt in water a physical change? Yes. Evaporating the water gives <b>salt back</b>, and no new substance forms."),
    S("2. Chemical Changes and Their Signs",
      "A <b>chemical change</b> forms one or more <b>new substances</b> with different properties, and it is usually irreversible. Signs include a change in colour, release of a gas, formation of a precipitate, a change in smell, and heat, light or sound. <b>Burning magnesium</b>: 2Mg + O2 -> 2MgO gives a dazzling white flame and white ash. <b>Vinegar + baking soda</b> release CO2, which turns lime water milky. <b>Fe + CuSO4 -> FeSO4 + Cu</b>: the blue solution turns pale green and copper deposits on the iron.",
      "<b>Solved example:</b> Why is burning of paper a chemical change? It forms <b>ash, CO2 and water vapour</b>, new substances that cannot be turned back into paper."),
    S("3. Rusting, Galvanisation and Crystallisation",
      "<b>Rusting</b> of iron needs both <b>oxygen and water</b>; rust is hydrated iron(III) oxide, Fe2O3.xH2O, a reddish-brown flaky solid. It is prevented by painting, oiling, galvanisation (coating with zinc) or making stainless steel (iron with chromium and nickel). <b>Crystallisation</b> is a physical process in which a hot saturated solution cools to give pure crystals, such as blue copper sulphate crystals. Copper reacts slowly with air and carbon dioxide to form a green coating.",
      "<b>Solved example:</b> A nail in boiled water covered with oil does not rust because it lacks <b>air (oxygen)</b>; rusting needs both air and water.") ],
  [ ["Statue of Liberty", "The green colour of aged copper statues (patina) is a basic copper carbonate or sulphate (mainly brochantite on the Statue of Liberty) formed from copper, oxygen, CO2, sulphur compounds and moisture."],
    ["Sacrificial protection", "Zinc protects iron even when the coating is scratched because zinc is more reactive and corrodes first (sacrificial protection)."],
    ["Conservation of mass", "Lavoisier showed that the total mass of reactants equals the total mass of products in a closed system."],
    ["Electrolysis of water", "Electrolysis of water gives hydrogen and oxygen in a volume ratio of 2:1, matching the formula H2O."],
    ["Rust gains mass", "An iron nail gains mass on rusting because oxygen and water from the surroundings combine with the iron."] ],
  [ Qz("Which of these is a chemical change?", ["Melting of ice", "Dissolving sugar", "Breaking glass", "Burning of paper"], 3, "Burning forms new substances."),
    Qz("Rusting of iron requires:", ["Oxygen and water", "Only oxygen", "Only water", "Nitrogen and light"], 0, "Both air and moisture are needed."),
    Qz("The gas released when baking soda reacts with vinegar is:", ["O2", "CO2", "H2", "N2"], 1, "CO2 turns lime water milky."),
    Qz("Galvanisation is coating iron with:", ["Tin", "Copper", "Zinc", "Gold"], 2, "Zinc coating prevents rusting."),
    Qz("When an iron nail is put into copper sulphate solution, the blue colour becomes:", ["Deep red", "Colourless", "Black", "Pale green"], 3, "Iron sulphate (pale green) forms.") ],
  PP([ ["Define a physical change with an example.", "A change in which no new substance forms, e.g. melting of ice."],
       ["Name two signs of a chemical change.", "Gas evolution and colour change (also heat, light, precipitate)."],
       ["What is rust chemically?", "Hydrated iron(III) oxide, Fe2O3.xH2O."],
       ["Name a method to prevent rusting.", "Painting (or galvanisation, oiling)."],
       ["Is crystallisation a physical or chemical change?", "Physical change."] ],
     [ ["Why is burning of a candle both a physical and a chemical change?", "Melting of wax is physical (no new substance); burning of wax vapour forms CO2 and water, so it is chemical."],
       ["Write the word and symbol equation for burning of magnesium.", "Magnesium + oxygen -> magnesium oxide; 2Mg + O2 -> 2MgO."],
       ["Why does the blue colour of copper sulphate solution fade when an iron nail is dipped in it?", "Iron displaces copper: Fe + CuSO4 -> FeSO4 + Cu. Blue copper sulphate is used up and pale green iron sulphate forms."],
       ["How can you show that rusting needs air and water?", "Place nails in three tubes: (1) air and water, (2) boiled water with oil layer, (3) dry air with calcium chloride. Only the nail in tube 1 rusts."],
       ["Differentiate physical and chemical changes in any two points.", "Physical: no new substance, usually reversible. Chemical: new substance forms, usually irreversible, often with heat, light or gas."] ],
     [ ["12 g of magnesium burns completely in oxygen (Mg = 24, O = 16). Find the mass of MgO formed and the mass of oxygen used.", "2Mg + O2 -> 2MgO. Moles Mg = 12/24 = 0.5 mol, so MgO = 0.5 mol x 40 = 20 g. Oxygen used = 20 - 12 = 8 g (0.25 mol O2 x 32 = 8 g)."],
       ["5.6 g of iron is heated with 6.4 g of sulphur to form FeS (Fe = 56, S = 32). Find the mass of FeS and which reactant is left over.", "Fe + S -> FeS. Fe = 5.6/56 = 0.1 mol; S = 6.4/32 = 0.2 mol. They react 1:1, so 0.1 mol FeS = 0.1 x 88 = 8.8 g. Sulphur left = 0.1 mol = 3.2 g. Check: 5.6 + 6.4 = 12.0 = 8.8 + 3.2."],
       ["11.2 g of iron rusts completely by 4Fe + 3O2 -> 2Fe2O3 (Fe = 56, O = 16). Find the mass of Fe2O3 and the oxygen consumed.", "Fe = 11.2/56 = 0.2 mol. Fe2O3 = 0.1 mol x 160 = 16 g. Oxygen used = 16 - 11.2 = 4.8 g (0.15 mol x 32). So mass increases from 11.2 g to 16 g."],
       ["A student weighs a closed flask containing baking soda and vinegar before and after reacting, and again with an open flask. Predict and explain the results.", "Closed flask: mass is unchanged, because CO2 stays inside and mass is conserved. Open flask: apparent mass decreases because CO2 escapes into the air. Total mass of matter is still conserved."],
       ["Classify each as physical or chemical and justify: (a) dry ice turning to gas, (b) milk turning sour, (c) glass being blown into shape, (d) an apple turning brown.", "(a) Physical: CO2 solid becomes CO2 gas, same substance. (b) Chemical: bacteria form lactic acid, a new substance. (c) Physical: only shape changes. (d) Chemical: oxidation by air forms new brown compounds."] ])
),
C({ CBSE: "Respiration in Organisms", ICSE: "Respiration in Living Organisms", IB: "How Do Living Things Release Energy from Food?" },
  [ S("1. Cellular Respiration: Aerobic and Anaerobic",
      "<b>Respiration</b> is the release of energy from food inside cells; it happens mostly in the <b>mitochondria</b> and the energy is stored as ATP. <b>Aerobic respiration</b> uses oxygen: <b>C6H12O6 + 6O2 -> 6CO2 + 6H2O + energy</b>. <b>Anaerobic respiration</b> occurs without oxygen: in yeast, glucose -> alcohol + CO2 + little energy; in muscle cells, glucose -> lactic acid + little energy. Aerobic respiration releases far more energy per glucose than anaerobic respiration.",
      "<b>Solved example:</b> Why does dough rise? Yeast respires anaerobically and releases <b>CO2</b>, which forms bubbles in the dough."),
    S("2. Breathing in Humans",
      "<b>Breathing</b> is the physical process of taking in air and giving out air; respiration is the chemical release of energy. During <b>inhalation</b> the ribs move up and out and the <b>diaphragm</b> moves down, increasing chest volume so air rushes in. During <b>exhalation</b> the ribs move down and in and the diaphragm moves up, so air is pushed out. Inhaled air has about 21 percent oxygen and 0.04 percent CO2, while exhaled air has about 16 percent oxygen and about 4 percent CO2. Haemoglobin in red blood cells carries oxygen.",
      "<b>Solved example:</b> A person breathes 15 times per minute. In 1 hour: 15 x 60 = <b>900 breaths</b>."),
    S("3. Respiration in Other Organisms",
      "Insects such as cockroaches have air tubes called <b>tracheae</b> opening through <b>spiracles</b>. Fish use <b>gills</b> to take dissolved oxygen from water. An earthworm and a frog use moist skin; the frog also has lungs. Plants exchange gases through <b>stomata</b> in leaves, <b>lenticels</b> in stems and the general surface of roots. Plants respire day and night, but photosynthesis during the day produces more oxygen than respiration uses.",
      "<b>Solved example:</b> Why are earthworms found in moist soil? Their <b>moist skin</b> is the respiratory surface; oxygen dissolves in the moisture before diffusing in.") ],
  [ ["Energy yield", "Complete aerobic breakdown of one glucose gives roughly 30 to 38 ATP while anaerobic glycolysis gives only 2 ATP, so aerobic respiration is much more efficient."],
    ["Respiratory quotient", "The ratio of CO2 produced to O2 used is 1.0 for glucose (6 CO2 / 6 O2) and about 0.7 for fats."],
    ["Carbon monoxide", "CO binds to haemoglobin over 200 times more strongly than O2, preventing oxygen transport and causing poisoning."],
    ["Oxygen debt", "After heavy exercise, rapid breathing continues to repay the oxygen debt used to clear lactic acid built up in muscles."],
    ["Fermentation uses", "Yeast fermentation is used in baking, brewing and ethanol production; Lactobacillus converts milk sugar to lactic acid to make curd."] ],
  [ Qz("Anaerobic respiration in yeast produces:", ["Alcohol and CO2", "Lactic acid", "Water only", "Glucose"], 0, "Yeast ferments sugar into ethanol and CO2."),
    Qz("During inhalation the diaphragm:", ["Moves up", "Flattens and moves down", "Stays unchanged", "Bursts"], 1, "This increases chest volume."),
    Qz("Insects breathe through:", ["Gills", "Lungs", "Tracheae", "Skin"], 2, "Tracheal tubes open at spiracles."),
    Qz("Muscle cramps after heavy exercise are linked with the build-up of:", ["Alcohol", "CO2", "Glucose", "Lactic acid"], 3, "Anaerobic respiration in muscle forms lactic acid."),
    Qz("The site of cellular respiration is the:", ["Mitochondria", "Nucleus", "Ribosome", "Vacuole"], 0, "Mitochondria are the powerhouse of the cell.") ],
  PP([ ["Define respiration.", "The release of energy from food (glucose) in the cells of living organisms."],
       ["Name the respiratory organs of fish and cockroach.", "Fish: gills. Cockroach: tracheae."],
       ["What gas is released by yeast during fermentation?", "Carbon dioxide."],
       ["Which pigment carries oxygen in blood?", "Haemoglobin."],
       ["Name the openings in plant leaves for gas exchange.", "Stomata."] ],
     [ ["Write the equation of aerobic respiration.", "C6H12O6 + 6O2 -> 6CO2 + 6H2O + energy."],
       ["Differentiate breathing and respiration.", "Breathing is the physical process of inhaling and exhaling air. Respiration is the chemical process of releasing energy from food in cells."],
       ["Why do we breathe faster after running?", "Muscles need more energy, so more oxygen is required and more CO2 must be removed; the breathing rate rises to meet this demand."],
       ["Explain how a frog breathes on land and in water.", "On land it uses lungs and moist skin; in water (or when hibernating) it breathes mainly through its moist skin."],
       ["How does anaerobic respiration in muscles differ from that in yeast?", "In muscles, glucose forms lactic acid and a little energy. In yeast, glucose forms alcohol, CO2 and a little energy."] ],
     [ ["A person breathes 16 times per minute, each breath moving 500 mL. Calculate the air breathed per minute and per hour. If the body extracts 5 percent of this air volume as oxygen (21 percent in, 16 percent out), find the oxygen used per minute and per hour.", "Per minute = 16 x 500 = 8000 mL = 8 L. Per hour = 8 x 60 = 480 L. Oxygen extracted fraction = 21 - 16 = 5 percent. Per minute = 0.05 x 8 L = 0.4 L. Per hour = 0.4 x 60 = 24 L."],
       ["A resting person breathes 18 times a minute. Find the breaths in one hour and in one day. During exercise the rate becomes 40 per minute and each breath is 1500 mL instead of 500 mL; compare the air moved per minute.", "One hour = 18 x 60 = 1080. One day = 18 x 1440 = 25 920. Resting air = 18 x 0.5 = 9 L/min; exercise air = 40 x 1.5 = 60 L/min; ratio = 60/9 = 6.7 times more air."],
       ["Using ATP, compare the efficiency of anaerobic respiration (2 ATP) with aerobic respiration (about 38 ATP) per glucose molecule, and explain why yeast still uses anaerobic respiration in dough.", "38/2 = 19, so aerobic gives about 19 times more ATP. In dough, oxygen is scarce, so yeast ferments sugar to survive; the CO2 released makes the dough rise while ethanol evaporates on baking."],
       ["A beaker has germinating seeds in a closed flask with a small tube of KOH solution (absorbs CO2). A water column in a connected tube rises towards the flask. Explain.", "Seeds respire, using oxygen and releasing CO2. KOH absorbs the CO2, so the gas volume in the flask falls by the volume of oxygen used. Pressure drops and the water column moves toward the flask."],
       ["A mountaineer at high altitude breathes faster and feels tired. Explain using the ideas of oxygen concentration, haemoglobin and respiration.", "At altitude air pressure is low, so each breath has less oxygen and haemoglobin is less saturated. Cells get less oxygen for aerobic respiration, so less energy is released and anaerobic respiration builds up lactic acid. Breathing rate rises to compensate."] ])
),
C({ CBSE: "Motion and Time", ICSE: "Motion, Speed and Measurement of Time", IB: "How Do We Describe and Measure Movement and Time?" },
  [ S("1. Speed, Distance and Time",
      "<b>Speed</b> is the distance travelled per unit time: <b>speed = distance / time</b>. Its SI unit is metre per second (m/s); others are km/h. To convert, <b>1 km/h = 5/18 m/s</b> and 1 m/s = 3.6 km/h. A body has <b>uniform motion</b> if it covers equal distances in equal intervals of time, and <b>non-uniform motion</b> otherwise. <b>Average speed = total distance / total time</b>. An odometer measures distance and a speedometer shows speed.",
      "<b>Solved example:</b> A train covers 360 km in 4 h. Speed = 360/4 = <b>90 km/h</b> = 90 x 5/18 = <b>25 m/s</b>."),
    S("2. Measuring Time and the Simple Pendulum",
      "Time has been measured by sundials, water clocks, hourglasses, pendulum clocks, and quartz and atomic clocks. A <b>simple pendulum</b> is a small bob hung from a string. One <b>oscillation</b> is one complete to-and-fro motion. The <b>time period (T)</b> is the time taken for one oscillation: <b>T = total time / number of oscillations</b>, and frequency is f = 1/T in hertz. For small swings the time period depends on the length of the string (T is proportional to the square root of L) and not on the mass of the bob or on the amplitude.",
      "<b>Solved example:</b> A pendulum completes 20 oscillations in 40 s. T = 40/20 = <b>2 s</b> and f = 1/2 = <b>0.5 Hz</b>."),
    S("3. Distance-Time Graphs",
      "A <b>distance-time graph</b> plots time on the x-axis and distance on the y-axis. A straight line sloping upward shows <b>uniform speed</b> and its slope (rise/run) equals the speed. A horizontal line shows that the body is <b>at rest</b>. A curved line shows <b>non-uniform speed</b>. A steeper line means a greater speed. Graphs let us find distance, time and speed at a glance.",
      "<b>Solved example:</b> A straight line passes through (0 s, 0 m) and (5 s, 20 m). Speed = 20/5 = <b>4 m/s</b>.") ],
  [ ["Pendulum formula", "For small angles T = 2 x pi x sqrt(L/g); a pendulum 1 m long has T of about 2 s, and quadrupling L doubles T."],
    ["Atomic second", "One second is defined as 9 192 631 770 periods of radiation from the caesium-133 atom."],
    ["Quartz clocks", "A quartz crystal in watches vibrates at 32 768 Hz (2^15), which is easy to halve down to one pulse per second."],
    ["Average speed trap", "Average speed is not the mean of speeds: going 60 km at 30 km/h and 60 km at 60 km/h gives 40 km/h, not 45 km/h."],
    ["Pendulum on the Moon", "Since g on the Moon is about one sixth of Earth's, the same pendulum's period is about sqrt(6), roughly 2.4 times, longer."] ],
  [ Qz("The SI unit of speed is:", ["km/h", "m/s", "m/min", "cm/h"], 1, "Distance in m and time in s give m/s."),
    Qz("36 km/h in m/s is:", ["5", "8", "10", "36"], 2, "36 x 5/18 = 10."),
    Qz("The time period of a pendulum is the time for:", ["Half an oscillation", "Ten oscillations", "Changing its length", "One complete oscillation"], 3, "It is the time of one to-and-fro swing."),
    Qz("A straight sloping line in a distance-time graph means:", ["Uniform speed", "Body at rest", "Non-uniform speed", "Zero distance"], 0, "Constant slope means constant speed."),
    Qz("The time period of a simple pendulum (small swings) does NOT depend on:", ["Length of the string", "Mass of the bob", "Value of g", "All of these"], 1, "Mass does not affect T.") ],
  PP([ ["Write the formula of speed.", "Speed = distance / time."],
       ["Convert 72 km/h into m/s.", "72 x 5/18 = 20 m/s."],
       ["Define one oscillation of a pendulum.", "One complete to-and-fro motion of the bob."],
       ["What does a horizontal line in a distance-time graph show?", "The body is at rest."],
       ["Name any two instruments to measure time.", "Sundial and quartz clock (or pendulum clock, hourglass)."] ],
     [ ["A cyclist covers 4.5 km in 15 minutes. Find the speed in km/h and m/s.", "Time = 15/60 = 0.25 h. Speed = 4.5/0.25 = 18 km/h = 18 x 5/18 = 5 m/s."],
       ["A pendulum makes 30 oscillations in 1 minute. Find its time period and frequency.", "T = 60/30 = 2 s. Frequency = 1/2 = 0.5 Hz."],
       ["Differentiate uniform and non-uniform motion with an example.", "Uniform: equal distances in equal times (a car at steady 60 km/h). Non-uniform: unequal distances in equal times (a bus in city traffic)."],
       ["How much distance does a car travelling at 15 m/s cover in 2 minutes?", "Distance = speed x time = 15 x 120 = 1800 m = 1.8 km."],
       ["Why is a distance-time graph of a moving car not a straight line in city traffic?", "The speed changes as the car speeds up, slows down and stops, so equal intervals give unequal distances and the graph is curved or has varying slope."] ],
     [ ["A car travels 60 km at 30 km/h and then another 60 km at 60 km/h. Find the average speed and explain why it is not 45 km/h.", "Time 1 = 60/30 = 2 h; time 2 = 60/60 = 1 h. Total distance = 120 km; total time = 3 h. Average = 120/3 = 40 km/h. It is not the mean of speeds because more time is spent at the lower speed."],
       ["A car moves at 54 km/h for 20 s and then at 10 m/s for 30 s. Find the total distance and the average speed in m/s.", "54 km/h = 15 m/s. Distance 1 = 15 x 20 = 300 m. Distance 2 = 10 x 30 = 300 m. Total = 600 m in 50 s. Average speed = 600/50 = 12 m/s."],
       ["A graph passes through (0 s, 0 m), (2 s, 10 m), (4 s, 10 m), (6 s, 30 m). Find the speed in each interval and the average speed.", "0-2 s: 10/2 = 5 m/s. 2-4 s: 0 m/s (rest). 4-6 s: 20/2 = 10 m/s. Average = 30/6 = 5 m/s."],
       ["A pendulum of length 1 m has T = 2 s. Using T proportional to the square root of L, find T for a length of 0.25 m, and the number of oscillations in 1 minute for each.", "T2 = 2 x sqrt(0.25) = 2 x 0.5 = 1 s. In 60 s: first = 60/2 = 30 oscillations; second = 60/1 = 60 oscillations."],
       ["Train A moves at 90 km/h and train B at 60 km/h on parallel tracks in the same direction, A starting 60 km behind B. After how long does A catch up with B, and how far has A travelled?", "Relative speed = 90 - 60 = 30 km/h. Time = 60/30 = 2 h. Distance by A = 90 x 2 = 180 km (B travels 120 km, 120 + 60 = 180 km, consistent)."] ])
),
C({ CBSE: "Electric Current and its Effects", ICSE: "Electric Current and its Effects", IB: "What Can Electric Current Do and How Do We Use It Safely?" },
  [ S("1. Circuits, Symbols and Heating Effect",
      "An <b>electric circuit</b> is a closed path for current from a cell or battery through a switch, bulb or other components; the current flows only when the circuit is closed. Symbols: cell, battery, switch, bulb, wire. When current passes through a conductor it produces heat, the <b>heating effect</b>, given by <b>H = I^2 x R x t</b> (Joule's law). Heaters, irons and geysers use <b>nichrome</b> wire, which has high resistance and a high melting point. A <b>fuse</b> is a thin wire that melts when too much current flows and breaks the circuit.",
      "<b>Solved example:</b> Heat produced by 2 A through 10 ohm for 30 s: H = 2^2 x 10 x 30 = <b>1200 J</b>."),
    S("2. Magnetic Effect and Electromagnets",
      "In 1820, <b>Oersted</b> found that a current-carrying wire deflects a compass needle, showing that current produces a <b>magnetic effect</b>. A coil of insulated wire wound over a soft iron core becomes an <b>electromagnet</b> when current flows, and it loses magnetism when the current stops. Its strength increases with more turns and a larger current. Electromagnets are used in electric bells, cranes for lifting scrap iron, relays and MRI machines.",
      "<b>Solved example:</b> How can you make an electromagnet stronger? Increase the <b>number of turns</b> of the coil or the <b>current</b>, and use a soft iron core."),
    S("3. Chemical Effect and Electroplating",
      "Most liquids that conduct electricity are solutions of acids, bases and salts; distilled water, oil and sugar solution do not conduct. When current passes through a conducting solution, <b>chemical reactions</b> occur at the electrodes, called the <b>chemical effect</b> or electrolysis. In <b>electroplating</b>, the object is made the cathode and the plating metal the anode in a salt solution of that metal; for example copper sulphate solution can deposit copper. Electroplating protects metals from corrosion and improves their appearance. A LED glows in a tester when the liquid conducts.",
      "<b>Solved example:</b> Which is the cathode when a spoon is silver plated? The <b>spoon</b> is the cathode (connected to the negative terminal).") ],
  [ ["Current direction", "Conventional current flows from positive to negative, opposite to the direction of electron movement."],
    ["Drift speed", "Free electrons in a wire drift at only about millimetres per second, yet a bulb lights almost instantly because the electric field travels along the wire at near light speed."],
    ["Filament", "A bulb filament is tungsten, which melts at 3422 C, and runs at about 2500 C inside an inert gas to stop it oxidising."],
    ["Fuse placement", "Fuses and MCBs are placed in the live wire so that a fault cuts off the supply, and the earth wire gives leakage current a safe path."],
    ["Series and parallel", "Cells in series add their voltages (4 cells of 1.5 V give 6 V); household appliances are connected in parallel so each gets the full 220 V."] ],
  [ Qz("Nichrome is used in heaters because it has:", ["Low resistance", "Low melting point", "High resistance and high melting point", "Magnetic property"], 2, "It heats up strongly and does not melt."),
    Qz("Oersted discovered the:", ["Heating effect", "Chemical effect", "Gravity", "Magnetic effect of current"], 3, "A compass needle deflected near a current-carrying wire."),
    Qz("A fuse works on the:", ["Heating effect", "Magnetic effect", "Chemical effect", "Light effect"], 0, "Excess current melts the fuse wire."),
    Qz("Electroplating is based on the:", ["Heating effect", "Chemical effect", "Magnetic effect", "Friction"], 1, "Current deposits metal by a chemical change."),
    Qz("Which of these liquids conducts electricity well?", ["Distilled water", "Vegetable oil", "Lemon juice", "Kerosene"], 2, "Lemon juice contains acid that provides ions.") ],
  PP([ ["Name the three effects of electric current.", "Heating, magnetic and chemical effects."],
       ["What is an electromagnet?", "A coil of wire around a soft iron core that becomes a magnet when current flows."],
       ["Why is a fuse used?", "It melts and breaks the circuit when excess current flows, protecting appliances."],
       ["Name one liquid that conducts and one that does not.", "Conducts: lemon juice (salt water). Does not: distilled water (oil)."],
       ["Who discovered the magnetic effect of electric current?", "Hans Christian Oersted."] ],
     [ ["Four cells of 1.5 V are joined in series. Find the battery voltage.", "Voltage = 4 x 1.5 = 6 V."],
       ["Find the current through a 4 ohm resistor connected to a 12 V battery.", "I = V/R = 12/4 = 3 A."],
       ["Why do heaters use nichrome and not copper?", "Nichrome has high resistance, so it produces more heat, and a high melting point so it does not melt; copper has low resistance."],
       ["Name any two uses of electromagnets.", "Electric bell and crane to lift scrap iron (also relays, MRI)."],
       ["Describe how electroplating of copper on an iron key is carried out.", "Take copper sulphate solution; connect the key to the negative terminal (cathode) and a copper plate to the positive (anode). On passing current, copper deposits on the key."] ],
     [ ["A heater coil of resistance 20 ohm carries 3 A for 10 s. Find the heat produced.", "H = I^2 R t = 3^2 x 20 x 10 = 9 x 20 x 10 = 1800 J."],
       ["A 2 kW heater is used for 3 hours daily for 30 days. Find the energy in kWh and the cost at Rs 8 per unit.", "Energy = 2 kW x 3 h x 30 = 180 kWh (units). Cost = 180 x 8 = Rs 1440."],
       ["An appliance of 1000 W works at 220 V. Find the current and choose between 3 A, 5 A and 15 A fuses.", "I = P/V = 1000/220 = 4.55 A. A 3 A fuse would blow, so the 5 A fuse (just above 4.55 A) is suitable; 15 A would not protect the appliance well."],
