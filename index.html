      "A <b>polygon</b> is a closed figure made of line segments; it is <b>convex</b> if every interior angle is less than 180 degrees. The interior angle sum of an n-sided polygon is <b>(n - 2) x 180</b> degrees, and the exterior angles (one at each vertex) always sum to <b>360</b> degrees. A <b>regular polygon</b> has equal sides and angles, so each exterior angle = 360/n. The number of diagonals is <b>n(n - 3)/2</b>.",

/* ===== Chapter 4: Squares and Square Roots ===== */
C({ CBSE: "Squares and Square Roots", ICSE: "Squares, Square Roots and Pythagorean Triplets", IB: "Perfect Squares and Surds Introduction" },
  [ S("1. Squares and Their Patterns",
      "The <b>square</b> of n is n x n = n^2. A perfect square ends only in 0, 1, 4, 5, 6 or 9, and a number ending in an odd number of zeros is never a perfect square. Useful patterns: n^2 = <b>sum of the first n odd numbers</b>; (n+1)^2 - n^2 = 2n + 1; there are 2n non-square numbers between n^2 and (n+1)^2. For a number ending in 5, (a5)^2 = a(a+1) followed by 25. A <b>Pythagorean triplet</b> is (2m, m^2 - 1, m^2 + 1).",
      "<b>Solved example:</b> Find 75^2. Here a = 7, so a(a+1) = 7 x 8 = 56, followed by 25: <b>5625</b>. Also 1 + 3 + 5 + ... (12 odd numbers) = 12^2 = <b>144</b>."),
    S("2. Square Roots by Factorisation and Division",
      "The <b>square root</b> reverses squaring: sqrt(n^2) = n for n positive. By <b>prime factorisation</b>, pair equal prime factors and take one from each pair. By <b>long division</b>, group digits in pairs from the decimal point, then find the largest digit whose square fits at each step. For decimals, group pairs on both sides of the point; the root has half as many decimal places.",
      "<b>Solved example:</b> Find sqrt(5184). 5184 = 2 x 2 x 2 x 2 x 2 x 2 x 3 x 3 x 3 x 3 = 2^6 x 3^4. Pairs give 2^3 x 3^2 = 8 x 9 = <b>72</b>. Check: 72^2 = 5184."),
    S("3. Making Perfect Squares and Estimating Roots",
      "To make a number a perfect square by <b>multiplying</b>, multiply by the primes that appear an odd number of times; to make it one by <b>dividing</b>, divide by those same primes. If n^2 < N < (n+1)^2 then sqrt(N) lies between n and n+1. A perfect square with k digits has a root of k/2 digits (k even) or (k+1)/2 digits (k odd).",
      "<b>Solved example:</b> Smallest multiplier making 252 a perfect square. 252 = 2^2 x 3^2 x 7; only 7 is unpaired. 252 x 7 = 1764 = 42^2. Answer: <b>7</b>.") ],
  [ ["Ending in 5", "(10a + 5)^2 = 100a(a + 1) + 25, so 85^2 = 100 x 72 + 25 = 7225."],
    ["Odd sums", "1 + 3 + 5 + ... + (2n - 1) = n^2, so the sum of the first 25 odd numbers is 625."],
    ["Mod 4 test", "A perfect square leaves remainder 0 or 1 when divided by 4, so no number of the form 4k + 2 or 4k + 3 is a square."],
    ["Four in a row", "n(n+1)(n+2)(n+3) + 1 = (n^2 + 3n + 1)^2: for n = 1, 24 + 1 = 25 = 5^2."],
    ["Odd divisors", "A positive integer is a perfect square exactly when it has an odd number of divisors; 36 has 9."] ],
  [ Qz("The value of 35^2 is:", ["1025", "1125", "1325", "1225"], 3, "3 x 4 = 12, followed by 25 gives 1225."),
    Qz("sqrt(1764) equals:", ["42", "44", "46", "36"], 0, "42 x 42 = 1764."),
    Qz("How many non-square numbers lie between 12^2 and 13^2?", ["23", "24", "25", "26"], 1, "Between n^2 and (n+1)^2 there are 2n numbers: 24."),
    Qz("Which of these is NOT a perfect square?", ["1296", "2209", "4878", "3136"], 2, "A perfect square cannot end in 8; the others are 36^2, 47^2, 56^2."),
    Qz("The smallest number by which 72 must be multiplied to get a perfect square is:", ["2", "3", "6", "8"], 0, "72 = 2^3 x 3^2, so one extra 2 is needed: 144.") ],
  PP([ ["Find 23^2.", "23 x 23 = 529."],
       ["Find sqrt(196).", "196 = 2^2 x 7^2, so sqrt = 14."],
       ["Is 1500 a perfect square? Give a reason.", "No. It ends in exactly one zero (odd number of zeros). Also 38^2 = 1444 and 39^2 = 1521."],
       ["Find the sum of the first 7 odd numbers.", "7^2 = 49."],
       ["Find sqrt(0.0169).", "0.13, because 0.13 x 0.13 = 0.0169."] ],
     [ ["Write a Pythagorean triplet whose smallest member is 12.", "2m = 12 gives m = 6. Triplet: 12, m^2 - 1 = 35, m^2 + 1 = 37. Check: 144 + 1225 = 1369 = 37^2."],
       ["Find sqrt(7056) by prime factorisation.", "7056 = 2^4 x 3^2 x 7^2. Root = 2^2 x 3 x 7 = 84. Check: 84^2 = 7056."],
       ["By which smallest number should 2028 be divided to get a perfect square? Find the root.", "2028 = 2^2 x 3 x 13^2, so divide by 3: 676 = 26^2. Root 26."],
       ["Find sqrt(729/1296).", "sqrt(729) = 27 and sqrt(1296) = 36, so the value is 27/36 = 3/4."],
       ["Find 41^2 - 40^2 without squaring, and state the rule used.", "(n+1)^2 - n^2 = 2n + 1, so with n = 40 the answer is 81."] ],
     [ ["Find the least number to be subtracted from 5607 to get a perfect square, and the least number to be added. Give both squares.", "74^2 = 5476 and 75^2 = 5625, and 5476 < 5607 < 5625. Subtract 5607 - 5476 = 131 to get 5476 = 74^2. Add 5625 - 5607 = 18 to get 5625 = 75^2."],
       ["Find the smallest perfect square divisible by each of 6, 8 and 12.", "LCM(6, 8, 12) = 24 = 2^3 x 3. Make every exponent even: 2^4 x 3^2 = 144. Check: 144/24 = 6, and 144 = 12^2."],
       ["Use (2m, m^2 - 1, m^2 + 1) to find the triplet whose largest member is 65, and verify it.", "m^2 + 1 = 65 gives m = 8. Triplet: 16, 63, 65. Check: 256 + 3969 = 4225 = 65^2."],
       ["Without full multiplication, find sqrt(10 x 11 x 12 x 13 + 1).", "Using n(n+1)(n+2)(n+3) + 1 = (n^2 + 3n + 1)^2 with n = 10: root = 100 + 30 + 1 = 131. Check: 17160 + 1 = 17161 = 131^2."],
       ["A school wants to place 1000 students in rows with as many rows as columns. How many are left over, and how many more are needed to complete the next square?", "31^2 = 961 < 1000 < 32^2 = 1024. Left over: 1000 - 961 = 39 students. More needed: 1024 - 1000 = 24 students."] ])
),

/* ===== Chapter 5: Cubes and Cube Roots ===== */
C({ CBSE: "Cubes and Cube Roots", ICSE: "Cubes and Cube Roots", IB: "Perfect Cubes and Cube Root Methods" },
  [ S("1. Cubes and Their Patterns",
      "The <b>cube</b> of n is n x n x n = n^3, and a number is a <b>perfect cube</b> if it equals m^3 for an integer m. The unit digit of a cube follows the unit digit of the number: 1 to 1, 2 to 8, 3 to 7, 4 to 4, 5 to 5, 6 to 6, 7 to 3, 8 to 2, 9 to 9, 0 to 0. The cube n^3 is the sum of n consecutive odd numbers starting from n(n-1) + 1. The number <b>1729</b> = 1^3 + 12^3 = 9^3 + 10^3 is the Hardy-Ramanujan number.",
      "<b>Solved example:</b> Express 4^3 as a sum of odd numbers. Start at 4(3) + 1 = 13: 13 + 15 + 17 + 19 = <b>64</b>. Also 15^3 = 225 x 15 = <b>3375</b>."),
    S("2. Cube Roots by Prime Factorisation",
      "The <b>cube root</b> of n^3 is n, written cbrt(n^3) = n. Factorise the number into primes and group <b>triplets</b> of equal primes; take one prime from each triplet and multiply. Negative numbers have real cube roots: cbrt(-27) = -3. A number is a perfect cube only if every prime exponent is a multiple of 3.",
      "<b>Solved example:</b> Find cbrt(5832). 5832 = 8 x 729 = 2^3 x 3^6. Triplets give 2 x 3^2 = 2 x 9 = <b>18</b>. Check: 18^3 = 324 x 18 = 5832."),
    S("3. Estimating Cube Roots and Making Perfect Cubes",
      "For a perfect cube of up to 6 digits, split the digits into groups of three from the right. The <b>last group</b> fixes the unit digit of the root; the <b>first group</b> fixes the tens digit (the largest cube not exceeding it). To make a number a cube by multiplying, supply the missing primes to complete each triplet; to make one by dividing, remove the extra primes.",
      "<b>Solved example:</b> Find cbrt(54872). Groups: 54 | 872. 872 ends in 2, so the unit digit is 8. 27 < 54 < 64, so the tens digit is 3. Root = <b>38</b>. Check: 38^3 = 1444 x 38 = 54872.") ],
  [ ["Taxicab", "1729 is the smallest number expressible as a sum of two positive cubes in two ways: 1 + 1728 and 729 + 1000."],
    ["Sum of cubes", "1^3 + 2^3 + ... + n^3 = (n(n+1)/2)^2, so 1^3 + ... + 10^3 = 55^2 = 3025."],
    ["Divisibility", "n^3 - n = (n-1)n(n+1) is a product of three consecutive integers, so it is always divisible by 6."],
    ["Mod 9", "Every integer cube leaves remainder 0, 1 or 8 on division by 9, so a number like 9k + 4 is never a perfect cube."],
    ["Zero-sum identity", "If a + b + c = 0 then a^3 + b^3 + c^3 = 3abc: (-5)^3 + 2^3 + 3^3 = -90 = 3(-5)(2)(3)."] ],
  [ Qz("cbrt(2744) equals:", ["12", "14", "16", "13"], 1, "14 x 14 x 14 = 2744."),
    Qz("The unit digit of 27^3 is:", ["7", "9", "3", "1"], 2, "7^3 = 343 ends in 3."),
    Qz("The smallest number by which 135 must be multiplied to get a perfect cube is:", ["5", "3", "15", "25"], 3, "135 = 3^3 x 5; need 5^3, so multiply by 5^2 = 25."),
    Qz("cbrt(-512) equals:", ["-8", "8", "-64", "-16"], 0, "(-8)^3 = -512."),
    Qz("Which of these is NOT a perfect cube?", ["1331", "3375", "5000", "4096"], 2, "11^3 = 1331, 15^3 = 3375, 16^3 = 4096; 17^3 = 4913 and 18^3 = 5832 skip 5000.") ],
  PP([ ["Find 9^3.", "9 x 9 x 9 = 729."],
       ["Find cbrt(343).", "7 x 7 x 7 = 343, so the root is 7."],
       ["Find cbrt(-125).", "(-5)^3 = -125, so the root is -5."],
       ["Is 100 a perfect cube?", "No: 4^3 = 64 and 5^3 = 125, and 100 lies between them."],
       ["Find the unit digit of 13^3.", "3^3 = 27, so the unit digit is 7 (13^3 = 2197)."] ],
     [ ["Find cbrt(1728) by prime factorisation.", "1728 = 2^6 x 3^3. Root = 2^2 x 3 = 12."],
       ["Find the smallest number by which 243 should be multiplied to get a perfect cube. Give the cube root.", "243 = 3^5; need 3^6, so multiply by 3 to get 729. Cube root = 9."],
       ["By which smallest number should 1944 be divided to get a perfect cube? Find the cube root.", "1944 = 2^3 x 3^5. Divide by 3^2 = 9 to get 216. Cube root = 6."],
       ["Evaluate cbrt(0.001728).", "0.001728 = 1728/1000000, cbrt = 12/100 = 0.12."],
       ["Estimate and verify cbrt(10648).", "Groups 10 | 648. 648 ends in 8, so unit digit 2. 8 < 10 < 27, so tens digit 2. Root 22. Check: 22^3 = 484 x 22 = 10648."] ],
     [ ["The volume of a cube is 9261 cm^3. Find its edge and its total surface area.", "Groups 9 | 261: unit digit 1, tens digit 2 (8 < 9 < 27), so edge = 21 cm. Check 21^3 = 441 x 21 = 9261. TSA = 6 x 21^2 = 6 x 441 = 2646 cm^2."],
       ["Three metal cubes with edges 3 cm, 4 cm and 5 cm are melted into one cube. Find its edge.", "Volume = 27 + 64 + 125 = 216 cm^3. Edge = cbrt(216) = 6 cm."],
       ["Find the smallest numbers by which 3087 can be divided, or multiplied, to give a perfect cube, and the cube roots in each case.", "3087 = 3^2 x 7^3. Divide by 9: 343, root 7. Multiply by 3: 9261 = 3^3 x 7^3, root 21."],
       ["Using the sum-of-cubes formula, find 1^3 + 2^3 + ... + 12^3, and then 6^3 + 7^3 + ... + 12^3.", "Sum to 12 = (12 x 13/2)^2 = 78^2 = 6084. Sum to 5 = 15^2 = 225. So 6^3 + ... + 12^3 = 6084 - 225 = 5859."],
       ["Use a + b + c = 0 to evaluate (-12)^3 + 7^3 + 5^3, and verify by direct computation.", "-12 + 7 + 5 = 0, so the sum = 3abc = 3(-12)(7)(5) = -1260. Direct: -1728 + 343 + 125 = -1260."] ])
),

/* ===== Chapter 6: Comparing Quantities ===== */
C({ CBSE: "Comparing Quantities", ICSE: "Percentage, Profit and Loss, Discount and Compound Interest", IB: "Percentages, Financial Mathematics and Compound Growth" },
  [ S("1. Percentages, Increase and Decrease",
      "<b>Percent</b> means per hundred: x% of N = (x/100) x N. Percentage change = (change / original value) x 100, always measured against the <b>original</b>. A fraction p/q converts to (p/q) x 100 percent. A quantity increased by r% becomes N(1 + r/100); decreased by r% it becomes N(1 - r/100).",
      "<b>Solved example:</b> A book's price rises from Rs 250 to Rs 300. Increase = 50. Percentage increase = 50/250 x 100 = <b>20%</b>. If it then falls by 20%, the price is 300 x 0.8 = <b>Rs 240</b>, not Rs 250."),
    S("2. Profit, Loss, Discount and Tax",
      "<b>Profit</b> = SP - CP and <b>Loss</b> = CP - SP; profit% and loss% are always on the <b>cost price</b>. <b>Discount</b> = MP - SP, and discount% is on the <b>marked price</b>, so SP = MP(1 - d/100). Sales tax or GST is added on the price after discount: bill = price x (1 + tax/100). Successive discounts of a% and b% are not a + b but multiply: (1 - a/100)(1 - b/100).",
      "<b>Solved example:</b> Marked price Rs 1200 with 15% discount: discount = 180, SP = <b>Rs 1020</b>. If CP = Rs 850, profit = 170 and profit% = 170/850 x 100 = <b>20%</b>."),
    S("3. Simple and Compound Interest",
      "<b>Simple interest</b> SI = PRT/100 is calculated on the original principal only. <b>Compound interest</b> is calculated on the principal plus interest already earned: A = P(1 + R/100)^n and CI = A - P. For <b>half-yearly</b> compounding use rate R/2 and 2n periods; for quarterly use R/4 and 4n. When the rate changes each year, multiply the separate factors.",
      "<b>Solved example:</b> Rs 10000 at 10% p.a. for 2 years: A = 10000 x 1.1 x 1.1 = 12100, so CI = <b>Rs 2100</b> (SI would be Rs 2000). Half-yearly on Rs 8000 at 10% for 1 year: A = 8000 x 1.05^2 = 8000 x 1.1025 = 8820, CI = <b>Rs 820</b>.") ],
  [ ["Up then down", "A rise of x% followed by a fall of x% is a net loss of x^2/100 percent: +20% then -20% is -4%."],
    ["Rule of 72", "Money at r% compound interest doubles in about 72/r years: at 8% in about 9 years, since 1.08^9 = 1.999."],
    ["CI minus SI", "For 2 years, CI - SI = P(r/100)^2, so on Rs 5000 at 10% the difference is 5000 x 0.01 = Rs 50."],
    ["Asymmetry", "If A is p% more than B, then B is 100p/(100 + p)% less than A: 25% more corresponds to 20% less."],
    ["Towards e", "One unit at 100% p.a. grows to (1 + 1/n)^n: 2 yearly, 2.25 half-yearly, and approaches e = 2.718... as compounding becomes continuous."] ],
  [ Qz("35% of 240 is:", ["84", "72", "96", "80"], 0, "0.35 x 240 = 84."),
    Qz("A price rises from Rs 80 to Rs 100. The percentage increase is:", ["20%", "25%", "30%", "125%"], 1, "20/80 x 100 = 25%."),
    Qz("The selling price of an article marked Rs 600 after a 20% discount is:", ["520", "120", "480", "500"], 2, "600 - 120 = 480."),
    Qz("Compound interest on Rs 5000 for 2 years at 10% p.a. is:", ["1000", "1010", "1100", "1050"], 3, "5000 x 1.21 = 6050, so CI = 1050."),
    Qz("Two successive discounts of 10% and 10% equal a single discount of:", ["20%", "10%", "19%", "21%"], 2, "0.9 x 0.9 = 0.81, so the discount is 19%.") ],
  PP([ ["Find 15% of 360.", "0.15 x 360 = 54."],
       ["Express 3/8 as a percentage.", "3/8 x 100 = 37.5%."],
       ["A cap marked Rs 500 is sold at 10% discount. Find the discount and selling price.", "Discount = 50, SP = 500 - 50 = Rs 450."],
       ["An article bought for Rs 400 is sold for Rs 460. Find the profit percent.", "Profit = 60; 60/400 x 100 = 15%."],
       ["Find the simple interest on Rs 2000 at 5% p.a. for 3 years.", "SI = 2000 x 5 x 3/100 = Rs 300."] ],
     [ ["After a 20% discount a shirt costs Rs 640. Find its marked price.", "SP = 0.8 x MP = 640, so MP = 640/0.8 = Rs 800."],
       ["The population of a town of 20000 grows 5% every year. Find it after 2 years.", "20000 x 1.05 x 1.05 = 20000 x 1.1025 = 22050."],
       ["Find the compound interest on Rs 6250 at 8% p.a. for 2 years.", "A = 6250 x 1.08^2 = 6250 x 1.1664 = 7290. CI = 7290 - 6250 = Rs 1040."],
       ["A man sells an article at a loss of 12% for Rs 4400. Find the cost price.", "SP = 0.88 x CP = 4400, so CP = 4400/0.88 = Rs 5000."],
       ["In a class of 40, 55% are girls. Find the number of girls, boys and the ratio girls : boys.", "Girls = 0.55 x 40 = 22, boys = 18. Ratio 22 : 18 = 11 : 9."] ],
     [ ["A shopkeeper marks goods 40% above cost price and allows a discount of 25%. Find his gain percent. Verify with CP = Rs 800.", "SP = 1.4 x 0.75 x CP = 1.05 CP, so profit is 5%. With CP 800: MP = 1120, discount 280, SP = 840, profit 40 = 5% of 800."],
       ["Find the compound interest on Rs 16000 at 20% p.a. for 1 1/2 years, compounded half-yearly.", "Rate 10% per half-year, 3 periods. A = 16000 x 1.1^3 = 16000 x 1.331 = 21296. CI = 21296 - 16000 = Rs 5296."],
       ["Find the difference between CI and SI on Rs 8000 for 2 years at 5% p.a.", "SI = 8000 x 5 x 2/100 = 800. A = 8000 x 1.1025 = 8820, CI = 820. Difference = Rs 20 (= 8000 x 0.05^2)."],
       ["A sum becomes Rs 7260 in 2 years and Rs 7986 in 3 years at compound interest compounded yearly. Find the rate and the principal.", "Third-year interest = 7986 - 7260 = 726, which is the rate on 7260: 726/7260 = 10%. Principal = 7260/1.21 = Rs 6000. Check: 6000 x 1.331 = 7986."],
       ["The price of sugar rises by 25%. By what percent must a family cut consumption to keep expenditure the same? Verify with Rs 40/kg and 10 kg.", "Old spend = 400. New price Rs 50/kg, so new quantity = 400/50 = 8 kg. Reduction = 2/10 x 100 = 20%."] ])
),

/* ===== Chapter 7: Algebraic Expressions and Identities ===== */
C({ CBSE: "Algebraic Expressions and Identities", ICSE: "Algebraic Expressions and Identities", IB: "Expanding Polynomials and Algebraic Identities" },
  [ S("1. Terms, Polynomials and Multiplication",
      "An <b>algebraic expression</b> is made of terms joined by + or -; a <b>monomial</b> has one term, a <b>binomial</b> two, a <b>trinomial</b> three, and in general a <b>polynomial</b>. Like terms have the same variables with the same powers and can be added or subtracted. To multiply, use the distributive law and the rule x^a x x^b = x^(a+b), multiplying every term of one factor by every term of the other, then collect like terms.",
      "<b>Solved example:</b> Multiply (3x - 2)(x^2 + 4x - 5). 3x(x^2 + 4x - 5) = 3x^3 + 12x^2 - 15x. -2(x^2 + 4x - 5) = -2x^2 - 8x + 10. Add: <b>3x^3 + 10x^2 - 23x + 10</b>."),
    S("2. Standard Identities",
      "Four identities hold for all values of the variables: <b>(a + b)^2 = a^2 + 2ab + b^2</b>; <b>(a - b)^2 = a^2 - 2ab + b^2</b>; <b>(a + b)(a - b) = a^2 - b^2</b>; <b>(x + a)(x + b) = x^2 + (a + b)x + ab</b>. They give fast mental arithmetic by writing a number as a round number plus or minus a small one.",
      "<b>Solved example:</b> 102^2 = (100 + 2)^2 = 10000 + 400 + 4 = <b>10404</b>. And 98 x 102 = (100 - 2)(100 + 2) = 10000 - 4 = <b>9996</b>."),
    S("3. Applications and Derived Results",
      "From the identities: (a + b)^2 - (a - b)^2 = <b>4ab</b> and (a + b)^2 + (a - b)^2 = <b>2(a^2 + b^2)</b>. For x + 1/x = k we get x^2 + 1/x^2 = k^2 - 2, and squaring again x^4 + 1/x^4 = (x^2 + 1/x^2)^2 - 2. These let you find squares and products of expressions without finding the variable itself.",
      "<b>Solved example:</b> If x + 1/x = 5, then x^2 + 1/x^2 = 25 - 2 = <b>23</b>, and x^4 + 1/x^4 = 23^2 - 2 = 529 - 2 = <b>527</b>.") ],
  [ ["Sophie Germain", "a^4 + 4b^4 = (a^2 + 2b^2 + 2ab)(a^2 + 2b^2 - 2ab), so n^4 + 4 is composite for n > 1: for n = 2, 20 = 10 x 2."],
    ["Three variables", "(a + b + c)^2 = a^2 + b^2 + c^2 + 2(ab + bc + ca)."],
    ["Non-negative form", "a^2 + b^2 + c^2 - ab - bc - ca = (1/2)[(a-b)^2 + (b-c)^2 + (c-a)^2], which is zero only when a = b = c."],
    ["Mental squares", "a^2 = (a + d)(a - d) + d^2: 47^2 = 50 x 44 + 9 = 2209."],
    ["Difference of squares", "Every odd number and every multiple of 4 is a difference of two squares, but no number of the form 4k + 2 is."] ],
  [ Qz("(x + 5)(x - 5) equals:", ["x^2 + 25", "x^2 - 25", "x^2 - 10x + 25", "x^2 + 10x - 25"], 1, "a^2 - b^2 with a = x, b = 5."),
    Qz("The value of 103^2 is:", ["10509", "10069", "10609", "10906"], 2, "(100 + 3)^2 = 10000 + 600 + 9 = 10609."),
    Qz("(a + b)^2 - (a - b)^2 equals:", ["2ab", "2a^2 + 2b^2", "a^2 - b^2", "4ab"], 3, "The a^2 and b^2 terms cancel, leaving 4ab."),
    Qz("The coefficient of x in (x + 3)(x + 4) is:", ["7", "12", "1", "-7"], 0, "(x + 3)(x + 4) = x^2 + 7x + 12."),
    Qz("If x + 1/x = 3 then x^2 + 1/x^2 is:", ["9", "11", "5", "7"], 3, "9 - 2 = 7.") ],
  PP([ ["Add 3x^2 + 2x - 1 and x^2 - 5x + 4.", "4x^2 - 3x + 3."],
       ["Multiply 3x by (2x - 5).", "6x^2 - 15x."],
       ["Expand (x + 7)^2.", "x^2 + 14x + 49."],
       ["Use an identity to find 99 x 101.", "(100 - 1)(100 + 1) = 10000 - 1 = 9999."],
       ["Expand (2a - 3b)^2.", "4a^2 - 12ab + 9b^2."] ],
     [ ["Expand (x + 3)(x + 8).", "x^2 + (3 + 8)x + 24 = x^2 + 11x + 24."],
       ["Subtract 2a^2 - 3ab + b^2 from 5a^2 + ab - 4b^2.", "(5 - 2)a^2 + (1 + 3)ab + (-4 - 1)b^2 = 3a^2 + 4ab - 5b^2."],
       ["Evaluate 104^2 - 96^2 using an identity.", "(104 + 96)(104 - 96) = 200 x 8 = 1600."],
       ["Multiply (2x - 3)(x^2 + x - 2).", "2x^3 + 2x^2 - 4x - 3x^2 - 3x + 6 = 2x^3 - x^2 - 7x + 6."],
       ["If a + b = 10 and ab = 21, find a^2 + b^2.", "a^2 + b^2 = (a + b)^2 - 2ab = 100 - 42 = 58."] ],
     [ ["If x + 1/x = 6, find x^2 + 1/x^2 and x^4 + 1/x^4.", "x^2 + 1/x^2 = 36 - 2 = 34. x^4 + 1/x^4 = 34^2 - 2 = 1156 - 2 = 1154."],
       ["Simplify (3x + 2y)^2 - (3x - 2y)^2 and evaluate for x = 2, y = 1/2.", "Using 4AB with A = 3x, B = 2y: 4(3x)(2y) = 24xy. For x = 2, y = 1/2: 24 x 2 x 1/2 = 24."],
       ["If a - b = 4 and ab = 12, find a^2 + b^2, a + b (both signs) and a^2 - b^2.", "a^2 + b^2 = 16 + 24 = 40. (a + b)^2 = 16 + 48 = 64, so a + b = 8 or -8. a^2 - b^2 = (a - b)(a + b) = 32 or -32. Check a = 6, b = 2."],
       ["If a + b + c = 9 and a^2 + b^2 + c^2 = 29, find ab + bc + ca.", "81 = 29 + 2(ab + bc + ca), so ab + bc + ca = 52/2 = 26."],
       ["Using identities, evaluate 103 x 107 and 997^2.", "103 x 107 = (100 + 3)(100 + 7) = 10000 + 1000 + 21 = 11021. 997^2 = (1000 - 3)^2 = 1000000 - 6000 + 9 = 994009."] ])
),

/* ===== Chapter 8: Mensuration ===== */
C({ CBSE: "Mensuration", ICSE: "Mensuration: Area, Surface Area and Volume", IB: "Measurement: Area, Surface Area and Volume of Solids" },
  [ S("1. Area of a Trapezium and Polygons",
      "The area of a <b>trapezium</b> with parallel sides a and b and height h is <b>(1/2)(a + b) x h</b>. A general quadrilateral with diagonal d and perpendiculars h1, h2 from the opposite vertices has area (1/2) x d x (h1 + h2). A rhombus has area (1/2) x d1 x d2. Complex polygons are split into triangles and trapeziums and their areas added.",
      "<b>Solved example:</b> A trapezium has parallel sides 12 cm and 20 cm and height 9 cm. Area = (1/2)(12 + 20)(9) = (1/2)(32)(9) = <b>144 cm^2</b>."),
    S("2. Surface Area and Volume of Cube and Cuboid",
      "For a cuboid l x b x h: <b>TSA = 2(lb + bh + hl)</b>, <b>LSA = 2h(l + b)</b>, <b>Volume = lbh</b>, space diagonal = sqrt(l^2 + b^2 + h^2). For a cube of edge a: TSA = 6a^2, LSA = 4a^2, volume = a^3. Surface area is in square units and volume in cubic units; 1 m^3 = 1000 litres.",
      "<b>Solved example:</b> A cuboid is 12 cm x 8 cm x 5 cm. lb = 96, bh = 40, hl = 60, so TSA = 2(96 + 40 + 60) = 2(196) = <b>392 cm^2</b>. Volume = 12 x 8 x 5 = <b>480 cm^3</b>."),
    S("3. Surface Area and Volume of a Cylinder",
      "A cylinder with radius r and height h has <b>curved surface area CSA = 2 pi r h</b>, <b>total surface area TSA = 2 pi r(r + h)</b> and <b>volume V = pi r^2 h</b>. Rolling a rectangle about one side gives the curved surface, with the other side as circumference. Use pi = 22/7 when r is a multiple of 7. Capacity in cm^3 converts as 1000 cm^3 = 1 litre.",

               S("2. Soil Preparation, Sowing and Nutrients", "Soil is loosened by <b>ploughing</b> (plough, hoe, cultivator) so roots breathe and microbes thrive. A <b>seed drill</b> sows uniformly at the right depth. <b>Manure</b> is organic and improves humus; <b>fertilisers</b> (urea, NPK) are inorganic and quick-acting. <b>Crop rotation</b> with legumes restores nitrogen.", "<b>Solved example:</b> Why seed drill over broadcasting? It gives uniform depth and spacing, saves seeds and protects them from birds."),

              [["Green Revolution","Norman Borlaug's high-yield wheat and M. S. Swaminathan's work in India raised foodgrain output sharply from the 1960s."],["Drip irrigation","Delivers water to the root zone and can save 30-70 percent of water compared with flood irrigation."],["Nitrogen fertiliser","Industrial ammonia (Haber process, N2 + 3H2 -> 2NH3) underpins urea; NPK stands for nitrogen, phosphorus, potassium."],["Eutrophication","Fertiliser runoff enriches ponds with nutrients, causing algal blooms and oxygen depletion that kills fish."],["Aflatoxin","Damp stored grains and groundnuts can host the fungus Aspergillus, producing toxic, cancer-causing aflatoxin."]],
              [Qz("Which of these is a Kharif crop?", ["Wheat","Paddy","Gram","Mustard"], 1, "Paddy is sown with monsoon."),
               Qz("Which implement sows seeds uniformly?", ["Hoe","Seed drill","Sickle","Plough"], 1, "Seed drill controls depth and spacing."),
               Qz("Growing legumes enriches soil with:", ["Phosphorus","Nitrogen","Potassium","Iron"], 1, "Rhizobium fixes nitrogen."),
               Qz("Separating grain from chaff using wind is:", ["Threshing","Winnowing","Harvesting","Sowing"], 1, "Wind blows away lighter chaff."),
               Qz("Best irrigation method in water-scarce areas:", ["Canal flooding","Drip system","Rahat","Dhekli"], 1, "Drip delivers water drop by drop.")],
              PP([["Define a crop.","Plants of the same kind grown on a large scale in a place."],["Name two Rabi crops.","Wheat and gram (also pea, mustard)."],["What is irrigation?","Supply of water to crops at regular intervals."],["Name two harvesting tools.","Sickle and combine harvester."],["Why are neem leaves kept with stored grains?","They protect grain from insects and pests."]],
                 [["Differentiate manure and fertiliser (two points).","Manure: organic, from decomposed waste, improves humus. Fertiliser: inorganic, factory-made, nutrient-rich, quick-acting."],["Explain crop rotation and its benefits.","Growing different crops in sequence on the same field; restores nutrients (legumes add nitrogen), breaks pest cycles."],["Why is soil loosened before sowing?","Roots penetrate and breathe easily; earthworms and microbes thrive; nutrients are brought up."],["Describe sprinkler and drip systems with one advantage each.","Sprinkler sprays water like rain (suits uneven land, lawns); drip supplies water at roots drop by drop (saves water)."],["What are weeds? State two control methods.","Unwanted plants growing with a crop; control by manual weeding and weedicides such as 2,4-D."]],
                 [["Sequence agricultural practices from soil preparation to storage and explain any three.","Preparation, sowing, manure/fertiliser, irrigation, weeding, harvesting, storage; with correct explanations of any three."],["Discuss the problems of excess nitrogen fertiliser and give alternatives.","Eutrophication, groundwater nitrate and soil damage; use manure, compost, crop rotation with legumes, and bio-fertilisers."],["Why is a seed drill better than broadcasting?","Uniform depth and spacing, fewer seeds wasted, protection from birds, saves time and labour."],["Why must grain be dried before storage? State two protective measures.","Moisture allows fungi/pests to grow; dry in sun, use neem leaves, fumigation or airtight silos."],["Compare traditional and modern irrigation methods.","Traditional (moat, rahat, dhekli) use human/animal energy and waste water; modern (sprinkler, drip) are efficient and save water but cost more to install."]])),
        ...CL_PARTS["8|Science"]
      ],
      Maths: [
        C({"CBSE":"Rational Numbers","ICSE":"Rational Numbers","IB":"Rational Numbers and Density"},
              [S("1. Definition, Standard Form, Equivalence", "A <b>rational number</b> is p/q with integers p, q and q not 0. Standard form: q positive and p, q coprime. Equivalent fractions are formed by multiplying/dividing numerator and denominator by the same non-zero integer. 0 is rational.", "<b>Solved example:</b> -12/18 divided top and bottom by 6 gives <b>-2/3</b>; 5/-7 = <b>-5/7</b>."),
               S("2. Operations and Properties", "Rationals are <b>closed</b> under +, -, x and division (non-zero divisor). Additive identity <b>0</b>; multiplicative identity <b>1</b>. <b>Additive inverse</b> of a/b is -a/b. <b>Multiplicative inverse</b> (reciprocal) of a/b is b/a for a not 0; 0 has no reciprocal. Distributive: a(b+c) = ab+ac.", "<b>Solved example:</b> (-3/4) + (5/6) = (-9+10)/12 = <b>1/12</b>. (-5/6) / (10/9) = (-5/6)(9/10) = <b>-3/4</b>."),
               S("3. Rationals on the Number Line and Between Two Rationals", "Between any two rationals there are <b>infinitely many</b> rationals (density). Method: make denominators equal and scale up, or take the mean (a+b)/2. Compare using cross multiplication or common denominators.", "<b>Solved example:</b> Three rationals between 1/3 and 1/2: 1/3 = 10/30, 1/2 = 15/30, so <b>11/30, 12/30, 13/30</b>.")],
              [["Density","Between any two rationals lie infinitely many more; the rationals are dense but still countable."],["Terminating decimals","In lowest terms, p/q terminates iff q has only prime factors 2 and 5."],["Zero","0 is rational (0/1) but has no multiplicative inverse."],["Self-reciprocals","Only 1 and -1 equal their own reciprocals."],["Recurring decimals","0.999... = 1; 0.2727... = x gives 100x - x = 27, so x = 27/99 = 3/11. Every recurring decimal is rational."]],
              [Qz("Standard form of -12/18 is:", ["-2/3","2/3","-3/2","-12/18"], 0, "Divide by HCF 6."),
               Qz("Additive inverse of 5/-7 is:", ["5/7","-5/7","7/5","-7/5"], 0, "5/-7 = -5/7, inverse is 5/7."),
               Qz("Multiplicative inverse of -3/4 is:", ["4/3","-4/3","3/4","-3/4"], 1, "Flip: -4/3."),
               Qz("Which rational has no multiplicative inverse?", ["1","-1","0","1/2"], 2, "Division by zero is undefined."),
               Qz("A rational between 1/2 and 3/4 is:", ["1/4","5/8","1","7/8"], 1, "5/8 = 0.625.")],
              PP([["Express -15/25 in standard form.","-3/5."],["Add 2/3 + 4/5.","10/15 + 12/15 = 22/15."],["Write the multiplicative inverse of -7/9.","-9/7."],["Write the additive identity for rational numbers.","0."],["Compare -3/4 and -2/3.","-9/12 < -8/12, so -3/4 < -2/3."]],
                 [["Simplify (-3/4) + (5/6).","(-9 + 10)/12 = 1/12."],["Find three rational numbers between 1/3 and 1/2.","11/30, 12/30 (=2/5), 13/30."],["Verify a(b+c) = ab+ac for a=1/2, b=1/3, c=-1/4.","b+c = 1/12; LHS = 1/24; RHS = 1/6 - 1/8 = 1/24. Equal."],["Divide (-5/6) by (10/9).","(-5/6)(9/10) = -45/60 = -3/4."],["Which is greater: 5/-8 or -7/12?","-15/24 vs -14/24: -7/12 is greater."]],
                 [["Simplify (2/3 - 3/4) / (5/6 + 1/12).","Numerator = -1/12; denominator = 11/12; answer = -1/11."],["The sum of two rationals is -5/6; one is 3/4. Find the other.","-5/6 - 3/4 = -10/12 - 9/12 = -19/12."],["Find three rational numbers between 3/5 and 2/3.","18/30 and 20/30 -> 72/120 and 80/120: 73/120, 75/120 (=5/8), 77/120."],["A rope 15/2 m long is cut into pieces of 3/4 m each. How many pieces?","(15/2) / (3/4) = 10 pieces."],["Express 0.2727... as p/q in lowest terms.","x = 0.2727..; 100x = 27.27..; 99x = 27; x = 27/99 = 3/11."]])),
        ...CL_PARTS["8|Maths"]
      ]
    }
  }
};


/* ---------- UI engine ---------- */
const I = {
  book:'<svg class="ic" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>',
  zap:'<svg class="ic" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>',
  file:'<svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/></svg>',
  sun:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  left:'<svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  right:'<svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
  print:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
  eye:'<svg class="ic" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  redo:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  x:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>'
};
const TABS = [["learn", "Learning Material", I.book], ["bites", "Chaos Bites", I.zap], ["quiz", "Interactive Quiz", I.check], ["tests", "Model Test Papers", I.file]];
const $ = id => document.getElementById(id);
const BOARDS = Object.keys(CL.boards), GRADES = Object.keys(CL.curriculum).map(Number);
const st = { b: "CBSE", g: 6, s: "Science", c: 0, tab: "learn", p: 0 };

/* Persistence is a per-device convenience: every access is guarded. */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let answers = store.get("cl.answers", {});

const chapters = () => CL.curriculum[st.g][st.s];
const chapter = () => chapters()[st.c];
const qkey = (c = st.c) => [st.g, st.s, c].join("|");
const subjects = () => Object.keys(CL.curriculum[st.g]);

/* Live quiz scoring: compares each recorded choice with the stored correct index. */
function scoreQuiz(ch = chapter(), key = qkey()) {
  const ans = answers[key] || [];
  let score = 0, answered = 0;
  ch.quiz.forEach((q, i) => { if (ans[i] !== undefined && ans[i] !== null) { answered++; if (ans[i] === q.a) score++; } });
  return { score, answered, total: ch.quiz.length };
}

function seg(list, cur, act) {
  return list.map(v => '<button data-act="' + act + '" data-v="' + v + '" aria-pressed="' + (String(v) === String(cur)) + '">' + (act === "g" ? "Class " + v : v) + "</button>").join("");
}

function renderNav() {
  $("segB").innerHTML = seg(BOARDS, st.b, "b");
  $("segG").innerHTML = seg(GRADES, st.g, "g");
  $("segS").innerHTML = seg(subjects(), st.s, "s");
  document.documentElement.setAttribute("data-subject", st.s);
  const list = chapters();
  const done = list.filter((c, i) => { const r = scoreQuiz(c, qkey(i)); return r.answered === r.total; }).length;
  $("prog").innerHTML = '<span><b>' + done + "</b> of " + list.length + ' quizzes done</span><span class="track"><i style="width:' + (100 * done / list.length) + '%"></i></span>';
  $("list").innerHTML = list.map((c, i) => {
    const r = scoreQuiz(c, qkey(i));
    const badge = r.answered === r.total ? '<span class="s">' + I.check + r.score + "/" + r.total + "</span>" : "<span></span>";
    return '<button class="chap" data-act="c" data-v="' + i + '" aria-current="' + (i === st.c) + '"><span class="n">' + String(i + 1).padStart(2, "0") + '</span><span class="t">' + c.t[st.b] + "</span>" + badge + "</button>";
  }).join("");
}

function renderHead() {
  const ch = chapter(), b = CL.boards[st.b];
  $("head").innerHTML = '<div class="num" aria-hidden="true">' + String(st.c + 1).padStart(2, "0") + "</div>" +
    '<div><h1>' + ch.t[st.b] + '</h1><div class="facts"><span class="fact">' + st.b + " Class " + st.g + " " + st.s + '</span><span class="fact">' + ch.secs.length + ' sections</span><span class="fact">' + ch.bites.length + ' Chaos Bites</span><span class="fact">' + ch.quiz.length + ' quiz questions</span><span class="fact">' + ch.papers.length + " model papers</span></div></div>" +
    '<p class="sub"><b>' + b.full + ".</b> " + b.lens + "</p>";
  $("tabs").innerHTML = TABS.map(t => '<button class="tab" role="tab" data-act="tab" data-v="' + t[0] + '" aria-selected="' + (st.tab === t[0]) + '">' + t[2] + t[1] + "</button>").join("");
  document.title = ch.t[st.b] + " | Class " + st.g + " " + st.s + " | Chaos Learning";
}

function viewLearn(ch) {
  return '<div class="read">' + ch.secs.map((s, i) =>
    '<section class="sec"><div class="k">' + String(i + 1).padStart(2, "0") + "</div><div><h2>" + s.t.replace(/^\d+\.\s*/, "") + '</h2><div class="body">' + s.x + "</div>" +
    '<div class="eg"><h3>Solved example</h3><div>' + s.e.replace(/^<b>Solved example:<\/b>\s*/i, "") + "</div></div></div></section>").join("") + "</div>";
}

function viewBites(ch) {
  return '<p class="note">Advanced facts that regularly separate Olympiad and scholarship-exam answers (NSEJS, IJSO, IMO, RMO) from textbook ones.</p><div class="bites">' +
    ch.bites.map(b => '<article class="bite"><h3>' + I.zap + "<span>" + b[0] + "</span></h3><p>" + b[1] + "</p></article>").join("") + "</div>";
}

function viewQuiz(ch) {
  const key = qkey(), ans = answers[key] || [], r = scoreQuiz();
  let h = '<div class="qwrap"><div class="qhead"><div class="score">' + r.score + " / " + r.total + "<small>" + r.answered + ' answered</small></div><div class="bar2"><i style="width:' + (100 * r.answered / r.total) + '%"></i></div><button class="btn" data-act="reset">' + I.redo + "Reset</button></div>";
  ch.quiz.forEach((q, i) => {
    const done = ans[i] !== undefined && ans[i] !== null;
    h += '<div class="q"><div class="qt"><span>' + (i + 1) + ".</span><div>" + q.q + "</div></div>";
    q.c.forEach((c, j) => {
      let cls = "opt", mark = "";
      if (done && j === q.a) { cls += " ok"; mark = I.check; } else if (done && j === ans[i]) { cls += " bad"; mark = I.x; }
      h += '<button class="' + cls + '" ' + (done ? "disabled" : "") + ' data-act="pick" data-q="' + i + '" data-v="' + j + '"><span class="l">' + String.fromCharCode(65 + j) + "</span><span>" + c + "</span>" + (mark || "<span></span>") + "</button>";
    });
    if (done) h += '<p class="why"><b>' + (ans[i] === q.a ? "Correct." : "Not quite.") + "</b> " + q.e + "</p>";
    h += "</div>";
  });
  if (r.answered === r.total) {
    const pct = Math.round(100 * r.score / r.total);
    const msg = pct === 100 ? "Perfect score. Try the Hard paper next." : pct >= 60 ? "Solid. Read the Chaos Bites for this chapter, then try the Medium paper." : "Re-read the learning material, then retake the quiz.";
    h += '<div class="result"><div class="pct">' + pct + "%</div><p>" + msg + '</p><div class="acts"><button class="btn" data-act="reset">' + I.redo + 'Retake quiz</button><button class="btn pri" data-act="tab" data-v="tests">Open model papers</button></div></div>';
  }
  return h + "</div>";
}

function viewTests(ch) {
  const p = ch.papers[st.p];
  let h = '<div class="pwrap" id="pw"><div class="ptop"><div class="seg p" role="group" aria-label="Paper difficulty">' +
    ch.papers.map((x, i) => '<button data-act="p" data-v="' + i + '" aria-pressed="' + (i === st.p) + '">' + x.n + "<small>" + x.lvl + " &middot; " + x.total + " marks</small></button>").join("") +
    '</div><div style="display:flex;gap:8px"><button class="btn" data-act="all">' + I.eye + 'Show all answers</button><button class="btn" data-act="print">' + I.print + "Print</button></div></div>";
  h += '<div class="sheet"><div class="hd"><h2>' + ch.t[st.b] + ": " + p.n + " (" + p.lvl + ')</h2><div class="stats"><div>Time allowed<strong>' + p.time + "</strong></div><div>Questions<strong>" + p.qs.length + "</strong></div><div>Total marks<strong>" + p.total + '</strong></div></div><div class="scheme"><b>Marking scheme.</b> ' + p.scheme + "</div></div>";
  p.qs.forEach((q, i) => {
    h += '<div class="pq"><div class="row"><span class="no">Q' + (i + 1) + '</span><div class="qq">' + q.q + '</div><span class="m">' + q.m + ' marks</span></div><div class="tg"><button data-act="ans">' + I.eye + 'Model answer</button></div><div class="ans"><b>Answer.</b> ' + q.a + "</div></div>";
  });
  return h + "</div></div>";
}

function renderPanel() {
  const ch = chapter();
  const nav = '<div class="pnav" style="display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap">' +
    (st.c > 0 ? '<button class="btn" data-act="c" data-v="' + (st.c - 1) + '">' + I.left + "Chapter " + st.c + "</button>" : "<span></span>") +
    (st.c < chapters().length - 1 ? '<button class="btn pri" data-act="c" data-v="' + (st.c + 1) + '">Chapter ' + (st.c + 2) + I.right + "</button>" : "<span></span>") + "</div>";
  $("panel").innerHTML = { learn: viewLearn, bites: viewBites, quiz: viewQuiz, tests: viewTests }[st.tab](ch) + nav;
}

function render(scroll) {
  renderNav(); renderHead(); renderPanel();
  $("theme").innerHTML = document.documentElement.getAttribute("data-theme") === "dark" ? I.sun : I.moon;
  try { history.replaceState(null, "", "#/" + [st.b, st.g, st.s, st.c + 1, st.tab].join("/")); } catch (e) {}
  const cur = document.querySelector('.chap[aria-current="true"]');
  if (cur && cur.scrollIntoView && window.innerWidth < 960) cur.scrollIntoView({ inline: "center", block: "nearest" });
  if (scroll) { const y = $("head").getBoundingClientRect().top + window.scrollY - (window.innerWidth >= 960 ? 164 : 12); window.scrollTo({ top: Math.max(0, y), behavior: "smooth" }); }
}

/* Single delegated click handler for every control */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const v = t.dataset.v, a = t.dataset.act;
  if (a === "b") { st.b = v; render(); }
  else if (a === "g") { st.g = +v; if (!subjects().includes(st.s)) st.s = subjects()[0]; st.c = 0; st.p = 0; render(); }
  else if (a === "s") { st.s = v; st.c = 0; st.p = 0; render(); }
  else if (a === "c") { st.c = +v; st.p = 0; render(true); }
  else if (a === "tab") { st.tab = v; render(true); }
  else if (a === "p") { st.p = +v; render(); }
  else if (a === "pick") { const k = qkey(); answers[k] = answers[k] || []; const i = +t.dataset.q; if (answers[k][i] == null) { answers[k][i] = +v; store.set("cl.answers", answers); render(); } }
  else if (a === "reset") { delete answers[qkey()]; store.set("cl.answers", answers); render(); }
  else if (a === "ans") { t.closest(".pq").classList.toggle("open"); }
  else if (a === "all") { const on = $("pw").classList.toggle("all"); t.lastChild.textContent = on ? "Hide all answers" : "Show all answers"; }
  else if (a === "print") { window.print(); }
  else if (a === "theme") {
    const n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n); store.set("cl.theme", n); $("theme").innerHTML = n === "dark" ? I.sun : I.moon;
  }
});

/* Restore position from the URL hash, e.g. #/ICSE/7/Maths/3/quiz */
(function init() {
  const m = location.hash.replace(/^#\/?/, "").split("/");
  if (BOARDS.includes(m[0])) st.b = m[0];
  if (GRADES.includes(+m[1])) st.g = +m[1];
  if (subjects().includes(m[2])) st.s = m[2];
  const c = +m[3] - 1; if (c >= 0 && c < chapters().length) st.c = c;
  if (TABS.some(t => t[0] === m[4])) st.tab = m[4];
  render();
})();
</script>
