       ["You must build the strongest electromagnet in the lab for lifting iron nails. List four design decisions with reasons, and explain how to show the effect of the number of turns.", "Use a soft iron core (magnetises strongly and demagnetises easily); more turns of insulated wire (more field); larger current from more cells (stronger field, but heating is limited); wind the coil closely. To test turns, use the same current and core with 10, 20 and 30 turns and count how many pins each lifts; more turns lift more."] ])

C({CBSE:"Fractions and Decimals",ICSE:"Fractions and Decimals: Operations",IB:"Rational Numbers in Fraction and Decimal Form"},
[S("1. Multiplying Fractions",
"To multiply fractions, multiply numerators together and denominators together: (a/b) x (c/d) = (ac)/(bd). Convert mixed numbers to improper fractions first, and cancel common factors before multiplying to keep numbers small. The word <b>of</b> means multiplication, so 2/3 of 15 = 2/3 x 15 = 10. A product of two proper fractions is smaller than either fraction.",
"<b>Solved example:</b> Find 3 3/4 x 2 2/5.<br>3 3/4 = 15/4 and 2 2/5 = 12/5.<br>(15/4) x (12/5) = (15 x 12)/(4 x 5) = 180/20 = 9."),
S("2. Dividing Fractions",
"The <b>reciprocal</b> of a/b is b/a, and the product of a number and its reciprocal is 1. To divide by a fraction, multiply by its reciprocal: (a/b) / (c/d) = (a/b) x (d/c). Zero has no reciprocal, so division by zero is not defined. Dividing by a proper fraction makes the result larger than the dividend.",
"<b>Solved example:</b> Evaluate 5/6 / (10/9).<br>Reciprocal of 10/9 is 9/10.<br>5/6 x 9/10 = 45/60 = 3/4."),
S("3. Multiplying and Dividing Decimals",
"To multiply decimals, ignore the decimal points, multiply as whole numbers, then place the point so the product has as many decimal places as both factors together. To divide by a decimal, multiply dividend and divisor by the same power of 10 so the divisor becomes a whole number. Multiplying by 10, 100, 1000 shifts the point right; dividing shifts it left. Always estimate first to check the position of the point.",
"<b>Solved example:</b> (a) 2.4 x 0.35 (b) 7.28 / 0.04.<br>(a) 24 x 35 = 840; 1 + 2 = 3 decimal places, so 0.840 = 0.84.<br>(b) Multiply both by 100: 728 / 4 = 182.")],
[["Telescoping sums","1/(n(n+1)) = 1/n - 1/(n+1), so 1/(1x2) + 1/(2x3) + ... + 1/(9x10) collapses to 1 - 1/10 = 9/10."],
["Terminating or not","A fraction in lowest terms has a terminating decimal exactly when its denominator has no prime factors other than 2 and 5; so 7/40 terminates but 7/30 does not."],
["0.999... equals 1","Let x = 0.999...; then 10x - x = 9, so x = 1; two different decimal strings can name the same number."],
["Mediant trick","For positive fractions a/b < c/d, the mediant (a+c)/(b+d) lies strictly between them, so there are infinitely many fractions between any two fractions."],
["Cyclic number","1/7 = 0.142857 repeating with period 6, and 142857 x 2, x 3, x 4 are cyclic shifts of the same six digits (285714, 428571, 571428)."]],
[Qz("What is 2/3 of 15?",["10","12","9","5"],0,"2/3 x 15 = 30/3 = 10."),
Qz("Evaluate 3/4 / 3/8 (3/4 divided by 3/8).",["1/2","2","8/9","9/32"],1,"3/4 x 8/3 = 24/12 = 2."),
Qz("What is 0.6 x 0.07?",["0.42","0.0042","0.042","4.2"],2,"6 x 7 = 42 with 1 + 2 = 3 decimal places gives 0.042."),
Qz("What is the reciprocal of 2 1/2?",["5/2","1/2","2 1/2","2/5"],3,"2 1/2 = 5/2, so the reciprocal is 2/5."),
Qz("What is 12.5 / 0.5?",["25","2.5","250","6.25"],0,"Multiply both by 10: 125 / 5 = 25.")],
PP([["Find 3/5 x 10/9.","3/5 x 10/9 = 30/45 = 2/3."],
["Find 4/7 / (2/21).","4/7 x 21/2 = 84/14 = 6."],
["Find 1.5 x 0.4.","15 x 4 = 60 with 2 decimal places: 0.60 = 0.6."],
["Find 6.3 / 0.9.","Multiply both by 10: 63 / 9 = 7."],
["Find 1/2 of 3/4.","1/2 x 3/4 = 3/8."]],
[["Find 2 1/4 x 1 7/9.","2 1/4 = 9/4 and 1 7/9 = 16/9. Product = (9 x 16)/(4 x 9) = 144/36 = 4."],
["A tank is 3/4 full. Two-thirds of the water is used. What fraction of the whole tank remains?","Remaining water = 1 - 2/3 = 1/3 of the water. Fraction of tank = 1/3 x 3/4 = 3/12 = 1/4."],
["Find 0.36 x 2.5.","36 x 25 = 900 with 2 + 1 = 3 decimal places: 0.900 = 0.9."],
["How many pieces of length 0.75 m can be cut from a rope 12.6 m long? How much rope is left?","12.6 / 0.75 = 1260/75 = 16.8, so 16 whole pieces. Used = 16 x 0.75 = 12 m. Left = 12.6 - 12 = 0.6 m."],
["Simplify 5/6 + 3/4 x 2/9.","Do multiplication first: 3/4 x 2/9 = 6/36 = 1/6. Then 5/6 + 1/6 = 6/6 = 1."]],
[["A journey is done 3/5 by train, 2/3 of the rest by bus, and the remaining 24 km on foot. Find the total distance.","Rest after train = 1 - 3/5 = 2/5. Bus = 2/3 x 2/5 = 4/15. Foot = 2/5 - 4/15 = 6/15 - 4/15 = 2/15 of the total. 2/15 of D = 24, so D = 24 x 15/2 = 180 km. Check: train 108, bus 48, foot 24, total 180."],
["Evaluate 1/(2x3) + 1/(3x4) + 1/(4x5) + 1/(5x6).","Use 1/(n(n+1)) = 1/n - 1/(n+1). Sum = (1/2 - 1/3) + (1/3 - 1/4) + (1/4 - 1/5) + (1/5 - 1/6) = 1/2 - 1/6 = 3/6 - 1/6 = 1/3. Check: 1/6 + 1/12 + 1/20 + 1/30 = (10+5+3+2)/60 = 20/60 = 1/3."],
["Cloth costs Rs 46.40 per metre. Find the cost of 3 3/4 m and the change from Rs 200.","3 3/4 = 3.75 m. Cost = 46.40 x 3.75 = 46.40 x 3 + 46.40 x 0.75 = 139.20 + 34.80 = Rs 174. Change = 200 - 174 = Rs 26."],
["A number is such that 2/3 of it exceeds 3/5 of it by 4. Find the number.","2/3 - 3/5 = 10/15 - 9/15 = 1/15. So x/15 = 4 and x = 60. Check: 2/3 of 60 = 40, 3/5 of 60 = 36, difference 4."],
["Evaluate (3 1/3 / 5/6) x 0.15.","3 1/3 = 10/3. 10/3 / (5/6) = 10/3 x 6/5 = 60/15 = 4. Then 4 x 0.15 = 0.6."]])),

C({CBSE:"Simple Equations",ICSE:"Linear Equations in One Variable",IB:"Equations and Unknown Quantities"},
[S("1. Solving by Balancing and Transposition",
"An <b>equation</b> states that two expressions are equal; a <b>solution</b> is the value of the variable that makes it true. Whatever you do to one side you must do to the other: add, subtract, multiply or divide both sides by the same non-zero number. Transposing a term to the other side changes its sign (+ becomes -, x becomes /). Always verify by substituting the answer back.",
"<b>Solved example:</b> Solve 3x - 7 = 11.<br>Add 7 to both sides: 3x = 18.<br>Divide by 3: x = 6.<br>Check: 3 x 6 - 7 = 11. Correct."),
S("2. Equations with Brackets and Fractions on Both Sides",
"When the variable appears on both sides, collect variable terms on one side and constants on the other. Expand brackets first using a(b + c) = ab + ac. For fractional equations, multiply every term by the LCM of the denominators to clear fractions. Simplify at each step to avoid sign errors.",
"<b>Solved example:</b> (a) Solve 2(x + 3) = 3x - 4. (b) Solve x/4 + x/6 = 5.<br>(a) 2x + 6 = 3x - 4, so 6 + 4 = 3x - 2x, giving x = 10. Check: 2 x 13 = 26 and 3 x 10 - 4 = 26.<br>(b) LCM of 4 and 6 is 12: 3x + 2x = 60, so 5x = 60 and x = 12. Check: 3 + 2 = 5."),
S("3. Forming Equations from Word Problems",
"To solve a word problem, let the unknown be x, translate each statement into algebra, form an equation, solve it, and interpret the answer with units. Common set-ups: consecutive integers n, n+1, n+2; a two-digit number 10a + b; ages now and after t years; perimeter 2(l + b). Check the answer against the words of the problem, not just the equation.",
"<b>Solved example:</b> The sum of three consecutive integers is 78. Find them.<br>Let the integers be n, n+1, n+2. Then 3n + 3 = 78, so 3n = 75 and n = 25.<br>The numbers are 25, 26, 27 and 25 + 26 + 27 = 78.")],
[["Odd number sum","The sum of the first n odd numbers is n^2; for example 1 + 3 + 5 + 7 + 9 = 25 = 5^2, which lets you solve equations like 1 + 3 + ... + (2n-1) = 144 at once (n = 12)."],
["No solution versus all solutions","An equation can reduce to 0x = 5 (no solution) or 0x = 0 (every number is a solution); for example 2(x + 1) = 2x + 3 has no solution."],
["Age gaps never change","The difference between two people's ages is constant, so age puzzles are often solved fastest by fixing the difference first and then using the ratio condition."],
["Reversal is a multiple of 9","For a two-digit number 10a + b, the number minus its reverse is 9(a - b), so the difference of a number and its reverse is always divisible by 9."],
["Equal ratios add up","If a/b = c/d = k, then (a + c)/(b + d) = k as well (when b + d is not 0), because a = kb and c = kd."]],
[Qz("Solve x + 9 = 15.",["x = 24","x = 6","x = -6","x = 9"],1,"Subtract 9 from both sides: x = 6."),
Qz("Solve 5x = -35.",["x = 7","x = -30","x = -7","x = 40"],2,"Divide both sides by 5: x = -7."),
Qz("Solve 2x - 3 = x + 4.",["x = 1","x = 3","x = 4","x = 7"],3,"Subtract x: x - 3 = 4, so x = 7."),
Qz("Two numbers have sum 40 and difference 6. What is the smaller number?",["17","23","20","14"],0,"Smaller x, larger x + 6: 2x + 6 = 40 so x = 17."),
Qz("Solve x/3 - 2 = 4.",["x = 6","x = 18","x = 12","x = 2"],1,"x/3 = 6, so x = 18.")],
PP([["Solve x + 12 = 20.","Subtract 12: x = 8."],
["Solve 4x = 36.","Divide by 4: x = 9."],
["Solve 3x - 5 = 16.","3x = 21, so x = 7."],
["Solve x/5 = 7.","Multiply by 5: x = 35."],
["A number added to 15 gives 40. Find the number.","x + 15 = 40, so x = 25."]],
[["Solve 5x - 3 = 2x + 9.","5x - 2x = 9 + 3, so 3x = 12 and x = 4. Check: 20 - 3 = 17 and 8 + 9 = 17."],
["Solve 3(x - 2) = 2(x + 1).","3x - 6 = 2x + 2, so 3x - 2x = 2 + 6 and x = 8. Check: 3 x 6 = 18 and 2 x 9 = 18."],
["Solve (2x - 1)/5 = 3.","Multiply by 5: 2x - 1 = 15, so 2x = 16 and x = 8."],
["The perimeter of a rectangle is 56 cm and its length is 4 cm more than its breadth. Find both sides.","Breadth b, length b + 4. 2(b + b + 4) = 56, so 2b + 4 = 28, b = 12 cm and length = 16 cm. Check: 2(12 + 16) = 56."],
["A father is 3 times as old as his son. In 10 years the sum of their ages will be 80. Find their present ages.","Son x, father 3x. After 10 years: (x + 10) + (3x + 10) = 80, so 4x = 60 and x = 15. Son 15, father 45. Check: 25 + 55 = 80."]],
[["The sum of three consecutive multiples of 5 is 195. Find them.","Let them be x - 5, x, x + 5. Sum = 3x = 195, so x = 65. The numbers are 60, 65, 70 and 60 + 65 + 70 = 195."],
["The digits of a two-digit number add up to 11. If the digits are reversed the number increases by 27. Find the number.","Tens digit a, units digit b: a + b = 11. Reversed minus original = (10b + a) - (10a + b) = 9(b - a) = 27, so b - a = 3. Adding: 2b = 14, b = 7, a = 4. The number is 47; reversed 74; 74 - 47 = 27."],
["Solve x/2 + x/3 + x/4 = 26.","LCM = 12: 6x + 4x + 3x = 312, so 13x = 312 and x = 24. Check: 12 + 8 + 6 = 26."],
["A bag has 30 coins of Rs 5 and Rs 2 worth Rs 108 in all. How many of each?","Let there be x five-rupee coins and 30 - x two-rupee coins. 5x + 2(30 - x) = 108 gives 3x + 60 = 108, so x = 16. So 16 coins of Rs 5 and 14 of Rs 2. Check: 80 + 28 = 108."],
["Solve (2x + 1)/(x + 4) = 5/6 and verify.","Cross-multiply: 6(2x + 1) = 5(x + 4), so 12x + 6 = 5x + 20, 7x = 14 and x = 2. Check: (4 + 1)/(2 + 4) = 5/6."]])),

C({CBSE:"Lines and Angles",ICSE:"Angles and Parallel Lines",IB:"Angle Relationships in Geometry"},
[S("1. Pairs of Angles",
"Two angles are <b>complementary</b> if their sum is 90 deg and <b>supplementary</b> if their sum is 180 deg. A <b>linear pair</b> is two adjacent angles whose non-common arms form a straight line, so a linear pair is always supplementary. When two lines intersect, <b>vertically opposite angles</b> are equal. Angles around a point add up to 360 deg.",
"<b>Solved example:</b> An angle's supplement is 3 times its complement. Find the angle.<br>Let the angle be x. 180 - x = 3(90 - x) = 270 - 3x.<br>2x = 90, so x = 45 deg.<br>Check: supplement 135, complement 45, and 3 x 45 = 135."),
S("2. Parallel Lines and a Transversal",
"A <b>transversal</b> is a line cutting two or more lines at distinct points. When the lines are parallel: corresponding angles are equal, alternate interior angles are equal, and co-interior (same-side interior) angles are supplementary. Knowing one of the eight angles gives all the others, each equal to either that angle or 180 deg minus it.",
"<b>Solved example:</b> Parallel lines are cut by a transversal and one interior angle is 65 deg. Find the angles related to it.<br>Alternate interior angle = 65 deg.<br>Co-interior angle = 180 - 65 = 115 deg.<br>Corresponding angle = 65 deg."),
S("3. Testing for Parallel Lines and Using Algebra",
"The converses also hold: if corresponding angles are equal, or alternate interior angles are equal, or co-interior angles are supplementary, then the two lines are parallel. Many problems give angles as expressions in x; set up an equation using the correct angle relation, solve for x, and then substitute back. Always name the relation you are using, for example vertically opposite or co-interior.",
"<b>Solved example:</b> Four angles at a point are x, 2x, 3x and 4x. Find them. Also, vertically opposite angles are (3x + 10) and (5x - 30); find x.<br>10x = 360, so x = 36 and the angles are 36, 72, 108, 144 deg (sum 360).<br>3x + 10 = 5x - 30 gives 40 = 2x, so x = 20 and each angle is 70 deg.")],
[["Lines through a point","n distinct lines through one point create 2n angles around that point; three concurrent lines make 6 angles."],
["Clock hands","The minute hand moves 6 deg per minute and the hour hand 0.5 deg per minute, so the angle between them changes at 5.5 deg per minute; at 4:00 it is 120 deg."],
["Bisectors of a linear pair","The bisectors of the two angles of a linear pair are perpendicular, since half of 180 deg is 90 deg."],
["Parallel to a parallel","Two lines each parallel to a third line are parallel to each other, and through a point outside a line there is exactly one line parallel to it."],
["Bent-line rule","If a path bends at P between two parallel lines, draw a line through P parallel to them; the bend angle then equals the sum of the two alternate interior angles, for example 30 + 40 = 70 deg."]],
[Qz("What is the complement of 35 deg?",["145 deg","65 deg","55 deg","35 deg"],2,"90 - 35 = 55 deg."),
Qz("What is the supplement of 128 deg?",["38 deg","128 deg","62 deg","52 deg"],3,"180 - 128 = 52 deg."),
Qz("Two lines intersect. Which pair of angles is always equal?",["Vertically opposite angles","Adjacent angles","Linear pair angles","Angles on the same side"],0,"Vertically opposite angles are equal."),
Qz("Two parallel lines are cut by a transversal. One co-interior angle is 70 deg. The other is",["70 deg","110 deg","20 deg","290 deg"],1,"Co-interior angles are supplementary: 180 - 70 = 110 deg."),
Qz("In a linear pair one angle is 4 times the other. The smaller angle is",["18 deg","45 deg","36 deg","30 deg"],2,"x + 4x = 180, so x = 36 deg.")],
PP([["Find the complement of 62 deg.","90 - 62 = 28 deg."],
["Find the supplement of 105 deg.","180 - 105 = 75 deg."],
["Two lines intersect and one angle is 50 deg. Find the vertically opposite angle and an adjacent angle.","Vertically opposite = 50 deg. Adjacent angle (linear pair) = 180 - 50 = 130 deg."],
["Parallel lines are cut by a transversal. An alternate interior angle is 72 deg. Find the other alternate angle.","Alternate interior angles are equal, so it is 72 deg."],
["The angles of a linear pair are x and x + 20. Find them.","x + x + 20 = 180, so 2x = 160 and x = 80. The angles are 80 deg and 100 deg."]],
[["Angles around a point are 90, 110, x and 60 deg. Find x.","Sum = 360: 90 + 110 + 60 + x = 360, so 260 + x = 360 and x = 100 deg."],
["Two complementary angles are in the ratio 2 : 3. Find them.","Total parts 5, so one part = 90/5 = 18 deg. Angles are 36 deg and 54 deg."],
["Parallel lines are cut by a transversal. Co-interior angles are (2x + 10) and (3x + 20) deg. Find the angles.","Sum = 180: 5x + 30 = 180, so x = 30. The angles are 70 deg and 110 deg."],
["Vertically opposite angles are (4x - 10) and (2x + 30) deg. Find x and the angle.","4x - 10 = 2x + 30, so 2x = 40 and x = 20. Angle = 4 x 20 - 10 = 70 deg; check 2 x 20 + 30 = 70."],
["An angle's supplement is 40 deg more than 3 times its complement. Find the angle.","180 - x = 40 + 3(90 - x) = 310 - 3x, so 2x = 130 and x = 65 deg. Check: supplement 115, complement 25, 3 x 25 + 40 = 115."]],
[["Parallel lines are cut by a transversal; the co-interior angles are 70 deg and 110 deg. Find the angle between their bisectors.","The bisectors make angles 35 deg and 55 deg with the transversal. They meet to form a triangle with the transversal, so the angle between them = 180 - 35 - 55 = 90 deg."],
["Four angles at a point are x, x + 10, 2x and 2x + 20 deg. Find each.","6x + 30 = 360, so 6x = 330 and x = 55. The angles are 55, 65, 110, 130 deg; sum = 360."],
["An angle is 30 deg more than twice its complement. Find the angle and its supplement.","x = 2(90 - x) + 30 = 210 - 2x, so 3x = 210 and x = 70 deg. Supplement = 110 deg. Check: complement 20, 2 x 20 + 30 = 70."],
["Find the angle between the hands of a clock at 2:40.","Hour hand: 2 x 30 + 40 x 0.5 = 80 deg from 12. Minute hand: 40 x 6 = 240 deg. Difference = 160 deg, which is less than 180, so the angle is 160 deg."],
["AB is parallel to CD and a transversal EF meets them at G and H. Corresponding angles EGB = (5x + 10) deg and GHD = (3x + 50) deg. Find x, then angles GHC and AGH.","Corresponding angles are equal: 5x + 10 = 3x + 50, so x = 20 and each is 110 deg. GHC forms a linear pair with GHD: 180 - 110 = 70 deg. AGH and GHD are alternate interior angles, so AGH = 110 deg."]])),

C({CBSE:"The Triangle and its Properties",ICSE:"Triangles and Pythagoras Theorem",IB:"Triangles: Angles and Right-Angled Relationships"},
[S("1. Angle Sum Property",
"The three interior angles of any triangle add up to 180 deg. In an equilateral triangle each angle is 60 deg; in an isosceles triangle the angles opposite equal sides are equal. A triangle can have at most one right or obtuse angle. The <b>triangle inequality</b> says the sum of any two sides is greater than the third side.",
"<b>Solved example:</b> The angles of a triangle are in the ratio 2 : 3 : 4. Find them.<br>Total parts = 9, so one part = 180/9 = 20 deg.<br>Angles = 40, 60, 80 deg. Check: 40 + 60 + 80 = 180."),
S("2. Exterior Angle Property",
"Extending one side of a triangle forms an <b>exterior angle</b>. It equals the sum of the two interior opposite angles, and it is supplementary to the adjacent interior angle. Hence an exterior angle is always greater than either interior opposite angle. The three exterior angles taken one at each vertex add up to 360 deg.",
"<b>Solved example:</b> An exterior angle is 115 deg and one interior opposite angle is 45 deg. Find the other angles.<br>Other interior opposite angle = 115 - 45 = 70 deg.<br>Adjacent interior angle = 180 - 115 = 65 deg.<br>Check: 45 + 70 + 65 = 180."),
S("3. Pythagoras Theorem",
"In a right-angled triangle the square of the hypotenuse (the side opposite the right angle) equals the sum of the squares of the other two sides: c^2 = a^2 + b^2. The converse is also true: if c^2 = a^2 + b^2 holds, the triangle is right-angled. Common triples are (3, 4, 5), (5, 12, 13), (8, 15, 17) and (7, 24, 25). Use it for ladders, diagonals and distances.",
"<b>Solved example:</b> A 13 m ladder leans on a wall with its foot 5 m from the wall. How high does it reach?<br>h^2 = 13^2 - 5^2 = 169 - 25 = 144.<br>h = 12 m.")],
[["Generating triples","For integers m > n, (m^2 - n^2, 2mn, m^2 + n^2) is a Pythagorean triple; m = 3, n = 2 gives 5, 12, 13."],
["Inradius of a right triangle","A right triangle with legs a, b and hypotenuse c has inradius (a + b - c)/2; for 3, 4, 5 it is (3 + 4 - 5)/2 = 1."],
["Exterior angles total","One exterior angle at each vertex of any triangle sum to 360 deg, whatever the shape."],
["Counting third sides","If two sides are 5 and 9, the third side x satisfies 4 < x < 14, so there are 9 integer values (5 to 13)."],
["Median to the hypotenuse","In a right triangle the median to the hypotenuse equals half the hypotenuse, so in a 6, 8, 10 triangle it is 5."]],
[Qz("Two angles of a triangle are 50 deg and 60 deg. The third is",["60 deg","80 deg","50 deg","70 deg"],3,"180 - 110 = 70 deg."),
Qz("An exterior angle is 110 deg and one interior opposite angle is 40 deg. The other interior opposite angle is",["70 deg","40 deg","110 deg","30 deg"],0,"110 - 40 = 70 deg."),
Qz("The hypotenuse of a right triangle with legs 9 and 12 is",["21","15","14","13"],1,"81 + 144 = 225 and the square root is 15."),
Qz("Which set cannot be the sides of a triangle?",["3, 4, 5","5, 6, 10","3, 4, 8","6, 7, 8"],2,"3 + 4 = 7 is not greater than 8."),
Qz("Which set of sides forms a right triangle?",["6, 7, 10","9, 12, 16","5, 8, 10","8, 15, 17"],3,"64 + 225 = 289 = 17^2.")],
PP([["Two angles of a triangle are 75 deg and 45 deg. Find the third.","180 - (75 + 45) = 60 deg."],
["Find the hypotenuse of a right triangle with legs 6 cm and 8 cm.","36 + 64 = 100, so hypotenuse = 10 cm."],
["An exterior angle of a triangle is formed by interior opposite angles 60 deg and 50 deg. Find it.","Exterior angle = 60 + 50 = 110 deg."],
["Can a triangle have sides 4 cm, 5 cm and 10 cm?","4 + 5 = 9, which is less than 10, so no triangle is possible."],
["An isosceles triangle has vertex angle 40 deg. Find the base angles.","Base angles are equal: (180 - 40)/2 = 70 deg each."]],
[["The angles of a triangle are x, x + 10 and x + 20 deg. Find them.","3x + 30 = 180, so x = 50. Angles are 50, 60, 70 deg."],
["The hypotenuse of a right triangle is 25 cm and one leg is 7 cm. Find the other leg.","Leg^2 = 625 - 49 = 576, so the leg = 24 cm."],
["An exterior angle is (5x - 10) deg and its interior opposite angles are (2x + 20) deg and (x + 30) deg. Find x and all interior angles.","5x - 10 = 3x + 50, so x = 30. Opposite angles are 80 and 60 deg; exterior = 140 deg; adjacent interior = 40 deg. Check: 80 + 60 + 40 = 180."],
["Find the length of the diagonal of a rectangle with sides 20 cm and 21 cm.","d^2 = 400 + 441 = 841, so d = 29 cm."],
["An isosceles triangle has equal sides 10 cm and base 12 cm. Find its height and area.","The height bisects the base: h^2 = 10^2 - 6^2 = 64, so h = 8 cm. Area = 1/2 x 12 x 8 = 48 cm^2."]],
[["A man walks 8 km west and then 15 km north. How far is he from the start? If he returns by the direct path, how far does he walk in all?","Distance^2 = 64 + 225 = 289, so direct distance = 17 km. Total walk = 8 + 15 + 17 = 40 km."],
["In triangle ABC, angle A = angle B + 20 deg and the exterior angle at C is 100 deg. Find the interior angles.","Exterior at C = A + B = 100. With A = B + 20: 2B + 20 = 100, so B = 40 and A = 60. C = 180 - 100 = 80. Check: 60 + 40 + 80 = 180."],
["Show that a triangle with sides 9, 40, 41 is right-angled, and find the altitude to the hypotenuse.","9^2 + 40^2 = 81 + 1600 = 1681 = 41^2, so it is right-angled. Area = 1/2 x 9 x 40 = 180. Altitude to hypotenuse = 2 x 180/41 = 360/41 cm, about 8.78 cm."],
["A 25 m ladder reaches 24 m up a wall. If its top slides down 4 m, how far does the foot move out?","Initial foot distance = sqrt(625 - 576) = 7 m. New height = 20 m, so new foot distance = sqrt(625 - 400) = sqrt(225) = 15 m. The foot moves out 15 - 7 = 8 m."],
["In isosceles triangle ABC with AB = AC, the exterior angle at A is 100 deg. Find all interior angles and the exterior angle at B.","Exterior at A = B + C = 100 deg, and B = C, so B = C = 50 deg. Interior A = 180 - 100 = 80 deg. Check: 80 + 50 + 50 = 180. Exterior at B = 180 - 50 = 130 deg."]])),

C({CBSE:"Comparing Quantities",ICSE:"Ratio, Proportion and Percentages",IB:"Ratio, Percentage and Financial Mathematics"},
[S("1. Ratio and Proportion",
"A <b>ratio</b> a : b compares two quantities of the same unit and is simplified by dividing both terms by their HCF. Four quantities are in <b>proportion</b> if a : b = c : d, that is ad = bc. To divide an amount in the ratio p : q : r, split it into p + q + r equal parts. Equal ratios are unchanged when both terms are multiplied or divided by the same non-zero number.",
"<b>Solved example:</b> Divide Rs 840 in the ratio 3 : 4 : 5.<br>Total parts = 12, one part = 840/12 = Rs 70.<br>Shares: 3 x 70 = 210, 4 x 70 = 280, 5 x 70 = 350.<br>Check: 210 + 280 + 350 = 840."),
S("2. Percentage, Increase and Discount",
"<b>Percent</b> means per hundred: x% = x/100. To find p% of N compute (p/100) x N; to express a as a percentage of b compute (a/b) x 100. Percentage change = (change/original) x 100. Discount is a percentage reduction on the marked price, and successive changes multiply: a rise of 15% then a fall of 10% multiplies the price by 1.15 x 0.90.",
"<b>Solved example:</b> A price of Rs 800 rises by 15% and then a 10% discount is given. Find the final price.<br>After the rise: 800 x 1.15 = 920.<br>After the discount: 920 x 0.90 = 828.<br>The final price is Rs 828."),
S("3. Profit, Loss and Simple Interest",
"Profit = SP - CP and Loss = CP - SP, and both percentages are calculated on the cost price: profit% = (profit/CP) x 100. <b>Simple interest</b> on principal P at rate R% per year for T years is SI = (P x R x T)/100, and the amount is A = P + SI. In SI the interest each year is the same because it is always earned on the original principal.",
"<b>Solved example:</b> (a) CP Rs 640 and SP Rs 720; find the profit%. (b) Find SI and amount on Rs 5000 at 8% for 3 years.<br>(a) Profit = 80; profit% = 80/640 x 100 = 12.5%.<br>(b) SI = 5000 x 8 x 3/100 = Rs 1200; amount = 5000 + 1200 = Rs 6200.")],
[["Up then down","A rise of x% followed by a fall of x% leaves a net fall of x^2/100 percent; +20% then -20% gives 0.96, a 4% loss."],
["Swap trick","A% of B equals B% of A, so 8% of 50 = 50% of 8 = 4."],
["Doubling time","At simple interest of R% a sum doubles in 100/R years; at 5% that is 20 years."],
["Pens and profit","If the cost of 12 pens equals the selling price of 10 pens, then SP/CP = 12/10 and the profit is 20%."],
["Two discounts","Successive discounts of 20% and 10% give a price factor 0.8 x 0.9 = 0.72, a single discount of 28% and not 30%."]],
[Qz("What is 25% of 360?",["90","25","120","180"],0,"360/4 = 90."),
Qz("The ratio 18 : 24 in simplest form is",["9 : 10","3 : 4","2 : 3","6 : 7"],1,"HCF is 6, giving 3 : 4."),
Qz("Simple interest on Rs 2000 at 5% for 2 years is",["Rs 100","Rs 2200","Rs 200","Rs 20"],2,"2000 x 5 x 2/100 = 200."),
Qz("An article costing Rs 500 is sold at a 10% loss. The selling price is",["Rs 550","Rs 490","Rs 400","Rs 450"],3,"500 x 0.90 = 450."),
Qz("15 is what percent of 60?",["25%","15%","40%","4%"],0,"15/60 x 100 = 25%.")],
PP([["Simplify the ratio 45 : 75.","HCF is 15: 45/15 : 75/15 = 3 : 5."],
["Find 20% of 450.","450 x 20/100 = 90."],
["CP = Rs 250 and SP = Rs 300. Find the profit percent.","Profit = 50; 50/250 x 100 = 20%."],
["Find the simple interest on Rs 1000 at 10% per year for 2 years.","SI = 1000 x 10 x 2/100 = Rs 200."],
["12 is what percent of 48?","12/48 x 100 = 25%."]],
[["Divide Rs 1200 between A and B in the ratio 2 : 3.","Total parts 5, one part = 240. A = 480, B = 720. Check: 480 + 720 = 1200."],
["A marked price is Rs 1500 and a discount of 12% is given. Find the selling price.","Discount = 12/100 x 1500 = Rs 180. SP = 1500 - 180 = Rs 1320."],
["An article is sold for Rs 1035 at a profit of 15%. Find its cost price.","SP = 1.15 x CP, so CP = 1035/1.15 = Rs 900. Check: 900 x 1.15 = 1035."],
["Find the SI and amount on Rs 7500 at 6% per year for 4 years.","SI = 7500 x 6 x 4/100 = Rs 1800. Amount = 7500 + 1800 = Rs 9300."],
["A person earns Rs 24000 a month and spends 65% of it. Find the savings.","Savings = 35% of 24000 = 0.35 x 24000 = Rs 8400."]],
[["A shirt price is raised by 20% and then reduced by 25%. Find the net percentage change and the final price if the original is Rs 800.","Factor = 1.20 x 0.75 = 0.90, a net decrease of 10%. Final price = 0.90 x 800 = Rs 720."],
["A shopkeeper buys 40 books at Rs 80 each. He sells 30 at Rs 100 each and the rest at Rs 60 each. Find the profit percent.","CP = 40 x 80 = Rs 3200. SP = 30 x 100 + 10 x 60 = 3000 + 600 = Rs 3600. Profit = 400. Profit% = 400/3200 x 100 = 12.5%."],
["A sum at 8% simple interest amounts to Rs 7000 in 5 years. Find the sum, then the rate at which that sum earns Rs 1500 interest in 3 years.","Amount = P(1 + 8 x 5/100) = 1.4P = 7000, so P = Rs 5000. Then 5000 x R x 3/100 = 1500 gives 150R = 1500, so R = 10%."],
["A school has 640 students with boys to girls in the ratio 5 : 3. If 20% of boys and 25% of girls get scholarships, how many students get none?","Parts 8, one part = 80, boys = 400 and girls = 240. Scholarships = 0.20 x 400 + 0.25 x 240 = 80 + 60 = 140. Without scholarship = 640 - 140 = 500."],
["Two articles are each sold for Rs 1200, one at a 20% profit and the other at a 20% loss. Find the overall gain or loss.","CP1 = 1200/1.2 = Rs 1000. CP2 = 1200/0.8 = Rs 1500. Total CP = 2500, total SP = 2400. Loss = Rs 100, which is 100/2500 x 100 = 4%."]])),

C({CBSE:"Perimeter and Area",ICSE:"Mensuration: Area and Circles",IB:"Measuring Area and Circumference"},
[S("1. Area and Perimeter of a Parallelogram",
"The area of a parallelogram is base x corresponding height, A = b x h, where the height is the perpendicular distance between the parallel sides, not the slanting side. Its perimeter is 2(a + b) using the two adjacent sides. A parallelogram and a rectangle on the same base and between the same parallels have equal area. Either side can be taken as base provided the matching height is used.",
"<b>Solved example:</b> A parallelogram has base 15 cm and height 8 cm. Find its area; if the area of another parallelogram is 108 cm^2 with base 12 cm, find its height.<br>Area = 15 x 8 = 120 cm^2.<br>Height = 108/12 = 9 cm."),
S("2. Area of a Triangle",
"A triangle is half of a parallelogram with the same base and height, so Area = 1/2 x base x height. Any side may be the base if the altitude to it is used. For a right triangle the two legs serve as base and height. Triangles on the same base and between the same parallels have equal areas, and a median splits a triangle into two triangles of equal area.",
"<b>Solved example:</b> A triangle has area 96 cm^2 and base 16 cm. Find its height. Also find the area of a triangle with base 18 cm and height 10 cm.<br>1/2 x 16 x h = 96, so 8h = 96 and h = 12 cm.<br>Second area = 1/2 x 18 x 10 = 90 cm^2."),
S("3. Circles: Circumference and Area",
"For a circle of radius r, the circumference is C = 2 pi r and the area is A = pi r^2, with pi = 22/7 (about 3.14). The diameter is d = 2r so C = pi d. Doubling the radius doubles the circumference but multiplies the area by 4. Circumference is a length in cm or m, while area is in square units.",
"<b>Solved example:</b> Find the circumference and area of a circle of radius 14 cm (pi = 22/7).<br>C = 2 x 22/7 x 14 = 88 cm.<br>A = 22/7 x 14 x 14 = 22 x 28 = 616 cm^2.")],
[["Square wins","Among all rectangles with the same perimeter the square has the greatest area; with perimeter 40 the square gives 10 x 10 = 100, while 12 x 8 gives only 96."],
["Median halves area","A median divides a triangle into two equal-area triangles, and the three medians together cut it into six equal-area pieces."],
["Same base, same parallels","Triangles on the same base between the same two parallel lines have equal area, so sliding the apex along a parallel line does not change the area."],
["Scaling a circle","Doubling a radius doubles the circumference but quadruples the area, and tripling the radius multiplies the area by 9."],
["Ring area","The area between circles of radii R and r is pi(R^2 - r^2) = pi(R - r)(R + r); for R = 10 and r = 6 it is 64 pi."]],
[Qz("The area of a parallelogram with base 10 cm and height 7 cm is",["17 cm^2","70 cm^2","35 cm^2","140 cm^2"],1,"10 x 7 = 70."),
Qz("The circumference of a circle of radius 7 cm (pi = 22/7) is",["154 cm","22 cm","44 cm","49 cm"],2,"2 x 22/7 x 7 = 44."),
Qz("The area of a triangle with base 12 cm and height 5 cm is",["60 cm^2","17 cm^2","15 cm^2","30 cm^2"],3,"1/2 x 12 x 5 = 30."),
Qz("The area of a circle of diameter 14 cm (pi = 22/7) is",["154 cm^2","44 cm^2","616 cm^2","308 cm^2"],0,"r = 7 and 22/7 x 49 = 154."),
Qz("A parallelogram has area 60 cm^2 and base 12 cm. Its height is",["720 cm","5 cm","6 cm","48 cm"],1,"60/12 = 5 cm.")],
PP([["Find the area of a parallelogram with base 9 cm and height 6 cm.","9 x 6 = 54 cm^2."],
["Find the area of a triangle with base 10 cm and height 7 cm.","1/2 x 10 x 7 = 35 cm^2."],
["Find the circumference of a circle of radius 21 cm (pi = 22/7).","2 x 22/7 x 21 = 132 cm."],
["Find the area of a circle of radius 7 cm (pi = 22/7).","22/7 x 49 = 154 cm^2."],
["Find the perimeter of a parallelogram with sides 8 cm and 5 cm.","2(8 + 5) = 26 cm."]],
[["A parallelogram has area 150 cm^2 and base 25 cm. Find its height.","Height = 150/25 = 6 cm."],
["A triangle has area 84 cm^2 and height 12 cm. Find its base.","1/2 x b x 12 = 84, so 6b = 84 and b = 14 cm."],
["The circumference of a circle is 66 cm. Find its radius and area (pi = 22/7).","2 x 22/7 x r = 66, so r = 66 x 7/44 = 10.5 cm. Area = 22/7 x 10.5 x 10.5 = 22/7 x 110.25 = 346.5 cm^2."],
["A wheel has radius 35 cm. How far does it travel in 100 revolutions?","Circumference = 2 x 22/7 x 35 = 220 cm. Distance = 100 x 220 = 22000 cm = 220 m."],
["A right triangle has legs 9 cm and 12 cm. Find its area, hypotenuse and the height on the hypotenuse.","Area = 1/2 x 9 x 12 = 54 cm^2. Hypotenuse = sqrt(81 + 144) = 15 cm. Height h: 1/2 x 15 x h = 54, so h = 108/15 = 7.2 cm."]],
[["A rectangular park 40 m by 30 m has a circular flower bed of radius 7 m. Find the area of the rest (pi = 22/7).","Park = 40 x 30 = 1200 m^2. Bed = 22/7 x 49 = 154 m^2. Remaining = 1200 - 154 = 1046 m^2."],
["A circular ground of radius 21 m has a path 7 m wide all around outside it. Find the area of the path (pi = 22/7).","Outer radius = 28 m. Area = 22/7 x (28^2 - 21^2) = 22/7 x (784 - 441) = 22/7 x 343 = 22 x 49 = 1078 m^2."],
["A parallelogram has sides 20 cm and 12 cm and the height on the 20 cm side is 9 cm. Find its area and the height on the 12 cm side.","Area = 20 x 9 = 180 cm^2. Height on 12 cm side = 180/12 = 15 cm."],
["In triangle ABC of area 60 cm^2, D is the midpoint of BC and E is the midpoint of AD. Find the areas of triangles ABE and BEC.","The median AD gives area ABD = 30. In triangle ABD, median BE gives ABE = 15. Similarly BED = 15 and DEC = 15, so BEC = 15 + 15 = 30 cm^2."],
["A wire in the shape of a circle of radius 14 cm is bent into a square. Compare the areas (pi = 22/7).","Wire length = 2 x 22/7 x 14 = 88 cm. Square side = 88/4 = 22 cm, area = 484 cm^2. Circle area = 22/7 x 196 = 616 cm^2. The circle encloses 616 - 484 = 132 cm^2 more."]])),

C({CBSE:"Data Handling",ICSE:"Statistics and Probability",IB:"Data Analysis and Chance"},
[S("1. Arithmetic Mean",
"The <b>mean</b> (average) of n observations is mean = (sum of observations)/n. It lies between the smallest and largest observation and is affected by extreme values. If the mean is known, the total is mean x n, which is useful for finding a missing value. The sum of deviations of all observations from the mean is zero.",
"<b>Solved example:</b> Find the mean of 12, 15, 18, 20, 10, and the missing number if 6 numbers have mean 15 and five of them sum to 70.<br>Sum = 75, n = 5, mean = 75/5 = 15.<br>Total of six = 15 x 6 = 90, so missing number = 90 - 70 = 20."),
S("2. Median, Mode and Range",
"The <b>median</b> is the middle value of the data arranged in order: for odd n it is the ((n+1)/2)th value; for even n it is the average of the two middle values. The <b>mode</b> is the value occurring most often, and a data set may have no mode or several. The <b>range</b> is largest minus smallest. Median is less affected by extreme values than the mean.",
"<b>Solved example:</b> Data: 7, 3, 9, 3, 5, 8, 3, 10. Find mean, median, mode and range.<br>Sorted: 3, 3, 3, 5, 7, 8, 9, 10. Sum = 48, mean = 48/8 = 6.<br>Median = (5 + 7)/2 = 6. Mode = 3. Range = 10 - 3 = 7."),
S("3. Basic Probability",
"The <b>probability</b> of an event = (number of favourable outcomes)/(total equally likely outcomes), always between 0 (impossible) and 1 (certain). The probability that an event does not happen is 1 minus P(event). For a fair die the outcomes are 1 to 6; for a fair coin they are head and tail. Probabilities of all outcomes of an experiment add up to 1.",
"<b>Solved example:</b> A die is rolled; find P(prime). A bag has 5 red, 3 blue and 2 green balls; find P(blue) and P(not red).<br>Primes are 2, 3, 5 so P = 3/6 = 1/2.<br>Total balls = 10: P(blue) = 3/10 and P(not red) = 5/10 = 1/2.")],
[["Average of naturals","The mean of the first n natural numbers is (n + 1)/2, and the mean of the first n odd numbers is exactly n."],
["Shift invariance","Adding k to every observation raises the mean and median by k but leaves the range unchanged."],
["Zero deviation","The sum of (observation - mean) over all data is always 0, which is why the mean is the balance point of the data."],
["Most likely dice sum","With two dice the sum 7 is most likely with probability 6/36 = 1/6, while 2 and 12 each have probability 1/36."],
["Combining groups","If 10 values have mean 20 and 30 values have mean 40, the combined mean is (200 + 1200)/40 = 35, a weighted average and not 30."]],
[Qz("The mean of 4, 6, 8, 10, 12 is",["6","10","8","40"],2,"Sum 40 divided by 5 is 8."),
Qz("The median of 3, 9, 5, 7, 1 is",["7","3","9","5"],3,"Sorted 1, 3, 5, 7, 9; middle value is 5."),
Qz("The mode of 2, 4, 4, 5, 4, 2 is",["4","2","5","3"],0,"4 occurs three times."),
Qz("The probability of a head in a toss of a fair coin is",["1","1/2","2","1/4"],1,"One favourable outcome out of two."),
Qz("On rolling a die, the probability of a number greater than 4 is",["1/2","1/6","1/3","2/3"],2,"Favourable 5 and 6, so 2/6 = 1/3.")],
PP([["Find the mean of 5, 7, 9, 11, 13.","Sum = 45, mean = 45/5 = 9."],
["Find the median of 12, 4, 8, 16, 20.","Sorted: 4, 8, 12, 16, 20; median = 12."],
["Find the mode of 3, 5, 3, 7, 5, 3.","3 occurs three times, so the mode is 3."],
["Find the range of 14, 9, 22, 5, 18.","Range = 22 - 5 = 17."],
["A letter is chosen from the word CHAOS. Find P(vowel).","Vowels A and O: P = 2/5."]],
[["The mean of 5 numbers is 18. A sixth number 30 is added. Find the new mean.","Sum of 5 = 90. New sum = 120, so new mean = 120/6 = 20."],
["Find the median and mean of 11, 7, 15, 9, 13, 5.","Sorted: 5, 7, 9, 11, 13, 15. Median = (9 + 11)/2 = 10. Mean = 60/6 = 10."],
["The mean of 6 numbers is 15. Five of them are 12, 14, 16, 18, 10. Find the sixth.","Total = 90. Five sum to 70, so the sixth = 20."],
["A bag has 4 red, 6 white and 5 black balls. Find P(white) and P(not black).","Total 15. P(white) = 6/15 = 2/5. P(not black) = 10/15 = 2/3."],
["Marks 40, 45, x, 50, 55 have mean 48. Find x.","Total = 48 x 5 = 240. 40 + 45 + 50 + 55 = 190, so x = 50."]],
[["The mean marks of 30 students is 60. For 20 of them the mean is 66. Find the mean of the other 10.","Total = 30 x 60 = 1800. Twenty students: 20 x 66 = 1320. The other 10 total 480, so mean = 48."],
["Seven numbers 4, 9, x, 7, 12, 5, 8 have mean 8. Find x, then the median and range.","Total = 56. Known sum = 4 + 9 + 7 + 12 + 5 + 8 = 45, so x = 11. Sorted: 4, 5, 7, 8, 9, 11, 12; median = 8; range = 12 - 4 = 8."],
["Two dice are thrown. Find P(sum 8), P(sum at most 4) and P(a double).","Total 36. Sum 8: (2,6), (3,5), (4,4), (5,3), (6,2) = 5, so 5/36. Sum at most 4: (1,1), (1,2), (2,1), (1,3), (3,1), (2,2) = 6, so 6/36 = 1/6. Doubles: 6/36 = 1/6."],
["A bag has 3 red, 5 blue and x green balls and P(green) = 1/3. Find x and P(red).","x/(8 + x) = 1/3 so 3x = 8 + x and x = 4. Total = 12, P(red) = 3/12 = 1/4. Check: 3/12 + 5/12 + 4/12 = 1."],
["Marks 10, 20, 30, 40, 50 have frequencies 2, 3, 5, 6, 4. Find the mean, median and mode.","Total frequency = 20. Sum = 20 + 60 + 150 + 240 + 200 = 670, mean = 670/20 = 33.5. Cumulative: 2, 5, 10, 16, 20, so the 10th value is 30 and the 11th is 40, median = 35. Mode = 40 (frequency 6)."]]))
];

C({ CBSE: "Microorganisms: Friend and Foe", ICSE: "Microorganisms and Their Role in Daily Life", IB: "Invisible Life: Allies and Adversaries" },
  [ S("1. Types and Habitats of Microorganisms",
      "<b>Microorganisms</b> are living things too small to be seen without a microscope. The major groups are <b>bacteria, fungi, protozoa, algae</b> and (non-cellular) <b>viruses</b>. They live in air, soil, water, and inside plants, animals and humans, and some survive extreme heat, cold or salt. Bacteria and many protozoa are unicellular; yeast is a unicellular fungus, while mushrooms are multicellular fungi. Viruses reproduce only inside a living host cell.",
      "<b>Solved example:</b> Classify: Lactobacillus is a bacterium, Penicillium a fungus, Amoeba a protozoan, Spirogyra an alga, and the polio agent a virus."),
    S("2. Friendly Microbes: Food, Medicine, Agriculture and Environment",
      "<b>Lactobacillus</b> turns milk into curd; <b>yeast</b> ferments sugar (C6H12O6 -> 2C2H5OH + 2CO2), so the CO2 makes dough rise and the alcohol is used in wine and beer. <b>Antibiotics</b> such as penicillin (from the mould Penicillium) kill or stop growth of bacteria; <b>vaccines</b> train immunity (Edward Jenner used cowpox against smallpox, 1798). <b>Rhizobium</b> in legume root nodules and blue-green algae fix atmospheric nitrogen. Bacteria and fungi decompose dead matter, cleaning the environment and recycling nutrients.",
      "<b>Solved example:</b> Why does dough rise on keeping it warm? Yeast respires and ferments sugar faster in warmth, releasing CO2 bubbles that puff up the dough."),
    S("3. Harmful Microbes, Disease Spread and Food Preservation",
      "<b>Pathogens</b> cause disease. <b>Communicable</b> diseases pass through air (cold, tuberculosis), water (cholera, typhoid), food, contact or <b>carriers</b> such as the housefly and mosquito. Female <i>Anopheles</i> spreads malaria (<i>Plasmodium</i>, a protozoan); female <i>Aedes</i> spreads dengue (a virus). Anthrax is a bacterial disease of cattle and humans. Food is preserved by <b>heat, cold, salt, sugar, oil/vinegar</b>, and pasteurisation of milk (about 70 C for 15-30 s, then rapid chilling).",
      "<b>Solved example:</b> Why does jam not spoil easily? A high sugar concentration draws water out of microbial cells by osmosis, so they cannot grow.") ],
  [ ["Binary fission", "Under ideal conditions E. coli divides about every 20 minutes, so one cell can give over 10^6 cells in roughly 7 hours (2^20 is about 10^6)."],
    ["Heterocysts", "The cyanobacterium Nostoc forms thick-walled heterocysts that fix nitrogen, since the enzyme nitrogenase is destroyed by oxygen."],
    ["Peptic ulcer", "Barry Marshall and Robin Warren showed that Helicobacter pylori causes most peptic ulcers (Nobel Prize, 2005), so antibiotics can cure them."],
    ["Antibiotic resistance", "Resistance spreads by natural selection of mutant bacteria and by plasmid transfer, and misuse of antibiotics accelerates it; antibiotics do not act on viruses."],
    ["Taq polymerase", "The heat-stable enzyme Taq, from the hot-spring bacterium Thermus aquaticus, makes PCR (DNA copying by repeated heating) possible."] ],
  [ Qz("Which microbe fixes nitrogen in the root nodules of legumes?", ["Lactobacillus", "Penicillium", "Rhizobium", "Vibrio"], 2, "Rhizobium lives symbiotically in legume nodules and fixes nitrogen."),
    Qz("The disease spread by the female Anopheles mosquito is:", ["Malaria", "Dengue", "Cholera", "Polio"], 0, "Anopheles carries Plasmodium, the malaria parasite."),
    Qz("Bread dough rises because yeast releases:", ["Oxygen", "Nitrogen", "Hydrogen", "Carbon dioxide"], 3, "Fermentation of sugar produces CO2 gas bubbles."),
    Qz("The first antibiotic discovered by Alexander Fleming was:", ["Streptomycin", "Penicillin", "Tetracycline", "Insulin"], 1, "Fleming noticed Penicillium mould killing bacteria in 1928."),
    Qz("Pasteurisation of milk is named after:", ["Jenner", "Fleming", "Pasteur", "Koch"], 2, "Louis Pasteur developed heating to kill spoilage microbes.") ],
  PP([ ["Define microorganisms and name four groups.", "Living organisms visible only under a microscope; bacteria, fungi, protozoa, algae (and viruses)."],
       ["Name the bacterium that converts milk into curd.", "Lactobacillus."],
       ["What is an antibiotic? Give one example.", "A medicine from microbes that kills or stops growth of bacteria; penicillin."],
       ["Name the vector of malaria and the one of dengue.", "Female Anopheles mosquito (malaria); female Aedes mosquito (dengue)."],
       ["What is pasteurisation?", "Heating milk to about 70 C for 15-30 seconds and quickly chilling it to kill harmful microbes."] ],
     [ ["Write the fermentation reaction of yeast and state two uses.", "C6H12O6 -> 2C2H5OH + 2CO2. Uses: baking (CO2 raises dough) and making alcohol (wine, beer)."],
       ["How do vaccines protect us? Who developed the first vaccine?", "A vaccine contains weakened or dead pathogens or their parts; the body makes antibodies and memory cells, so later infection is fought quickly. Edward Jenner developed the smallpox vaccine using cowpox."],
       ["Explain how nitrogen is fixed in nature by microbes.", "Rhizobium in legume root nodules and free-living Azotobacter and blue-green algae convert atmospheric N2 into nitrogen compounds usable by plants, improving soil fertility."],
       ["Describe four methods of food preservation with a reason for each.", "Heating/boiling kills microbes; refrigeration slows growth; salting (pickles, fish) removes water by osmosis; sugar (jam) removes water; oil or vinegar prevents microbial growth."],
       ["Differentiate between a vector and a pathogen with an example.", "A pathogen is the disease-causing microbe (Plasmodium); a vector is the carrier that transmits it without itself being ill (female Anopheles)."] ],
     [ ["A bacterium divides every 20 minutes. Starting with 5 cells, how many cells are present after 2 hours?", "2 h = 120 min = 6 divisions of 20 min. Cells = 5 x 2^6 = 5 x 64 = 320 cells."],
       ["A culture starts with one cell dividing every 20 minutes. How long to reach 1024 cells?", "1024 = 2^10, so 10 divisions are needed. Time = 10 x 20 = 200 min = 3 h 20 min."],
       ["Explain why antibiotics are ineffective against the common cold and why finishing the full course matters.", "The cold is caused by a virus; viruses lack the bacterial structures and metabolism that antibiotics target and live inside host cells. Stopping early leaves the toughest bacteria alive, which multiply and can become antibiotic-resistant."],
       ["Design a simple experiment to show that yeast produces gas on fermenting sugar.", "Mix yeast, sugar and warm water in a flask, close with a stopper and a delivery tube dipping in lime water. The lime water turns milky (CO2), and a control flask without sugar shows no change. Warmth speeds the process; too hot kills the yeast."],
       ["A village pond has an outbreak of cholera after floods. Explain how it spreads and give four preventive steps.", "Vibrio cholerae contaminates water and food (flies also carry it). Prevention: boil or chlorinate drinking water, wash hands, cover food and control flies, ensure proper sanitation, and give oral rehydration solution to patients."] ])),

C({ CBSE: "Synthetic Fibres and Plastics", ICSE: "Synthetic Fibres and Plastics", IB: "Made by Design: Polymers in Our World" },
  [ S("1. Synthetic Fibres",
      "A <b>polymer</b> is a very large molecule made by joining many small units called <b>monomers</b>. <b>Synthetic fibres</b> are polymers made from petrochemicals: <b>nylon</b> (a polyamide, first made by Wallace Carothers in 1935, strong and elastic), <b>polyester</b> (PET, terylene: wrinkle-resistant, quick-drying), and <b>acrylic</b> (artificial wool). <b>Rayon</b> is semi-synthetic: it is regenerated cellulose from wood pulp, so it is called artificial silk. Synthetic fibres absorb little water, are strong and cheap, but melt on heating and burn with a chemical smell.",
      "<b>Solved example:</b> A shirt is 60% cotton and 40% polyester by mass and weighs 250 g. Cotton = 0.60 x 250 = 150 g and polyester = 0.40 x 250 = 100 g."),
    S("2. Plastics: Thermoplastic and Thermosetting",
      "<b>Plastics</b> are polymers that can be moulded. <b>Thermoplastics</b> (polythene, PVC, polystyrene, PET) soften on heating and can be remoulded. <b>Thermosetting plastics</b> (Bakelite, melamine) set permanently once moulded and cannot be softened again. Bakelite is a poor conductor of heat and electricity, so it is used for switches and handles; melamine resists fire and is used for crockery and floor tiles. Teflon (PTFE) coats non-stick pans because it has very low friction and resists heat.",
      "<b>Solved example:</b> Why are pan handles made of Bakelite? It is a thermosetting plastic and a poor conductor of heat, so the handle stays cool and does not melt."),
    S("3. Properties, Environmental Impact and the 5 Rs",
      "Plastics are light, strong, corrosion-resistant, cheap and insulating, but most are <b>non-biodegradable</b>: microbes cannot break them down, so they persist, choke drains and harm animals. Burning plastics releases toxic gases such as hydrogen chloride (from PVC) and dioxins. Recycling is easier for thermoplastics, identified by codes 1 (PET), 2 (HDPE), 3 (PVC), 4 (LDPE), 5 (PP), 6 (PS). Follow the <b>5 Rs</b>: Reduce, Reuse, Recycle, Recover, Refuse.",
      "<b>Solved example:</b> Monomer of polythene is ethene, C2H4 (molar mass 28 u). A chain of 1000 units has mass 1000 x 28 = 28000 u.") ],
  [ ["Nylon-6,6", "Nylon-6,6 is formed by condensation of hexamethylenediamine and adipic acid, releasing a water molecule at each amide link."],
    ["PTFE", "Roy Plunkett discovered Teflon (polytetrafluoroethylene) accidentally in 1938; its C-F bonds are so strong that it resists nearly all chemicals."],
    ["Kevlar", "Kevlar is an aramid whose rigid chains line up and hydrogen-bond, giving a tensile strength per weight about five times that of steel."],
    ["Bakelite", "Bakelite, from phenol and formaldehyde (Leo Baekeland, 1907), was the first fully synthetic plastic; its cross-linked network makes it thermosetting."],
    ["Burn test", "Nylon melts and forms a hard bead, polyester melts with a black sooty flame, and rayon burns like paper without melting because it is cellulose."] ],
  [ Qz("The fibre known as artificial silk is:", ["Rayon", "Nylon", "Acrylic", "Teflon"], 0, "Rayon is regenerated cellulose with a silky lustre."),
    Qz("The non-stick coating on a frying pan is:", ["Bakelite", "PVC", "Nylon", "Teflon"], 3, "Teflon (PTFE) has very low friction."),
    Qz("A thermosetting plastic is:", ["Polythene", "Bakelite", "PVC", "PET"], 1, "Bakelite sets permanently on moulding."),
    Qz("Rayon is made from:", ["Petroleum", "Coal tar", "Wood pulp cellulose", "Natural gas"], 2, "It is regenerated from cellulose, so it is semi-synthetic."),
    Qz("On burning, which fibre melts and forms a hard bead?", ["Nylon", "Cotton", "Jute", "Paper"], 0, "Nylon is a thermoplastic that melts; natural cellulose fibres do not.") ],
  PP([ ["What is a polymer?", "A large molecule made of many repeating small units called monomers."],
       ["Name two synthetic fibres.", "Nylon and polyester (also acrylic)."],
       ["Why is rayon called semi-synthetic?", "It is made from natural cellulose of wood pulp by chemical treatment."],
       ["Name one thermosetting plastic and one use.", "Bakelite; electrical switches and handles (or melamine for crockery)."],
       ["What does non-biodegradable mean?", "It cannot be broken down by microorganisms, so it persists in the environment."] ],
     [ ["Differentiate thermoplastics from thermosetting plastics with an example each.", "Thermoplastics soften on heating and can be remoulded (polythene, PVC). Thermosetting plastics set permanently and cannot be softened again (Bakelite, melamine)."],
       ["List four characteristics of synthetic fibres that make them popular.", "Strong, durable, wrinkle-resistant, quick-drying, cheap, easy to maintain and absorb little water."],
       ["Why should we not wear synthetic clothes near fire or in a kitchen?", "They catch fire easily and melt, sticking to the skin and causing severe burns."],
       ["Explain the 5 Rs for plastic waste.", "Reduce use, Reuse items, Recycle into new products, Recover materials or energy, Refuse unnecessary plastic such as single-use bags."],
       ["State four uses of Teflon or PVC with the property behind each use.", "Teflon: non-stick pans (low friction), cable insulation (insulator). PVC: pipes (strong, corrosion-resistant), raincoats (waterproof)."] ],
     [ ["The monomer of PVC is vinyl chloride, C2H3Cl. Find its molar mass and the mass of a PVC chain of 800 units. (C=12, H=1, Cl=35.5)", "Monomer = 2 x 12 + 3 x 1 + 35.5 = 24 + 3 + 35.5 = 62.5 u. Chain = 800 x 62.5 = 50000 u."],
       ["A fabric blend of 400 g contains cotton, polyester and nylon in the mass ratio 5 : 2 : 1. Find the mass of each.", "Total parts = 8; one part = 400 / 8 = 50 g. Cotton = 5 x 50 = 250 g, polyester = 2 x 50 = 100 g, nylon = 50 g (sum 400 g)."],
       ["Explain why polyester-cotton (polycot) is popular, and a drawback of each fibre alone.", "Polycot combines cotton comfort and absorbency with polyester strength and wrinkle resistance. Cotton alone wrinkles and dries slowly; polyester alone is hot, absorbs little sweat and melts near flame."],
       ["A city dumps 3 tonnes of plastic daily, of which 40% is recycled. Find the mass left unrecycled in 30 days and suggest two steps to reduce it.", "Unrecycled daily = 60% of 3 t = 1.8 t. In 30 days = 1.8 x 30 = 54 tonnes. Steps: source segregation and deposit schemes, ban on single-use plastics, wider use of reusable bags."],
       ["A teflon-coated pan is used to cook food. Explain two properties of Teflon needed and why a Bakelite handle is attached.", "Needed: high melting/heat resistance and chemical inertness plus very low friction so food does not stick. Bakelite is thermosetting and a poor conductor of heat, so the handle neither melts nor burns the hand."] ])),

C({ CBSE: "Metals and Non-metals", ICSE: "Metals and Non-metals", IB: "Elements in Contrast: Reactivity and Use" },
  [ S("1. Physical Properties",
      "<b>Metals</b> are generally lustrous, hard, malleable (beaten into sheets), ductile (drawn into wires), sonorous and good conductors of heat and electricity, with high melting points. <b>Non-metals</b> are dull, brittle, non-sonorous and poor conductors. Exceptions: <b>mercury</b> is a liquid metal; sodium and potassium are soft and cut with a knife; <b>graphite</b> (carbon) conducts electricity; <b>iodine</b> is lustrous; diamond is the hardest natural substance; bromine is a liquid non-metal.",
      "<b>Solved example:</b> Why are electric wires made of copper or aluminium? Both are ductile and excellent electrical conductors, and copper is also corrosion resistant."),
    S("2. Chemical Properties and Reactivity",
      "Metals burn in oxygen to give basic oxides (2Mg + O2 -> 2MgO); non-metals give acidic oxides (C + O2 -> CO2), which turn blue litmus red when dissolved. Reactive metals react with dilute acids releasing hydrogen (Zn + 2HCl -> ZnCl2 + H2). In the <b>reactivity series</b> K > Na > Ca > Mg > Al > Zn > Fe > Pb > H > Cu > Ag > Au, a more reactive metal displaces a less reactive one from its salt solution (Fe + CuSO4 -> FeSO4 + Cu). Copper, silver and gold do not react with dilute HCl. Sodium is stored in kerosene because it reacts violently with air and water.",
      "<b>Solved example:</b> Will copper displace zinc from ZnSO4 solution? No, copper is below zinc in the reactivity series, so there is no reaction."),
    S("3. Corrosion, Alloys and Uses",
      "<b>Rusting</b> is the slow formation of hydrated iron(III) oxide (Fe2O3.xH2O) on iron in the presence of both <b>oxygen and water</b>; it is prevented by painting, oiling, <b>galvanisation</b> (zinc coating) and alloying. Copper turns green (basic copper carbonate) and silver black (Ag2S) on exposure. An <b>alloy</b> is a homogeneous mixture of a metal with other elements: brass (Cu + Zn), bronze (Cu + Sn), steel (Fe + C), solder (Sn + Pb). Non-metals are vital: oxygen for respiration, nitrogen for fertilisers, chlorine for water purification, carbon as fuel.",
      "<b>Solved example:</b> Why is aluminium not rusted despite being reactive? A thin, tough, self-healing layer of Al2O3 forms on its surface and protects the metal beneath.") ],
  [ ["Thermite", "Thermite reaction 2Al + Fe2O3 -> Al2O3 + 2Fe is so exothermic that the iron produced is molten; it is used for welding railway tracks."],
    ["Amphoteric oxides", "Al2O3 and ZnO react with both acids and bases, so they are amphoteric; most metal oxides are only basic."],
    ["Extreme metals", "Tungsten has the highest melting point (about 3422 C) of all metals, lithium is the least dense metal (0.53 g/cm3) and silver is the best electrical conductor."],
    ["Gallium", "Gallium melts at about 29.8 C, so it melts in your palm; with mercury and bromine it is one of the few elements liquid near room temperature."],
    ["Aqua regia", "A 3 : 1 mixture of conc. HCl and conc. HNO3 dissolves gold and platinum, which no single acid can attack."] ],
  [ Qz("Which element is a liquid metal at room temperature?", ["Bromine", "Mercury", "Sodium", "Iodine"], 1, "Mercury is the only common liquid metal; bromine is a non-metal."),
    Qz("Which metal is stored in kerosene?", ["Iron", "Copper", "Sodium", "Gold"], 2, "Sodium reacts vigorously with air and moisture."),
    Qz("Which metal does not react with dilute hydrochloric acid?", ["Copper", "Zinc", "Magnesium", "Iron"], 0, "Copper lies below hydrogen in the reactivity series."),
    Qz("Which non-metal is a good conductor of electricity?", ["Sulphur", "Diamond", "Iodine", "Graphite"], 3, "Graphite has free delocalised electrons."),
    Qz("Rusting of iron requires:", ["Oxygen only", "Oxygen and water", "Water only", "Nitrogen and water"], 1, "Both air (oxygen) and moisture are needed.") ],
  PP([ ["Name two properties of metals.", "Malleability and ductility (also lustre, conductivity, sonority)."],
       ["Name a non-metal that is lustrous and one liquid non-metal.", "Iodine is lustrous; bromine is a liquid non-metal."],
       ["What is an alloy? Give one example.", "A homogeneous mixture of a metal with other elements; brass."],
       ["Why is sodium kept in kerosene?", "It reacts vigorously with oxygen and water of the air."],
       ["What is galvanisation?", "Coating iron with zinc to prevent rusting."] ],
     [ ["Differentiate metals from non-metals on four properties.", "Metals: lustrous, malleable, ductile, conduct heat and electricity. Non-metals: dull, brittle, non-ductile, poor conductors."],
       ["Write the equations for burning magnesium and for carbon in oxygen and say which oxide is basic.", "2Mg + O2 -> 2MgO (basic oxide); C + O2 -> CO2 (acidic oxide)."],
       ["Predict, with reasons, whether Fe displaces copper from CuSO4 and whether Cu displaces Fe from FeSO4.", "Fe is more reactive than Cu, so Fe + CuSO4 -> FeSO4 + Cu occurs. Cu is less reactive, so no reaction with FeSO4."],
       ["Explain two methods to prevent rusting.", "Painting or oiling keeps out air and water; galvanisation coats iron with zinc, which is more reactive and protects the iron even if scratched."],
       ["State the composition and one use of brass, bronze and steel.", "Brass: Cu + Zn, musical instruments. Bronze: Cu + Sn, statues and medals. Steel: Fe + C, buildings and tools."] ],
     [ ["Magnesium burns: 2Mg + O2 -> 2MgO. Find the mass of MgO from 6 g of Mg. (Mg=24, O=16)", "2 x 24 = 48 g Mg gives 2 x 40 = 80 g MgO. So 6 g gives 6 x 80 / 48 = 10 g MgO (oxygen used = 4 g)."],
       ["Zn + 2HCl -> ZnCl2 + H2. Find the mass of hydrogen from 13 g of zinc. (Zn=65, H=1)", "65 g Zn gives 2 g H2. So 13 g gives 13 x 2 / 65 = 0.4 g H2."],
       ["An iron nail of 5.6 g reacts completely with excess CuSO4 solution: Fe + CuSO4 -> FeSO4 + Cu. Find the copper deposited. (Fe=56, Cu=63.5)", "56 g Fe gives 63.5 g Cu. So 5.6 g gives 5.6 x 63.5 / 56 = 6.35 g copper, and the nail turns coppery."],
       ["2Na + 2H2O -> 2NaOH + H2. Find the hydrogen released by 2.3 g of sodium and the mass of NaOH formed. (Na=23, O=16, H=1)", "46 g Na gives 2 g H2 and 80 g NaOH. For 2.3 g (one-twentieth): H2 = 0.1 g and NaOH = 4.0 g."],
       ["A student places iron nails in three test tubes: dry air with a drying agent, boiled water with oil on top, and moist air. Predict the result and conclude.", "Only the nail in moist air rusts. Tube 1 has no water and tube 2 has no dissolved air, so no rust. Conclusion: rusting needs both oxygen and water."] ])),

C({ CBSE: "Coal and Petroleum", ICSE: "Coal and Petroleum", IB: "Fossil Fuels: Origins, Uses and Costs" },
  [ S("1. Natural Resources and Coal",
      "Natural resources are <b>renewable</b> (sunlight, wind, water) or <b>exhaustible</b> (coal, petroleum, natural gas, minerals). <b>Fossil fuels</b> formed over millions of years from buried dead plants and animals under heat and pressure. <b>Coal</b> forms from plant matter by <b>carbonisation</b>, passing through peat, lignite, bituminous coal to anthracite (highest carbon, about 90 percent or more). <b>Destructive distillation</b> of coal (heating strongly in the absence of air) gives <b>coke</b> (almost pure carbon, used in steel making), <b>coal tar</b> (about 200 substances, used for dyes, drugs and road material) and <b>coal gas</b> (fuel).",
      "<b>Solved example:</b> Why is coal heated in the absence of air? In air it would burn to CO2; without air it decomposes into coke, coal tar and coal gas instead."),
    S("2. Petroleum and Natural Gas",
      "<b>Petroleum</b> (rock oil) is a dark, viscous mixture of hydrocarbons found trapped between rock layers, with natural gas above it. It is refined by <b>fractional distillation</b>: the heated crude rises in a column, and fractions condense at different heights by boiling point. From top (lowest boiling) to bottom: petroleum gas (LPG), petrol, naphtha, kerosene, diesel, lubricating oil, paraffin wax, bitumen. <b>Natural gas</b> is mainly <b>methane</b>, stored as <b>CNG</b> under high pressure and a clean fuel; it is also used to make fertilisers. India's petroleum is found in Assam (Digboi), Gujarat and Mumbai High.",
      "<b>Solved example:</b> Which fraction paves roads? Bitumen, the residue at the bottom of the column with the highest boiling range."),
    S("3. Uses, Conservation and Environmental Effects",
      "Uses: LPG for cooking, petrol in cars, kerosene for stoves and aircraft fuel, diesel for trucks, lubricants for machines, wax for candles, and <b>petrochemicals</b> from which plastics, fibres and detergents are made. Burning fossil fuels releases CO2 (global warming), CO, SO2 and nitrogen oxides (acid rain), and soot particles. Conservation: use public transport, switch off engines at signals, maintain vehicles, use CNG, and develop solar and wind power. The PCRA (Petroleum Conservation Research Association) advises on saving fuel.",
      "<b>Solved example:</b> A car runs 15 km per litre. For 450 km it needs 450 / 15 = 30 litres.") ],
  [ ["Octane number", "Petrol's octane number is the percentage of iso-octane in an iso-octane/heptane mixture that knocks equally; iso-octane is rated 100 and n-heptane 0."],
    ["Cracking", "Catalytic cracking breaks large hydrocarbons of heavy fractions into petrol-range molecules and alkenes, raising petrol yield from crude."],
    ["Carbon cycle", "Burning fossil fuels returns carbon locked away for millions of years in minutes of combustion; about 44 g of CO2 is made per 12 g of carbon burned."],
    ["Origin of oil", "Most oil derives from marine plankton and algae buried in oxygen-poor sediments, not from dinosaurs; kerogen cooks to oil at about 60-120 C."],
    ["Coal rank", "As coal ranks up from lignite to anthracite, carbon content rises and moisture and volatile matter fall, so heating value generally rises."] ],
  [ Qz("The highest rank (highest carbon) of coal is:", ["Peat", "Lignite", "Bituminous", "Anthracite"], 3, "Anthracite has the most carbon and burns cleanly."),
    Qz("In a fractionating column the fraction with the lowest boiling point is:", ["Diesel", "Petroleum gas", "Kerosene", "Bitumen"], 1, "Light gases rise to the top and condense last."),
    Qz("Almost pure carbon obtained from coal is:", ["Coal tar", "Coal gas", "Coke", "Bitumen"], 2, "Coke is used to make steel."),
    Qz("The main constituent of CNG is:", ["Methane", "Ethane", "Butane", "Propane"], 0, "Natural gas is mostly methane."),
    Qz("Which petroleum product is used for surfacing roads?", ["Kerosene", "Petrol", "Diesel", "Bitumen"], 3, "Bitumen is a thick residue used in asphalt.") ],
  PP([ ["Name two fossil fuels.", "Coal and petroleum (also natural gas)."],
       ["What is coke used for?", "Making steel and extracting metals (also as a smokeless fuel)."],
       ["Name two products of petroleum refining and one use of each.", "Petrol for cars; diesel for trucks; LPG for cooking; kerosene for stoves (any two)."],
       ["Why is petroleum called rock oil?", "It is found trapped in rock layers beneath the earth and is obtained by drilling."],
       ["What does CNG stand for?", "Compressed Natural Gas."] ],
     [ ["Describe how coal is formed.", "Dead vegetation in swamps was buried under soil and sediment; over millions of years heat and pressure slowly converted it into peat, lignite, bituminous coal and anthracite (carbonisation)."],
       ["Name the three products of destructive distillation of coal with one use each.", "Coke (steel making), coal tar (dyes, drugs, roads), coal gas (fuel)."],
       ["Explain fractional distillation of petroleum.", "Crude oil is heated and the vapours rise in a tall column that is hotter at the bottom. Each fraction condenses at the level matching its boiling point; light fractions collect at the top and heavy ones at the bottom."],
       ["Why is CNG considered a cleaner fuel than petrol or diesel?", "It burns almost completely, giving little CO, no lead, and less soot and particulates; it is also cheaper and mixes easily with air."],
       ["List four ways to conserve petroleum.", "Car-pooling or public transport, turning engines off at signals, regular servicing and correct tyre pressure, driving at steady speeds, using CNG, solar and wind energy."] ],
     [ ["A coal sample of 500 kg is 80% carbon. If all the carbon burns to CO2 (C + O2 -> CO2; C=12, O=16), find the mass of CO2 produced.", "Carbon = 0.80 x 500 = 400 kg. 12 kg C gives 44 kg CO2, so 400 kg gives 400 x 44 / 12 = 1466.7 kg (about 1467 kg) CO2."],
       ["Methane burns: CH4 + 2O2 -> CO2 + 2H2O. Find the CO2 and water formed from 8 g of methane. (C=12, H=1, O=16)", "16 g CH4 gives 44 g CO2 and 36 g H2O. So 8 g gives 22 g CO2 and 18 g H2O."],
       ["A car does 15 km per litre. A 450 km trip is planned with petrol at Rs 100 per litre. Find the fuel needed and the cost; if CNG gives the same trip for 30 kg at Rs 75 per kg, which is cheaper and by how much?", "Petrol = 450 / 15 = 30 L, cost = 30 x 100 = Rs 3000. CNG = 30 x 75 = Rs 2250. CNG is cheaper by Rs 750."],
       ["Explain why coal and petroleum are exhaustible and discuss two environmental consequences of burning them.", "They take millions of years to form but are consumed far faster than they are made. Burning releases CO2 causing global warming, and SO2 and NO2 causing acid rain that damages crops, buildings and water bodies."],
       ["Crude oil components are separated in a column. Arrange petrol, bitumen, kerosene and LPG from the top, justify the order, and state why the column is hotter at the bottom.", "Order from top: LPG, petrol, kerosene, bitumen. Smaller molecules have weaker intermolecular forces and lower boiling points, so they stay vapour longest and rise highest. The hot bottom keeps heavy, high-boiling fractions vaporised or flowing until they condense low down."] ])),

C({ CBSE: "Combustion and Flame", ICSE: "Combustion and Flame", IB: "Burning Questions: The Science of Fire and Fuels" },
  [ S("1. Combustion and Conditions for Burning",
      "<b>Combustion</b> is a chemical process in which a substance reacts with oxygen to give heat and light. A substance that burns easily is a <b>fuel</b>. Burning needs three things: <b>fuel, oxygen (air) and heat to reach the ignition temperature</b> (the lowest temperature at which a substance catches fire). Removing any one puts the fire out. Inflammable substances (petrol, alcohol, LPG) have a very low ignition temperature; white phosphorus ignites at about 35 C so is stored under water. Types: <b>rapid</b> (gas stove), <b>spontaneous</b> (phosphorus), <b>explosion</b> (fire-crackers).",
      "<b>Solved example:</b> Why does a burning piece of paper go out when covered with a glass jar? Oxygen is used up, so one condition for burning is removed."),
    S("2. Fire Control, Flame Structure and Fuels",
      "Water cools a fire below ignition temperature, but it must not be used on oil or electrical fires; use <b>carbon dioxide</b>, which is heavier than air and blankets the fuel, or sand. A candle flame has three zones: the <b>innermost dark zone</b> (unburnt wax vapour, least hot), the <b>middle luminous zone</b> (partial combustion, glowing carbon particles) and the <b>outermost non-luminous zone</b> (complete combustion, hottest), which goldsmiths use. A good fuel is cheap, easily available, burns easily, has a high calorific value and leaves little residue.",
      "<b>Solved example:</b> Why is the wick-end of a candle flame dark? There the wax vapour is unburnt because little oxygen reaches it."),
    S("3. Calorific Value and Harmful Effects of Burning",
      "The <b>calorific value</b> of a fuel is the heat produced by completely burning 1 kg of it, in kJ/kg. Approximate values: cow dung cake 6000-8000, wood 17000-22000, coal 25000-33000, petrol 45000, diesel 45000, methane 50000, LPG 55000, hydrogen 150000. Incomplete combustion gives poisonous carbon monoxide; burning fuels causes global warming (CO2), acid rain (SO2, NO2) and respiratory illness. Hydrogen is an excellent clean fuel (product is only water) but hard to store.",
      "<b>Solved example:</b> Heat from 2.5 kg of LPG = 2.5 x 55000 = 137500 kJ.") ],
  [ ["Fire tetrahedron", "Modern fire science adds the chemical chain reaction to fuel, oxygen and heat; halon-type agents work by interrupting this chain."],
    ["Davy lamp", "Humphry Davy's lamp surrounds the flame with wire gauze, which conducts heat away so methane outside is not ignited, making mines safer."],
    ["Candle in space", "In microgravity a candle flame is spherical and dim blue, because without buoyancy convection oxygen reaches it only by slow diffusion."],
    ["Dust explosion", "Fine flour or coal dust suspended in air burns explosively because the huge surface area allows extremely rapid combustion."],
    ["Metal fires", "Burning sodium or magnesium decomposes water and CO2, so water and CO2 extinguishers worsen the fire; dry sand or special powder is used."] ],
  [ Qz("Which zone of a candle flame is the hottest?", ["Outermost", "Middle", "Innermost", "All equally hot"], 0, "Complete combustion occurs in the outer zone."),
    Qz("Which of these fuels has the highest calorific value?", ["Coal", "LPG", "Hydrogen", "Petrol"], 2, "Hydrogen gives about 150000 kJ/kg."),
    Qz("Which agent is suitable for an electrical fire?", ["Water", "Kerosene", "Water-based foam", "Carbon dioxide"], 3, "CO2 does not conduct electricity and smothers the fire."),
    Qz("White phosphorus is stored under:", ["Kerosene", "Water", "Oil", "Air"], 1, "It catches fire in air at a very low temperature."),
    Qz("Ignition temperature is the:", ["Lowest temperature at which a substance catches fire", "Highest temperature of its flame", "Its boiling point", "Its melting point"], 0, "Below it a substance will not start burning.") ],
  PP([ ["Define combustion.", "A chemical process in which a substance burns in oxygen giving heat and light."],
       ["State the three conditions necessary for burning.", "Fuel, oxygen (air) and heat to reach ignition temperature."],
       ["Name the hottest part of a flame.", "The outermost non-luminous zone."],
       ["Define calorific value.", "Heat produced on completely burning 1 kg of fuel, in kJ/kg."],
       ["Name two gases produced that cause acid rain.", "Sulphur dioxide and nitrogen dioxide."] ],
     [ ["Why should water not be used on petrol fires?", "Petrol is lighter than water and does not mix, so it floats and spreads the burning layer. Use CO2 or foam to cut off oxygen."],
       ["Differentiate rapid, spontaneous combustion and explosion with examples.", "Rapid: burning of LPG. Spontaneous: ignition without outside heat, e.g. white phosphorus. Explosion: sudden burning with heat, light, sound and gas, e.g. fire-crackers."],
       ["Explain the three zones of a candle flame.", "Dark inner zone: unburnt vapour, coolest. Middle luminous zone: partial combustion, glowing carbon. Outer non-luminous zone: complete combustion, hottest."],
       ["List four qualities of an ideal fuel.", "Readily available, cheap, burns at moderate rate, high calorific value, little smoke or residue, safe to store."],
       ["How does incomplete combustion harm us? Give a safety rule.", "It produces carbon monoxide, which binds haemoglobin and prevents oxygen transport, causing fatal poisoning. Never burn coal or charcoal in closed rooms without ventilation."] ],
     [ ["Find the heat obtained from burning 4 kg of methane (calorific value 50000 kJ/kg) and the mass of LPG (55000 kJ/kg) giving the same heat.", "Heat = 4 x 50000 = 200000 kJ. LPG mass = 200000 / 55000 = 3.64 kg (about 3.6 kg)."],
       ["To heat 2 kg of water from 20 C to 100 C needs heat = m x c x change in T with c = 4.2 kJ/kg per C. Find it, then the wood (16800 kJ/kg) needed if the stove is 25% efficient.", "Heat = 2 x 4.2 x 80 = 672 kJ. Fuel energy needed = 672 / 0.25 = 2688 kJ. Wood = 2688 / 16800 = 0.16 kg = 160 g."],
       ["Hydrogen burns: 2H2 + O2 -> 2H2O. Find the water produced from 4 g of hydrogen and the oxygen used. (H=1, O=16)", "4 g H2 is 2 mol, so 2 mol water = 36 g. Oxygen = 1 mol = 32 g (check: 4 + 32 = 36 g)."],
       ["A family burns 30 kg of wood (20000 kJ/kg) per week. LPG (55000 kJ/kg) would be used at the same total heat. Find the heat and LPG mass; if LPG costs Rs 90 per kg find the weekly cost.", "Heat = 30 x 20000 = 600000 kJ. LPG = 600000 / 55000 = 10.9 kg. Cost = 10.9 x 90 = Rs 982 (approx; exactly 10.909 x 90 = Rs 981.8)."],
       ["A fire breaks out in an oil store and a student suggests water. Explain why that is wrong, and give the principle and method for extinguishing it.", "Oil floats on and spreads over water, and water may boil violently and splash burning oil. Correct method: remove oxygen with foam, CO2 or dry chemical powder (or sand), which smothers the fire and cools the fuel below its ignition temperature."] ])),

C({ CBSE: "Force and Pressure", ICSE: "Force and Pressure", IB: "Pushes, Pulls and Pressure: Cause and Effect" },
  [ S("1. Force and Its Effects",
      "A <b>force</b> is a push or a pull; its SI unit is the <b>newton (N)</b>. A force can change the speed, direction, or shape of an object. Forces acting on a body can be <b>balanced</b> (net force zero) or <b>unbalanced</b>; the net force of forces in the same direction is their sum, and in opposite directions is their difference. <b>Contact forces</b>: muscular, friction. <b>Non-contact forces</b>: gravitational, magnetic, electrostatic.",
      "<b>Solved example:</b> Two children push a box east with 20 N and 15 N while a third pulls west with 10 N. Net force = 20 + 15 - 10 = 25 N east."),
    S("2. Pressure and Its Applications",
      "<b>Pressure</b> is the force acting per unit area perpendicular to a surface: <b>P = F / A</b>. The SI unit is the <b>pascal</b> (1 Pa = 1 N/m^2). For the same force, a smaller area gives greater pressure, so knives and nails are sharp, while tractors have broad tyres and camels have wide feet. Skis spread weight over a large area to stop sinking in snow.",
      "<b>Solved example:</b> A force of 500 N acts on 0.25 m^2. P = 500 / 0.25 = 2000 Pa."),
    S("3. Pressure in Liquids, Gases and the Atmosphere",

C({ CBSE: "Friction", ICSE: "Friction", IB: "Resisting Motion: The Role of Friction" },
  [ S("1. Friction and Its Causes",
      "<b>Friction</b> is the force that opposes the relative motion (or tendency of motion) between two surfaces in contact. It arises from microscopic irregularities of the surfaces interlocking and from adhesion between them, so it is greater for rough surfaces and greater when surfaces are pressed together harder. Friction acts <b>along the surface, opposite to the direction of motion</b>, and produces heat. It depends on the nature of surfaces and the normal force, and in the simple model f = (mu) x N, where mu is the coefficient of friction.",
      "<b>Solved example:</b> A 20 kg box on a floor (g = 10 m/s^2, mu = 0.3) has N = 200 N, so friction = 0.3 x 200 = 60 N."),
    S("2. Types of Friction",
      "<b>Static friction</b> acts on a body at rest and rises to a maximum (<b>limiting friction</b>) just before motion begins; it equals the applied force until then. <b>Sliding (kinetic) friction</b> acts when one surface slides over another and is smaller than limiting friction. <b>Rolling friction</b> acts when a body rolls and is much smaller than sliding friction, which is why wheels and ball bearings are used. <b>Fluid friction (drag)</b> acts on bodies moving in liquids or gases. Order: rolling < sliding < static (limiting).",
      "<b>Solved example:</b> A 50 N push does not move a box whose limiting friction is 60 N. Static friction is 50 N, equal and opposite to the push, so the box stays at rest."),
    S("3. Friction: Advantages, Disadvantages and Control",
      "Friction is useful: it lets us walk, grip, write, brake vehicles, and hold nails. It is harmful too: it causes wear and tear, wastes energy as heat and slows machines. To <b>increase</b> friction use rough soles, tyre treads, grooves and sand on slippery roads. To <b>reduce</b> friction use <b>lubricants</b> (oil, grease), polishing, <b>ball bearings</b>, wheels, air cushions, and <b>streamlined</b> shapes for fluid friction.",
      "<b>Solved example:</b> Why are tyres grooved? The grooves grip the road and channel water away, so friction is retained on wet roads.") ],
  [ ["Amontons law", "For dry solids the friction force is nearly independent of the apparent area of contact, because the real contact area depends on the load; this is why f = mu x N works."],
    ["Gecko feet", "Geckos stick to walls through millions of tiny hairs (setae) using van der Waals forces, not suction or glue."],
    ["Meteors", "Meteors enter the atmosphere at speeds of roughly 11-72 km/s, and drag compresses and heats air to thousands of degrees, so they glow and burn up."],
    ["Aquaplaning", "On a wet road a thin water film can lift a tyre and cut friction almost to zero, so tread grooves are designed to pump water away."],
    ["Teflon and ice", "The coefficient of friction of PTFE on steel is only about 0.04-0.1, and ice on ice can be about 0.03, which is why both feel so slippery."] ],

/* ===== Chapter 3: Understanding Quadrilaterals ===== */
